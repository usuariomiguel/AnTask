<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Antask · Móvil v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Bricolage+Grotesque:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #e3d8c2; overflow: hidden; }
  #root { height: 100vh; }
  #stage { height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 120% at 50% 0%, #ece2cf 0%, #ddd0b6 60%, #d2c4a8 100%); }

  @keyframes mFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes antaskMenuIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* reflejo del cristal líquido que recorre la barra inferior */
  @keyframes lgShine { from { transform: translateX(-70%) rotate(-15deg); } to { transform: translateX(320%) rotate(-15deg); } }
  .lg-shine { animation: lgShine 7s ease-in-out infinite alternate; will-change: transform; }
  @media (prefers-reduced-motion: reduce) { .lg-shine { animation: none; } }

  /* scrollbars discretas dentro del teléfono */
  #root *::-webkit-scrollbar { width: 0; height: 0; }
  #root * { scrollbar-width: none; }

  /* controles reales: <button> sin apariencia nativa pero enfocables y accionables con teclado */
  .m-btn { appearance: none; -webkit-appearance: none; background: transparent; border: none; margin: 0; padding: 0; font: inherit; color: inherit; text-align: inherit; -webkit-tap-highlight-color: transparent; }
  .m-btn:disabled { cursor: default; }
  .m-btn:focus { outline: none; }
  .m-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#221d16"/>
    <rect x="34" y="20" width="32" height="60" rx="9" fill="none" stroke="#ad5230" stroke-width="4"/>
    <circle cx="50" cy="68" r="4" fill="#ad5230"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="themes.jsx"></script>
<script type="text/babel" src="inbox-view.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="notes-view.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="appearances.jsx"></script>
<script type="text/babel" src="pro-paywall.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="mobile-app-v3.jsx"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { MobileApp, IOSDevice, useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakColor, TweakRadio, TweakSelect } = window;
const { ANTASK_ACCENTS: ACCENTS, ANTASK_ACCENT_ORDER: ACCENT_ORDER, buildAppearanceTheme } = window;

/* Alcance v1: tema cálido "tierra" (claro/oscuro), sin Notas, sin biblioteca de
   apariencias ni PRO. Tweaks paralelos a la v1 de escritorio. */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "Oscuro",
  "accent": "arcilla",
  "titleFont": "Grotesca",
  "radius": 8
}/*EDITMODE-END*/;

function buildTheme(tw) {
  return buildAppearanceTheme({ ...tw, appearance: 'tierra', shell: 'Pegado' });
}

const W = 402, H = 874;

function Stage() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = buildTheme(tw);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => setScale(Math.min(1, (window.innerHeight - 36) / H, (window.innerWidth - 36) / W));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <React.Fragment>
      <div id="stage" style={{ background: theme.desk }}>
        <div style={{ width: W * scale, height: H * scale }}>
          <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
            <IOSDevice dark={theme.mode === 'dark'}>
              <MobileApp theme={theme} tw={tw} setTweak={setTweak} v1 />
            </IOSDevice>
          </div>
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Modo" />
        <TweakRadio label="Tema" value={tw.mode} options={['Claro', 'Oscuro']} onChange={(v) => setTweak('mode', v)} />
        <TweakSection label="Acento" />
        <TweakColor label="Color" value={theme.accent}
          options={ACCENT_ORDER.map((k) => ACCENTS[k].accent)}
          onChange={(hex) => { const k = ACCENT_ORDER.find((kk) => ACCENTS[kk].accent === hex) || 'arcilla'; setTweak('accent', k); }} />
        <TweakSection label="Tipografía del título" />
        <TweakRadio label="Fuente" value={tw.titleFont} options={['Grotesca', 'Sans', 'Serif']} onChange={(v) => setTweak('titleFont', v)} />
        <TweakSection label="Forma" />
        <TweakSlider label="Radio de esquinas" value={tw.radius} min={0} max={16} step={1} unit="px" onChange={(v) => setTweak('radius', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
</script>
</body>
</html>
