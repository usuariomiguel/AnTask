<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnTrack · La hormiga (maqueta móvil)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#e7cf9b; --kraft-tinta:#5d4a26;
  --hoja:#fbf4df; --hoja-2:#eddfba; --card:#fffcf1;
  --t1:#2b2213; --t2:#6f5f3e; --t3:#94845f;
  --o300:#a5b17d; --o400:#8c986d; --o500:#6b734c; --o600:#5b6240; --o700:#4b5135; --o800:#3e432a;
  --venc:#8f5853; --venc-rgb:143,88,83;
  --borde:rgba(80,56,10,.17); --borde-s:rgba(var(--sombra-rgb),.09);
  --tierra:#e3c58f; --tierra-2:#d6b073; --tierra-borde:#b78c56; --hueco:#f8eed6; --tierra-osc:#5e4426;
  --l-trabajo:#c25e3a; --l-casa:#3d6e85; --l-personal:#56867c; --l-lect:#b58236; --l-viajes:#96323a;
  --hoja-rgb:251,244,223; --sombra-rgb:80,55,10; --check-borde:rgba(80,56,10,.42); --punto:rgba(111,95,62,.32); --punto-kraft:rgba(93,74,38,.28);
  --huella:rgba(107,115,76,.6); --lente:rgba(255,252,241,.6); --nav-bg:rgba(255,252,241,.95); --hab-bg:rgba(255,252,241,.65);
  --kbd-bg:rgba(243,232,201,.5); --kraft-hover:rgba(255,250,235,.35); --home:rgba(43,34,19,.85);
  --bandeja:#e3c58f; --bandeja-borde:#b78c56; --sobre-acento:#fbf4df; --c-sombra:#ead6ab; --estrato:#c99f62; --hueco-hover:#fffaf0; --mota:#b78c56; --suelo:#b78c56; --nervio:#a5b17d; --tallo:#5b6240;
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-sans:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-sans);color:var(--t1);background-color:#cdb27c;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ico{display:block;flex:none}
.movil{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background-color:var(--kraft);background-image:var(--tex-kraft)}

/* Hormiga */
.hormiga{display:block;fill:currentColor;color:var(--o500);overflow:visible}
.h-antenas{transform-box:fill-box;transform-origin:14% 100%;animation:antenas 2.8s ease-in-out infinite}
@keyframes antenas{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}55%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.anda .h-arriba{animation:bote .28s ease-in-out infinite alternate}
@keyframes bote{to{transform:translateY(-12px)}}
.anda .h-patas{transform-box:fill-box;transform-origin:50% 0;animation:pasos .28s ease-in-out infinite alternate}
@keyframes pasos{from{transform:skewX(-11deg)}to{transform:skewX(11deg)}}
.duerme .h-antenas{animation:antenas-duerme 4.5s ease-in-out infinite}
@keyframes antenas-duerme{0%,100%{transform:rotate(26deg)}50%{transform:rotate(31deg)}}
.duerme .h-arriba{animation:respira 4.5s ease-in-out infinite}
@keyframes respira{50%{transform:translateY(-6px)}}
.cava .h-arriba{transform-box:fill-box;transform-origin:30% 90%;animation:cavar .45s ease-in-out infinite alternate}
@keyframes cavar{to{transform:rotate(9deg)}}

/* Barra de estado */
.estado{height:46px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 34px;font:600 15.5px var(--f-sans);color:var(--t1)}
.estado .ei{display:flex;align-items:center;gap:6px}
.estado svg{fill:currentColor;display:block}

/* Cabecera sobre el kraft */
.m-cab{padding:4px 18px 0 20px}
.m-fila1{display:flex;align-items:flex-start;justify-content:space-between}
.fecha{display:flex;align-items:flex-end;gap:12px;padding-top:4px}
.dia{font:700 66px/.78 var(--f-disp);font-variation-settings:"opsz" 96;letter-spacing:-.055em;color:var(--o800)}
.eyebrow{display:flex;align-items:center;gap:6px;font:650 13px var(--f-disp);color:var(--o600);margin-bottom:2px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dsem{font:650 24px/1 var(--f-disp);letter-spacing:-.025em}
.mes{font-size:13px;color:var(--kraft-tinta);margin-top:4px}
.m-herr{display:flex;gap:8px}
.m-herr button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background-color:var(--hoja);background-image:var(--tex-hoja);color:var(--t2);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 6px 12px -8px rgba(var(--sombra-rgb),.4)}
.rastro{margin-top:8px}
.rastro-svg{display:block;width:100%;height:auto;overflow:visible}
.rastro-pie{font-size:13px;color:var(--kraft-tinta);margin-top:-4px;padding-left:2px}
.rastro-pie b{color:var(--t1);font-weight:650}
.rastro-pie .venc{color:var(--venc);font-weight:600}
.tr-fondo{fill:none;stroke:var(--punto-kraft);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 10}
.tr-hecho{fill:none;stroke:var(--o600);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 10}
.suelo{fill:none;stroke:var(--suelo);stroke-width:2.4;stroke-linecap:round}
.monticulo{fill:var(--tierra-2)}
.entrada{fill:var(--tierra-osc)}
.hierba{fill:none;stroke:var(--o500);stroke-width:2;stroke-linecap:round}
.miga,.miga-llevada{fill:var(--o300)}
.rastro-svg .miga{fill:var(--o500)}
.miga{transition:opacity .5s}
.miga.oculta{opacity:0}
.e-fin #tr-hor .miga-llevada{display:none}

.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.sd{height:58px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sd-l{font:600 11px var(--f-sans);color:var(--kraft-tinta);opacity:.85}
.sd-n{font:650 18px/1.1 var(--f-disp);color:var(--t1)}
.sd.pasado .sd-n{color:var(--kraft-tinta)}
.sd.hoy{background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 8px 14px -10px rgba(var(--sombra-rgb),.45)}
.sd.hoy .sd-n{color:var(--o700)}
.sd.hoy .sd-l{color:var(--o600)}
.sd-m{display:flex;gap:2px;height:4px}
.sd-m i{width:4px;height:4px;border-radius:50%;background:var(--o500)}
.sd-m i.f{background:var(--punto-kraft)}

/* La hoja, con pestañas de carpeta */
.m-hoja{position:absolute;left:0;right:0;bottom:0;background-color:var(--hoja);background-image:var(--tex-hoja);border-radius:26px 26px 0 0;box-shadow:0 -1px 0 rgba(var(--sombra-rgb),.06),0 -12px 30px -18px rgba(var(--sombra-rgb),.45)}
.m-hoja::after{content:"";position:absolute;left:0;right:0;bottom:0;height:176px;background:linear-gradient(rgba(var(--hoja-rgb),0),rgba(var(--hoja-rgb),.97) 46%);pointer-events:none;z-index:4}
.m-pestanas{position:absolute;left:16px;top:-35px;display:flex;gap:4px}
.m-pest{height:36px;padding:0 16px;border-radius:14px 14px 0 0;background:var(--hoja-2);color:var(--t2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.m-pest.on{background-color:var(--hoja);background-image:var(--tex-hoja);color:var(--o800);box-shadow:0 -8px 14px -10px rgba(var(--sombra-rgb),.4)}
.m-pest span{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(107,115,76,.14);color:var(--o700)}
.m-pest:not(.on) span{background:var(--punto-kraft);color:var(--t2)}
.m-cuerpo{position:absolute;inset:0;overflow:hidden;padding:8px 14px 0;border-radius:26px 26px 0 0}
.capa{position:absolute;inset:0;pointer-events:none;z-index:5}

.sec-cab{display:flex;align-items:center;gap:9px;height:38px;padding:0 4px 0 8px}
.sec-tit{font:650 16px var(--f-disp);letter-spacing:-.01em}
.sec-n{font-size:12px;font-weight:600;color:var(--t2);border:1px solid var(--borde);border-radius:999px;padding:0 7px}
.puntos{flex:1;height:6px;background:radial-gradient(circle,var(--punto) 1.25px,transparent 1.7px) 0 50%/9px 6px repeat-x}
.sec--venc .sec-tit{color:var(--venc)}
.sec--venc .sec-n{color:var(--venc);border-color:rgba(var(--venc-rgb),.3)}
.accion{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc)}

.fila{position:relative;height:60px;border-radius:16px;overflow:hidden}
.fila-in{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;height:60px;padding:0 8px}
.f-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.check-wrap{position:relative;width:24px;height:24px;display:grid;place-items:center}
.check{position:relative;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--check-borde);display:grid;place-items:center}
.chk-bg{position:absolute;inset:-2px;border-radius:50%;background:var(--o500);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.check svg{position:relative;width:15px;height:15px;fill:none;stroke:var(--sobre-acento);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:21;stroke-dashoffset:21;transition:stroke-dashoffset .3s .12s ease-out}
.hecha .chk-bg{transform:scale(1)}
.hecha .check svg{stroke-dashoffset:0}
.hecha .check{border-color:transparent}
.sub-anillo{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;pointer-events:none}
.titulo{position:relative;align-self:flex-start;max-width:100%;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tachon{position:absolute;left:-3px;width:calc(100% + 6px);top:50%;height:10px;margin-top:-4px;overflow:visible;pointer-events:none;clip-path:inset(-4px 100% -4px -4px)}
.tachon path{fill:none;stroke:var(--t2);stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fila.hecha .tachon{clip-path:inset(-4px -4px -4px -4px)}
.fila.hecha .texto{color:var(--t3)}
.meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--t2);white-space:nowrap}
.meta>span{display:inline-flex;align-items:center;gap:4px}
.bandera{color:var(--l-trabajo)}
.lista i{width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:1px}
.lista span{color:var(--t2)}
.pastilla{padding:2px 9px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc);font-weight:600;font-size:12px}
.fila.hecha .meta{opacity:.7}

/* Llevarse */
.hor-pos{position:absolute;left:0;top:0}
.hor-dir{width:100%;height:100%}
.hor-dir .hormiga{width:100%;height:100%}
.carga{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 4px;border-radius:999px;background:var(--card);border:1px solid var(--borde);box-shadow:0 8px 16px -8px rgba(var(--sombra-rgb),.5),0 1px 2px rgba(var(--sombra-rgb),.12);font-size:12.5px;color:var(--t3);white-space:nowrap;max-width:158px}
.mini-check{width:16px;height:16px;border-radius:50%;background:var(--o500);display:grid;place-items:center;flex:none}
.mini-check svg{width:10px;height:10px;fill:none;stroke:var(--sobre-acento);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.carga .tx{overflow:hidden;text-overflow:ellipsis;text-decoration:line-through;text-decoration-color:var(--t2);text-decoration-thickness:1.5px}
.huellas{position:absolute;height:7px;background:radial-gradient(circle at 2px 1.6px,var(--huella) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x,radial-gradient(circle at 7.5px 5.2px,var(--huella) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x}

/* Barra inferior + botón de captura con su hormiga */
.m-nav{position:absolute;left:16px;bottom:26px;height:62px;width:286px;border-radius:999px;background:var(--nav-bg);border:1px solid var(--borde);box-shadow:0 14px 30px -14px rgba(var(--sombra-rgb),.55),0 1px 2px rgba(var(--sombra-rgb),.1);display:flex;justify-content:space-around;align-items:center;z-index:8;padding:0 6px}
.m-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:10.5px;color:var(--t2);padding:6px 12px;border-radius:999px;min-width:58px}
.m-nav button.on{color:var(--o700);background:rgba(107,115,76,.13)}
.m-av{width:30px;height:30px;border-radius:50%;background:var(--o300);display:grid;place-items:center;font:700 13px var(--f-disp);color:var(--o800);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--o400)}
.m-nav button.on .m-av{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--o600)}
.m-fab{position:absolute;right:16px;bottom:26px;width:62px;height:62px;border-radius:50%;background:var(--o500);color:var(--sobre-acento);display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(62,67,42,.75);z-index:8}
.fab-hor{position:absolute;left:17px;top:-26px;width:30px;height:30px;pointer-events:none}
.fab-hor .hormiga{width:100%;height:100%;filter:drop-shadow(0 0 1.5px var(--hoja)) drop-shadow(0 0 1.5px var(--hoja)) drop-shadow(0 0 1px var(--hoja))}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--home);transform:translateX(-50%);z-index:9}

/* Día terminado */
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.vacio>svg{display:block;height:auto}
.vacio h2{font:700 29px/1.05 var(--f-disp);letter-spacing:-.03em;margin-top:4px}
.vacio p{color:var(--t2);font-size:15px;line-height:1.45;margin-top:7px;max-width:300px}
.vacio-acc{display:flex;gap:8px;margin-top:16px}
.btn-oliva{display:inline-flex;align-items:center;gap:7px;background:var(--o500);color:var(--sobre-acento);font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 4px 10px -4px rgba(62,67,42,.6)}
.btn-sec{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borde);color:var(--t2);font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px}
.zzz{font:700 18px var(--f-disp);fill:var(--o500);animation:zzz 3.3s ease-in-out infinite;opacity:0}
.zzz:nth-of-type(2){animation-delay:1.1s}
.zzz:nth-of-type(3){animation-delay:2.2s}
@keyframes zzz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.9}100%{opacity:0;transform:translate(10px,-14px)}}
.hamaca{fill:var(--o400)}
.nervio{fill:none;stroke:var(--nervio);stroke-width:2;stroke-linecap:round}
.tallo{fill:none;stroke:var(--tallo);stroke-width:5;stroke-linecap:round}
.hojita{fill:var(--o500)}
.v-suelo{fill:none;stroke:var(--punto);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:0 9}

/* Hábitos */
.fila-larga{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:18px;background:rgba(107,115,76,.1);margin:4px 0 12px}
.fl-tx b{display:block;font:700 26px/1 var(--f-disp);letter-spacing:-.03em;color:var(--o800)}
.fl-tx span{font-size:12.5px;color:var(--t2)}
.fl-hor{display:flex;width:100%;gap:0 4px}
.fl-hor .r-hor{width:20px;height:20px}
.r-hor{display:inline-block}
.r-hor .hormiga{width:100%;height:100%}
.r-hor .h-antenas{animation-delay:var(--d)}
.r-hor:nth-child(even){transform:translateY(-2px)}
.hab{padding:12px 12px 10px;border-radius:18px;background:var(--hab-bg);border:1px solid var(--borde-s);margin-bottom:10px}
.hab-top{display:flex;align-items:center;gap:12px}
.hab-tx{min-width:0;flex:1}
.hab-tx b{display:block;font-weight:600;font-size:15.5px}
.hab-tx small{font-size:12.5px;color:var(--t2)}
.hab-n{font:700 22px/1 var(--f-disp);color:var(--o600);display:flex;align-items:center;gap:4px}
.hab-n .hormiga{width:18px;height:18px}
.hab-sem{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px}
.hs{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px var(--f-sans);color:var(--t3)}
.hs i{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.hs i .hormiga{width:21px;height:21px}
.hs.hoy{color:var(--o600)}
.hs.hoy i{box-shadow:inset 0 0 0 1.6px var(--o400)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--punto)}
.hs.fut .dot{background:var(--punto)}
.hs .nueva{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.hab .check-wrap{flex:none}

/* Actividad */
.act-tit{font:700 34px/1 var(--f-disp);letter-spacing:-.04em;color:var(--o800);margin-top:2px}
.m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.m-stats div{display:flex;flex-direction:column;padding:10px 12px;border-radius:15px;background:var(--kraft-hover)}
.m-stats b{font:700 24px/1 var(--f-disp);letter-spacing:-.03em}
.m-stats span{font-size:11.5px;color:var(--kraft-tinta);margin-top:4px}
.nido{display:block;width:100%;height:auto}
.tierra{fill:var(--tierra)}
.estrato{fill:var(--estrato);opacity:.2}
.mota{fill:var(--mota)}
.guijarro{fill:var(--tierra-2);stroke:var(--tierra-borde);stroke-width:1.2}
.t-borde{fill:none;stroke:var(--tierra-borde);stroke-width:21;stroke-linecap:round}
.t-hueco{fill:none;stroke:var(--hueco);stroke-width:14;stroke-linecap:round}
.c-borde{fill:var(--tierra-borde)}
.c-borde-cav{fill:none;stroke:var(--tierra-borde);stroke-width:3.5;stroke-dasharray:5 6}
.c-sombra{fill:var(--c-sombra)}
.c-hueco{fill:var(--hueco)}
.etq-1{font:650 12.5px var(--f-disp);fill:var(--t1)}
.etq-2{font:500 11.5px var(--f-sans);fill:var(--t2)}
.cavando .etq-1{fill:var(--o600)}
.tierra-salta{fill:var(--mota);animation:salta 1s ease-out infinite}
@keyframes salta{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

/* Inbox */
.m-tit{font:700 40px/1 var(--f-disp);letter-spacing:-.04em;color:var(--o800);margin-top:10px}

/* ═══ Modo oscuro (tokens de :root en style.css) + toques de noche ═══ */
:root[data-theme="dark"]{
  --kraft:#211a15; --kraft-tinta:#c4ad86;
  --hoja:#352b23; --hoja-2:#2b231c; --card:#40342b; --hoja-rgb:53,43,35;
  --t1:#e6d1aa; --t2:#cdb690; --t3:#a08d6c;
  --o300:#c9d59b; --o400:#6f7a48; --o500:#a4b272; --o600:#b4c182; --o700:#c4d195; --o800:#d6e0ad;
  --venc:#d8a99b; --venc-rgb:196,122,106;
  --borde:rgba(255,226,190,.16); --borde-s:rgba(255,226,190,.08);
  --tierra:#2a2119; --tierra-2:#5a4634; --tierra-borde:#1c1611; --hueco:#54412f; --tierra-osc:#f2c46d;
  --l-trabajo:#e08a66; --l-casa:#7fb0c7; --l-personal:#7fc0b2; --l-lect:#d9a85e; --l-viajes:#d27d84;
  --sombra-rgb:0,0,0; --check-borde:rgba(255,226,190,.42); --punto:rgba(255,226,190,.24); --punto-kraft:rgba(255,226,190,.22);
  --huella:rgba(164,178,114,.6); --lente:rgba(255,238,214,.08); --nav-bg:rgba(64,52,43,.96); --hab-bg:rgba(255,238,214,.04);
  --kbd-bg:rgba(255,238,214,.05); --kraft-hover:rgba(255,238,214,.06); --home:rgba(230,209,170,.8);
  --bandeja:#5a4634; --bandeja-borde:#7a6148; --sobre-acento:#211a15; --c-sombra:#3f3226; --estrato:#1c1611; --hueco-hover:#7a6148; --mota:#4f3f30; --suelo:#6b5640; --nervio:#8c9a65; --tallo:#7d8a55;
}
[data-theme="dark"] .avatar,[data-theme="dark"] .m-av{background:#576038;color:#e6d1aa}
[data-theme="dark"] .hoja{box-shadow:0 0 0 1px rgba(255,226,190,.07),0 2px 3px rgba(0,0,0,.25),0 24px 50px -24px rgba(0,0,0,.7)}
[data-theme="dark"] .m-hoja{box-shadow:0 -1px 0 rgba(255,226,190,.08),0 -12px 30px -18px rgba(0,0,0,.7)}
[data-theme="dark"] .entrada{filter:drop-shadow(0 0 5px rgba(242,196,109,.85))}
[data-theme="dark"] .c-hueco{fill:url(#brillo-camara)}
[data-theme="dark"] .camara:hover .c-hueco{fill:var(--hueco-hover)}
[data-theme="dark"] .zzz{fill:#f1e2b8}
.estrella{display:none;fill:#f3e6bf}
[data-theme="dark"] .estrella{display:inline;animation:titila 2.6s ease-in-out infinite alternate}
@keyframes titila{from{opacity:.2}to{opacity:.9}}
.noche{display:none}
[data-theme="dark"] .noche{display:inline}
.luna{fill:#f1e2b8;opacity:.92}
.luciernaga{fill:#f5d77a;filter:drop-shadow(0 0 4px #f5d77a);animation:luci 3.6s ease-in-out infinite alternate}
@keyframes luci{0%{opacity:.15;transform:translate(0,0)}100%{opacity:1;transform:translate(7px,-9px)}}

/* ═══ Añadido el 23-nov-2026: Notas y Agenda ═══
   Solo clases nuevas (y alguna existente reutilizada tal cual, como
   .sec-cab o .lista), así que las pantallas de antes se pintan igual. */
:root{--cinta:rgba(165,177,125,.55);--cinta-raya:rgba(255,252,241,.4);--cal-google:#3d6e85;--cal-icloud:#b58236}
:root[data-theme="dark"]{--cinta:rgba(164,178,114,.3);--cinta-raya:rgba(255,238,214,.07);--cal-google:#7fb0c7;--cal-icloud:#d9a85e}
.m-nav.con-notas button{min-width:0;padding:6px 12px}

/* Notas */
.n-sub{font-size:13px;color:var(--kraft-tinta);margin-top:6px}
/* Dos columnas de verdad y no `columns`: al repartir, Chrome partía una
   tarjeta y pintaba su cinta dos veces. */
.notas{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;padding:2px 2px 4px}
.notas>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.nota{position:relative;padding:13px 13px 11px;border-radius:16px;background:var(--card);border:1px solid var(--borde-s);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.07),0 8px 16px -12px rgba(var(--sombra-rgb),.35)}
.nota.fijada{margin-top:9px}
.nota h3{font:650 15px/1.2 var(--f-disp);letter-spacing:-.01em;color:var(--t1)}
.nota p{font-size:13px;line-height:1.42;color:var(--t2);margin-top:5px}
.nota-pie{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;font-size:11.5px;color:var(--t3)}
.nota-pie .lista{display:inline-flex;align-items:center;gap:4px}
.cinta{position:absolute;left:50%;top:-9px;width:58px;height:17px;margin-left:-29px;transform:rotate(-4deg);border-radius:2px;background:repeating-linear-gradient(90deg,var(--cinta) 0 6px,var(--cinta-raya) 6px 8px)}
.nota-lista{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.nota-lista li{display:flex;align-items:flex-start;gap:7px;font-size:13px;line-height:1.3;color:var(--t1);cursor:pointer}
.nl-c{flex:none;width:15px;height:15px;margin-top:1px;border-radius:50%;border:1.6px solid var(--check-borde);display:grid;place-items:center}
.nl-c svg{width:9px;height:9px;fill:none;stroke:var(--sobre-acento);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.nota-lista li.ok .nl-c{background:var(--o500);border-color:transparent}
.nota-lista li.ok .nl-c svg{opacity:1}
.st{position:relative}
.nota-lista li.ok .st,.det-subs li.ok .st{color:var(--t3)}
.nota-lista li.ok .tachon,.det-subs li.ok .tachon{clip-path:inset(-4px -4px -4px -4px)}
.nota-acc{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-weight:600;font-size:12px;color:var(--o600);padding:4px 10px;border-radius:999px;background:rgba(107,115,76,.12)}

/* Agenda: el día por horas */
.sh-pista{font-size:11.5px;color:var(--t3);white-space:nowrap}
.sin-hora{display:flex;gap:6px;overflow:hidden;padding:0 4px 2px 8px;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.sh-chip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:200px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--card);border:1px dashed var(--check-borde);font-size:12.5px;color:var(--t1);white-space:nowrap}
.sh-chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.sh-chip span{overflow:hidden;text-overflow:ellipsis}
.sh-chip .ico{color:var(--t3);margin-left:2px}
.ag{position:relative;margin-top:10px}
.ag-h{position:absolute;left:0;right:0;height:0}
.ag-h b{position:absolute;left:0;width:36px;top:-8px;text-align:right;font:600 11px var(--f-sans);color:var(--t3);font-variant-numeric:tabular-nums}
.ag-h::after{content:"";position:absolute;left:46px;right:4px;top:-3px;height:6px;background:radial-gradient(circle,var(--punto) 1.1px,transparent 1.6px) 0 50%/9px 6px repeat-x}
.ag-b{position:absolute;display:flex;gap:7px;padding:6px 8px 0 11px;border-radius:12px;overflow:hidden}
.ag-b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--c)}
.ag-tarea{background:var(--card);border:1px solid var(--borde);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.08),0 6px 12px -10px rgba(var(--sombra-rgb),.35)}
.ag-ev{background:color-mix(in srgb,var(--c) 14%,var(--hoja));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.ag-ev .ag-tit{color:color-mix(in srgb,var(--c) 55%,var(--t1))}
.ag-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.ag-tit{font-size:14px;font-weight:600;line-height:1.22;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag-meta .bandera{display:inline-flex}
.ag-check{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.6px solid var(--check-borde);display:grid;place-items:center;cursor:pointer}
.ag-check svg{width:11px;height:11px;fill:none;stroke:var(--sobre-acento);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ag-b.hecha .ag-check{background:var(--o500);border-color:transparent}
.ag-b.hecha .ag-check svg{opacity:1}
.ag-b.hecha .ag-tit{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2)}
.ag-b.estrecho .ag-tit{-webkit-line-clamp:2}
.ag-b.estrecho .ag-meta{flex-wrap:wrap;row-gap:1px}
.ag-b.corto{align-items:center;padding-top:0}
.ag-b.corto .ag-tx{flex-direction:row;align-items:baseline;gap:8px}
.ag-b.corto .ag-tit{-webkit-line-clamp:1}
.ag-hab{border-radius:999px;background:rgba(107,115,76,.13);border:1px solid rgba(107,115,76,.24);padding:0 10px 0 6px}
.ag-hab::before{display:none}
.ag-hab .r-hor{width:17px;height:17px;flex:none}
.ag-ahora{position:absolute;left:44px;right:2px;height:2px;margin-top:-1px;border-radius:2px;background:var(--o500);z-index:3}
.ag-ahora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--o500);box-shadow:0 0 0 3px var(--hoja)}
.m-cab--mini .dia{font-size:46px}
.m-cab--mini .dsem{font-size:20px}
.m-cab--mini .fecha{gap:10px}
.m-cab--mini .semana{margin-top:8px}
.m-cab--mini .sd{height:50px;cursor:pointer}
.e-agenda .sd.sel:not(.hoy){background-color:var(--kraft-hover);box-shadow:inset 0 0 0 1.5px var(--o400)}
.ag-ahora-t{position:absolute;left:0;width:36px;margin-top:-8px;text-align:right;font:700 11px var(--f-sans);color:var(--o600);z-index:3;font-variant-numeric:tabular-nums}

/* ═══ Añadido el 23-nov-2026: Inbox con listas y detalle de tarea ═══ */
.inb-sub{font-size:13px;color:var(--kraft-tinta);margin-top:6px}
.lch-fila{display:flex;gap:6px;margin:14px -18px 0 -20px;padding:2px 18px 6px 20px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent);mask-image:linear-gradient(90deg,#000 84%,transparent)}
.lch{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 9px;border-radius:14px;background:var(--kraft-hover);font-weight:600;font-size:13.5px;color:var(--t1);white-space:nowrap}
.lch small{font-size:11.5px;font-weight:600;color:var(--kraft-tinta);font-variant-numeric:tabular-nums}
.lch.on{background-color:var(--hoja);background-image:var(--tex-hoja);color:var(--o800);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 8px 14px -10px rgba(var(--sombra-rgb),.45)}
.lch.on small{color:var(--o600)}
.lch svg{display:block;flex:none}
.sec-punto{width:8px;height:8px;border-radius:50%;flex:none;margin-right:-2px}
.sec-punto.sin{background:none;box-shadow:inset 0 0 0 1.6px var(--t3)}
.pastilla-n{padding:2px 9px;border-radius:999px;border:1px solid var(--borde);color:var(--t2);font-weight:600;font-size:12px}
.pastilla-n.hoy{border-color:rgba(107,115,76,.32);background:rgba(107,115,76,.09);color:var(--o600)}
.inb-fila{cursor:pointer}
.fila.una,.fila.una .fila-in{height:48px}

/* Detalle: una hoja que sube sobre el Inbox, que se queda detrás, encogido */
.e-detalle .movil,.e-detalle-abajo .movil{background-color:#1a140e;background-image:none}
.det-fondo{position:absolute;inset:0;transform:translateY(16px) scale(.92);transform-origin:50% 0;border-radius:26px;overflow:hidden;background-color:var(--kraft);background-image:var(--tex-kraft)}
.det-velo{position:absolute;inset:0;background:rgba(43,34,19,.34);z-index:6}
[data-theme="dark"] .det-velo{background:rgba(0,0,0,.5)}
.det-estado{position:absolute;left:0;right:0;top:0;z-index:8;color:#fbf4df}
.det-estado .estado{color:inherit}
.det-hoja{position:absolute;left:0;right:0;top:62px;bottom:0;z-index:7;overflow-y:auto;scrollbar-width:none;padding:0 16px;border-radius:26px 26px 0 0;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 -14px 34px -16px rgba(0,0,0,.5)}
.det-asa{width:40px;height:5px;border-radius:3px;margin:9px auto 4px;background:var(--punto)}
.det-cab{display:flex;align-items:center;justify-content:space-between;height:44px}
.det-lista{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 11px;border-radius:999px;border:1px solid var(--borde);font-weight:600;font-size:13.5px;color:var(--t1)}
.det-lista i{width:8px;height:8px;border-radius:50%}
.det-lista .ico{color:var(--t3)}
.det-btns{display:flex;gap:6px}
.det-btns>*{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:var(--hab-bg);border:1px solid var(--borde-s)}
.det-tit{display:flex;align-items:flex-start;gap:12px;padding:12px 4px 4px}
.det-tit .check-wrap{margin-top:3px;flex:none}
.det-tit h2{font:650 24px/1.12 var(--f-disp);letter-spacing:-.025em;color:var(--t1)}
.det-tit.hecha h2{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2);text-decoration-thickness:2px}
.det-sec{margin-top:12px}
.det-sec .sec-cab{padding-left:4px}
.det-sec .sec-tit{font-size:14.5px;color:var(--t2)}
.det-chips{display:flex;gap:6px;padding:2px 0 10px}
.det-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--borde);background:var(--card);font-weight:600;font-size:13.5px;color:var(--t2);white-space:nowrap}
.det-chip.on{background:var(--o500);border-color:transparent;color:var(--sobre-acento)}
.det-filas{border-radius:18px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:0 12px}
.det-fila{display:flex;align-items:center;gap:12px;height:46px;font-size:15px;color:var(--t1)}
.det-fila+.det-fila{border-top:1.6px dotted var(--punto)}
.det-fila>.ico{color:var(--t2)}
.det-fila .bandera{color:var(--l-trabajo)}
.det-valor{margin-left:auto;color:var(--t2);font-size:14px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.det-valor .ico{color:var(--t3)}
.det-sw{position:relative;width:40px;height:24px;border-radius:999px;background:var(--o500);margin-left:auto}
.det-sw::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sobre-acento);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.det-subs{list-style:none;padding:0 4px}
.det-subs li{display:flex;align-items:center;gap:11px;height:36px;font-size:15px;color:var(--t1);cursor:pointer}
.det-subs .nl-c{width:19px;height:19px;margin:0}
.det-subs .nl-c svg{width:11px;height:11px}
.det-subs li.ok .nl-c{background:var(--o500);border-color:transparent}
.det-subs li.ok .nl-c svg{opacity:1}
.det-subs li.anadir{color:var(--t3)}
.det-subs li.anadir .ico{width:19px;height:19px}
.det-enlace{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--borde-s);font-size:14px;color:var(--t1);white-space:nowrap}
.det-enlace .ico{color:var(--t2)}
.det-enlace span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.det-enlace span em{font-style:normal;color:var(--t3)}
.det-enlace .ico:last-child{margin-left:auto;color:var(--t3)}
.det-nota{border-radius:16px;border:1px solid var(--borde-s);padding:8px 14px 12px;min-height:110px;font-size:14.5px;line-height:26px;color:var(--t1);background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 25px,var(--borde) 25px 26px);background-position:0 8px}
.det-acc{display:flex;gap:8px;margin:18px 0 30px}
.det-acc button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:7px;height:44px;border-radius:999px;border:1px solid var(--borde);font-weight:600;font-size:14px;color:var(--t2)}
.det-acc .det-borrar{border-color:rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc)}

/* ═══ Añadido el 25-nov-2026: captura rápida, búsqueda y menú lateral (móvil) ═══ */
:root{--teclado:#d9d2c3;--tecla:#fbf7ee;--tecla-2:#bfb6a4;--tecla-t:#2b2213}
:root[data-theme="dark"]{--teclado:#1d1813;--tecla:#4a3f35;--tecla-2:#352c25;--tecla-t:#e6d1aa}
.velo{position:absolute;inset:0;background:rgba(43,34,19,.38);z-index:20}
[data-theme="dark"] .velo{background:rgba(0,0,0,.55)}
/* Captura */
.cr-hoja{position:absolute;left:0;right:0;bottom:262px;z-index:22;padding:14px 16px 14px;border-radius:24px 24px 0 0;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 -14px 30px -16px rgba(0,0,0,.45)}
.cr-hoja .det-asa{margin:-4px auto 10px}
.cr-input{position:relative;min-height:56px;padding:12px 14px;border-radius:16px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--o500) 45%,transparent);font-size:17px;line-height:1.5;color:var(--t1)}
.cr-input .cursor{display:inline-block;width:2px;height:20px;margin-left:1px;vertical-align:-4px;background:var(--o500);animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.tok{border-radius:6px;padding:0 3px;margin:0 -1px;font-weight:600}
.tok.tk-fecha{background:rgba(107,115,76,.16);color:var(--o700)}
.tok.tk-hora{background:rgba(61,110,133,.14);color:var(--l-casa)}
.tok.tk-lista{background:color-mix(in srgb,var(--l-personal) 16%,transparent);color:var(--l-personal)}
.tok.tk-prio{background:rgba(var(--venc-rgb),.12);color:var(--venc)}
.cr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cr-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--borde);font-weight:600;font-size:12.5px;color:var(--t1)}
.cr-chip .ico{color:var(--t2)}
.cr-chip i{width:7px;height:7px;border-radius:50%}
.cr-chip em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--o600);background:rgba(107,115,76,.14);padding:1px 5px;border-radius:5px}
.cr-chip .x{color:var(--t3);margin-left:-2px}
.cr-pie{display:flex;align-items:center;gap:4px;margin-top:12px}
.cr-pie .herr-c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--t2)}
.cr-guardar{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--o500);color:var(--sobre-acento);font-weight:650;font-size:15px;box-shadow:0 4px 10px -4px rgba(62,67,42,.6)}
.cr-pista{font-size:12px;color:var(--t3);margin-top:9px;line-height:1.4}
.cr-pista b{color:var(--t2);font-weight:600}
.cr-hor{position:absolute;left:34px;top:-25px;width:28px;height:28px}
.cr-hor .hormiga{width:100%;height:100%}
.teclado{position:absolute;left:0;right:0;bottom:0;height:262px;z-index:22;background:var(--teclado);padding:8px 3px 30px;display:flex;flex-direction:column;gap:9px}
.teclado .fila-t{display:flex;justify-content:center;gap:5px}
.teclado .t{flex:none;width:33px;height:42px;border-radius:6px;background:var(--tecla);color:var(--tecla-t);display:grid;place-items:center;font-size:19px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.teclado .t.esp{background:var(--tecla-2);width:44px;font-size:14px}
.teclado .t.largo{width:190px;font-size:14px}
.teclado .t.intro{width:88px;background:var(--o500);color:var(--sobre-acento);font-size:14px;font-weight:600}
/* Búsqueda */
.bs-cab{display:flex;align-items:center;gap:10px;padding:8px 16px 0}
.bs-input{flex:1;display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;border-radius:15px;background:var(--hoja);border:1.5px solid color-mix(in srgb,var(--o500) 45%,transparent);font-size:16px;color:var(--t1)}
.bs-input .ico{color:var(--t2)}
.bs-input .cursor{display:inline-block;width:2px;height:19px;margin-left:-6px;background:var(--o500);animation:parpadeo 1s steps(1) infinite}
.bs-input .x{margin-left:auto;color:var(--t3)}
.bs-cancelar{font-weight:600;font-size:15px;color:var(--o600)}
.bs-filtros{display:flex;gap:6px;padding:12px 16px 0}
.bs-filtro{height:32px;padding:0 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--t2);background:var(--kraft-hover);display:inline-flex;align-items:center;gap:6px}
.bs-filtro.on{background:var(--o500);color:var(--sobre-acento)}
.bs-filtro span{font-size:11.5px;opacity:.8}
.bs-hoja{position:absolute;left:0;right:0;top:162px;bottom:0;padding:6px 14px 0;border-radius:26px 26px 0 0;background-color:var(--hoja);background-image:var(--tex-hoja);overflow:hidden}
.bs-hoja .sec-cab{margin-top:6px}
.bs-res{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-radius:14px}

.hb-frase b{color:var(--t1);font-weight:650}

.hb-hoja{position:absolute;left:0;right:0;top:108px;bottom:0;padding:20px 18px 140px;border-radius:26px 26px 0 0;background-color:var(--hoja);background-image:var(--tex-hoja);overflow-y:auto;scrollbar-width:none}

/* ═══ 26-nov: la senda de progreso acaba en la puerta (ver pgnCrear) ═══ */
:root{--nd-senda:#f2dfae;--nd-senda-borde:#e4c587;--nd-raya:#d6ad65;--nd-halo:#fffaf0}
:root[data-theme="dark"],:root.oscuro{--nd-senda:#45382c;--nd-senda-borde:#57483b;--nd-raya:#7d6852;--nd-halo:#40342b}
svg.pgn{display:block;width:100%;height:auto;overflow:visible}

.pgn-raya{fill:var(--nd-raya);transition:fill .25s}

.pgn-rayo{fill:none;stroke:var(--nd-sol);stroke-width:3px;stroke-linecap:round}

.pgn-mont{transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.pgn-puerta{fill:var(--nd-puerta);transition:filter .4s}

.lleno .pgn-puerta,:root[data-theme="dark"] .pgn-puerta,:root.oscuro .pgn-puerta{filter:drop-shadow(0 0 5px rgba(242,196,109,.9))}
.pgn-halo{fill:var(--nd-halo)}
.pgn-parada{transition:fill .3s;transform-box:fill-box;transform-origin:center}
.pgn-parada.pend{fill:var(--hoja);stroke:var(--punto);stroke-width:1.8;stroke-dasharray:2.4 2.2}
.pgn-parada.venc{fill:rgba(var(--venc-rgb),.12);stroke:var(--venc);stroke-dasharray:none}

.pgn-grano{transform-box:fill-box}

.ic-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 11px;border-radius:999px;background-color:var(--hoja);background-image:var(--tex-hoja);font-weight:600;font-size:13px;color:var(--t1);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 6px 12px -8px rgba(var(--sombra-rgb),.4)}
.ic-btn .ico{color:var(--o600)}
.ic-btn .ico:last-child{color:var(--t3);transition:transform .3s}
.ic-btn[aria-expanded="true"] .ico:last-child{transform:rotate(180deg)}
.ic{margin:12px -6px 0 -8px}
.ic-dias{display:grid;grid-template-columns:repeat(7,1fr);height:16px;font:600 11px var(--f-sans);color:var(--kraft-tinta);text-align:center;opacity:.85}
.ic-ventana{height:36px;overflow:hidden;transition:height .38s cubic-bezier(.3,.8,.3,1)}
.ic-rej{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:36px;row-gap:2px;transform:translateY(calc(var(--fila) * -38px));transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.ic.abierto .ic-ventana{height:226px}
.ic.abierto .ic-rej{transform:none}
.ic-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin:0 2px;border-radius:12px}
.ic-d b{font:650 15px/1 var(--f-disp);color:var(--t1)}
.ic-d.pasado b{color:var(--kraft-tinta)}
.ic-d.fuera b{color:var(--kraft-tinta);opacity:.45}
.ic-d .pt{display:flex;gap:2px;height:4px}
.ic-d .pt i{width:4px;height:4px;border-radius:50%}
.ic-d.fuera .pt{opacity:.55}
.ic-d.hoy{background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 8px 14px -10px rgba(var(--sombra-rgb),.45)}
.ic-d.hoy b{color:var(--o700)}
.ic-d.sel{box-shadow:inset 0 0 0 1.6px var(--o500)}
.ic-d.hoy.sel{box-shadow:inset 0 0 0 1.6px var(--o500),0 8px 14px -10px rgba(var(--sombra-rgb),.45)}
.m-hoja.ic-hoja{transition:top .38s cubic-bezier(.3,.8,.3,1)}
.ic-filtro{display:flex;align-items:center;gap:10px;margin:6px 4px 2px;padding:7px 7px 7px 12px;border-radius:14px;background:rgba(107,115,76,.1);font-size:13.5px;color:var(--t2)}
.ic-filtro b{color:var(--t1);font-weight:650}
.ic-quitar{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:var(--hoja);font-weight:600;font-size:12.5px;color:var(--t2);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.14)}
.ic-vacio{font-size:14px;color:var(--t3);padding:16px 12px;line-height:1.45}
.ic-filtro[hidden],.ic-vacio[hidden],.ic-oculta{display:none!important}

/* ═══ 26-nov: el detalle de cualquier tarea ═══ */
.det-sw.off{background:var(--punto)}
.det-sw.off::after{right:auto;left:3px}
.det-chip.on.venc{background:rgba(var(--venc-rgb),.12);color:var(--venc);border-color:rgba(var(--venc-rgb),.35)}
.det-nota--vacia{color:var(--t3)}

/* ═══ 26-nov: bienvenida, paso 4 ═══ */
.bv.p4 .bv-ilus{height:auto;display:block;margin-top:84px}
.bv-mapa{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bv-ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:5px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}

  const CS=getComputedStyle(document.documentElement),C1=CS.getPropertyValue('--t1').trim(),C3=CS.getPropertyValue('--t3').trim(),CB=CS.getPropertyValue('--check-borde').trim();

  const cb=cuerpo.getBoundingClientRect(),fr=f.getBoundingClientRect(),tx=f.querySelector('.texto').getBoundingClientRect();
  const W=42,rowTop=fr.top-cb.top,rowH=fr.height;

    s+=`<g class="nd-etq" data-lado="0" data-ax="${c.cx}"><rect x="${c.cx}" y="${f(ly-o.etqH*.72)}" width="10" height="${o.etqH}" rx="${o.etqR}"/><text x="${c.cx}" y="${f(ly)}" text-anchor="middle"><tspan class="nd-e1">${t1}</tspan><tspan class="nd-e2" dx="5">${t2}</tspan></text></g>`;
  }
  return s+'</g>';
}
function nido(){
  const o=ND,{W,H,G,X}=o,r=rng(42),f=v=>v.toFixed(1);
  const sx=muestreo(o.shaft);
  const sem=[{e:'16–22 nov',n:9,actual:1},{e:'9–15 nov',n:21},{e:'2–8 nov',n:15},{e:'26 oct – 1 nov',n:23},{e:'19–25 oct',n:9},{e:'12–18 oct',n:18},{e:'5–11 oct',n:12}];
  const cols=['var(--l-trabajo)','var(--l-casa)','var(--l-personal)','var(--l-lect)','var(--l-viajes)','var(--o500)'];
  const maxN=Math.max(...sem.filter(x=>!x.actual).map(x=>x.n));sem.forEach(x=>{if(!x.actual&&x.n===maxN)x.mejor=1;});
  const cams=sem.map((s,i)=>{const dir=i%2===0?1:-1,cy=o.ys[i],x0=sx(cy),[rx,ry]=o.radio(s.n),cx=Math.round(x0+dir*o.dist(s.n,r));
    return {...s,dir,cx,cy,rx,ry,tun:`M${f(x0)} ${cy-6} C ${f(x0+dir*o.tc)} ${cy-8}, ${f(cx-dir*(rx+o.tc))} ${cy+12}, ${f(cx-dir*rx*.75)} ${cy+2}`};});
  // Zonas ocupadas, para que matas y piedras de bajo tierra no asomen a medias.
  const libre=(x,y,m)=>Math.abs(x-sx(y))>o.tunel[0]+m&&cams.every(c=>Math.abs(x-c.cx)>c.rx+m+(o.etq==='lado'?(c.dir*(x-c.cx)>0?o.etqAncho:0):0)||Math.abs(y-c.cy)>c.ry+m+(o.etq==='arriba'?o.etqH+o.sep:0));
  let s=`<svg class="nido nd" viewBox="0 0 ${W} ${H}" data-w="${W}" data-pad="${o.pad}" style="--nd-f1:${o.f1};--nd-f2:${o.f2};--nd-rayo:${o.rayo}px" role="img" aria-label="Tu hormiguero: cada cámara es una semana">`;
  s+=`<defs><radialGradient id="nd-luz" cx="50%" cy="66%" r="66%"><stop offset="0" stop-color="#9c784b"/><stop offset="1" stop-color="#54412f"/></radialGradient><clipPath id="nd-ct"><rect x="0" y="${G}" width="${W}" height="${H-G}" rx="${o.marco}"/></clipPath></defs>`;
  // Cielo: nubes de día y estrellas de noche.
  o.nubes.forEach(([x,y,k])=>{s+=nd_nube(x,y,k);});
  for(let i=0;i<16;i++)s+=`<circle class="estrella" cx="${(r()*W).toFixed(0)}" cy="${(4+r()*(G*.6)).toFixed(0)}" r="${(o.estrella*(.7+r()*.8)).toFixed(1)}" style="animation-delay:${(i*.37).toFixed(2)}s"/>`;
  // Tierra: arena, vetas onduladas, granos, y piedras y matas enterradas.
  const T=H-G;
  s+=`<g clip-path="url(#nd-ct)"><rect class="nd-arena" x="0" y="${G}" width="${W}" height="${T}"/>`;
  for(let k=0;k<4;k++){const y=G+T*(.14+k*.23),a=T*.022+r()*T*.015,h=T*.07+r()*T*.035;
    s+=`<path class="nd-banda" d="M0 ${f(y)} C ${f(W*.19)} ${f(y-a)}, ${f(W*.37)} ${f(y+a)}, ${f(W*.56)} ${f(y)} S ${f(W*.83)} ${f(y-a)}, ${W} ${f(y+a*.5)} L${W} ${f(y+h)} C ${f(W*.81)} ${f(y+h-a)}, ${f(W*.65)} ${f(y+h+a)}, ${f(W*.46)} ${f(y+h)} S ${f(W*.15)} ${f(y+h-a)}, 0 ${f(y+h+a*.4)} Z"/>`;}
  for(let i=0;i<o.granos;i++){const x=r()*W,y=G+6+r()*(T-6),rx=(.9+r()*1.8)*o.k;s+=`<ellipse class="nd-grano" cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(rx*.65)}" transform="rotate(${(r()*60-30).toFixed(0)} ${f(x)} ${f(y)})"/>`;}
  for(let i=0,hechas=0;i<80&&hechas<o.bajo[0];i++){const x=12+r()*(W-24),y=G+24+r()*(T-40);if(!libre(x,y,14*o.k))continue;hechas++;const rx=(7+r()*6)*o.k;s+=nd_piedra(x,y,rx,rx*.62);}
  for(let i=0,hechas=0;i<120&&hechas<o.bajo[1];i++){const x=12+r()*(W-24),y=G+34+r()*(T-50);if(!libre(x,y,22*o.k))continue;hechas++;s+=nd_mata(x,y,(.7+r()*.4)*o.k,r);}
  // Túneles y cámaras: primero los bordes (y los anillos), luego el hueco,
  // para que cada túnel entre en su cámara sin pared por medio.
  s+=`<path class="nd-t-borde" d="${o.shaft}" style="stroke-width:${o.tunel[0]}"/>`;
  cams.forEach(c=>{s+=`<path class="nd-t-borde" d="${c.tun}" style="stroke-width:${o.tunel[0]}"/><ellipse class="nd-c-anillo" cx="${c.cx}" cy="${c.cy}" rx="${f(c.rx+o.anillo)}" ry="${f(c.ry+o.anillo)}"/>`;});
  s+=`<path class="nd-t-hueco" d="${o.shaft}" style="stroke-width:${o.tunel[1]}"/>`;
  cams.forEach(c=>{s+=`<path class="nd-t-hueco" d="${c.tun}" style="stroke-width:${o.tunel[1]}"/>`;});
  cams.forEach(c=>{s+=nd_camara(c,r,cols,o);});
  s+=enRuta(o.shaft,22,'-3s',false,o.hormiga);
  s+=enRuta(cams[2].tun,9,'-2s',cams[2].dir<0,o.hormiga*.9);
  s+='</g>';
  // Superficie: el borde del suelo, el montículo, piedras, plantas y matas.
  s+=`<path class="nd-borde-suelo" d="M0 ${G} H${W}"/>`;
  s+=nd_monticulo(X,G,o.mont[0],o.mont[1],r);
  o.piedras.forEach(([x,rx,ry])=>{s+=nd_piedra(x,G-ry*.55,rx,ry);});
  o.plantas.forEach(([x,k])=>{s+=nd_planta(x,G+1,k);});
  const ocup=[[X-o.mont[0]/2-8,X+o.mont[0]/2+8],...o.piedras.map(([x,rx])=>[x-rx-3,x+rx+3]),...o.plantas.map(([x,k])=>[x-10*k,x+10*k])];
  for(let i=0,hechas=0;i<200&&hechas<o.matas;i++){const x=8+r()*(W-16);if(ocup.some(([a,b])=>x>a&&x<b))continue;hechas++;ocup.push([x-6*o.k,x+6*o.k]);s+=nd_mata(x,G+1,(.85+r()*.6)*o.k,r);}
  // Una hormiga que llega a la puerta con su semilla.
  s+=enRuta(`M${f(W*.03)} ${G-1} C ${f(W*.15)} ${G-2}, ${f(W*.27)} ${G+1}, ${f(X-o.mont[0]*.12)} ${G-1}`,15,'-5s',false,o.hormiga,true,true);
  return s+'</svg>';
}
function nd_ajustarEtiquetas(){
  document.querySelectorAll('svg.nd').forEach(svg=>{
    const W=+svg.dataset.w,pad=+svg.dataset.pad;
    svg.querySelectorAll('.nd-etq').forEach(g=>{
      const tx=[...g.querySelectorAll('text')],rect=g.querySelector('rect');
      const w=Math.max(...tx.map(t=>t.getBBox().width))+pad*2,lado=+g.dataset.lado,ax=+g.dataset.ax;
      let x=lado>0?ax:lado<0?ax-w:ax-w/2;x=Math.max(4,Math.min(W-4-w,x));
      rect.setAttribute('x',x.toFixed(1));rect.setAttribute('width',w.toFixed(1));
      tx.forEach(t=>t.setAttribute('x',(x+w/2).toFixed(1)));
    });
  });
}

   píldora). Lo que no tiene hora va arriba, para arrastrarlo a un hueco. */
const AG_INI=7.4,AG_PX=64,AG_AHORA=9+41/60;
const CALS={google:['Google','var(--cal-google)'],icloud:['iCloud','var(--cal-icloud)']};
const AGENDA=[
  {tipo:'hab',t:'Meditar 10 minutos',a:7.5,b:7.75,hecha:1},
  {tipo:'tarea',t:'Pasear a Tango',a:8,b:8.75,l:'personal',rep:'1d',hecha:1},
  {tipo:'ev',t:'Daily del equipo',a:9,b:9.75,cal:'google'},
  {tipo:'tarea',t:'Preparar la presentación del jueves',a:10,b:11.5,l:'trabajo',imp:1,sub:'2/5',col:0,cols:2},
  {tipo:'ev',t:'Dentista',a:11,b:11.75,cal:'icloud',col:1,cols:2},
  {tipo:'tarea',t:'Enviar la factura de noviembre',a:12.25,b:12.75,l:'trabajo',rep:'1 mes'},
  {tipo:'ev',t:'Comida con Laura',a:13.5,b:15,cal:'google'}
];
const SIN_HORA=[{t:'Revisar el presupuesto de diciembre',l:'casa'},{t:'Planificar el viaje a Lisboa',l:'viajes'}];
const hm=x=>{const h=Math.floor(x),m=Math.round((x-h)*60);return `${h}:${String(m).padStart(2,'0')}`;};
function bloque(it){
  const cols=it.cols||1,col=it.col||0,dur=it.b-it.a;
  const top=(it.a-AG_INI)*AG_PX+1,alto=Math.max(it.tipo==='hab'?24:28,dur*AG_PX-3);
  const pos=`top:${top.toFixed(1)}px;height:${alto.toFixed(1)}px;left:calc(46px + (100% - 50px) * ${col}/${cols});width:calc((100% - 50px) / ${cols} - 4px)`;
  const corto=dur<0.6?' corto':(cols>1?' estrecho':'');
  const hora=`${hm(it.a)}–${hm(it.b)}`;
  if(it.tipo==='hab')
    return `<div class="ag-b ag-hab corto${it.hecha?' hecha':''}" style="${pos}"><span class="r-hor">${hormiga()}</span><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${hm(it.a)} · hábito</span></div></div>`;
  if(it.tipo==='ev'){
    const [cn,cc]=CALS[it.cal];
    return `<div class="ag-b ag-ev${corto}" style="${pos};--c:${cc}"><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${ico('cal',12)} ${hora} · ${cn}</span></div></div>`;
  }
  const [ln,lc]=LISTAS[it.l],m=[hora];
  if(it.imp)m.push(`<span class="bandera">${ico('flag',12)}</span>`);
  if(cols>1)return `<div class="ag-b ag-tarea estrecho${it.hecha?' hecha':''}" style="${pos};--c:${lc}"><span class="ag-check" role="button" aria-label="Completar">${CK}</span><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${m.join(' ')}</span></div></div>`;
  if(it.rep)m.push(`${ico('repeat',12)} ${it.rep}`);
  if(it.sub)m.push(`${it.sub} subtareas`);
  if(!corto)m.push(`<span class="lista" style="color:${lc}"><i></i><span>${ln}</span></span>`);
  return `<div class="ag-b ag-tarea${corto}${it.hecha?' hecha':''}" style="${pos};--c:${lc}"><span class="ag-check" role="button" aria-label="Completar">${CK}</span><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${m.join(' · ')}</span></div></div>`;
}
function agenda(items=AGENDA,ahora=true){

  const t1=`M${f(W*.16)} -12 C ${f(W*.15)} ${f(H*.34)}, ${f(cx-rx*1.3)} ${f(cy-ry*.1)}, ${f(cx-rx*.72)} ${f(cy+ry*.05)}`;
  const t2=`M${f(cx+rx*.74)} ${f(cy+ry*.12)} C ${f(cx+rx*1.15)} ${f(cy+ry*.3)}, ${f(W*.9)} ${f(H*.62)}, ${f(W+14)} ${f(H*.74)}`;
  let s=`<svg class="nd sm-cam" viewBox="0 0 ${W} ${H}" role="img" aria-label="La cámara de la semana, con ${n} semillas">`;
  s+=`<defs><clipPath id="sm-cl"><rect width="${W}" height="${H}" rx="${f(18*k)}"/></clipPath><radialGradient id="nd-luz" cx="50%" cy="66%" r="66%"><stop offset="0" stop-color="#9c784b"/><stop offset="1" stop-color="#54412f"/></radialGradient></defs><g clip-path="url(#sm-cl)">`;
  s+=`<rect class="nd-arena" width="${W}" height="${H}"/>`;
  for(let b=0;b<3;b++){const y=H*(.1+b*.34),a=H*.04,h=H*.11;
    s+=`<path class="nd-banda" d="M0 ${f(y)} C ${f(W*.25)} ${f(y-a)}, ${f(W*.5)} ${f(y+a)}, ${f(W*.75)} ${f(y)} S ${f(W*.95)} ${f(y-a)}, ${W} ${f(y+a*.5)} L${W} ${f(y+h)} C ${f(W*.7)} ${f(y+h+a)}, ${f(W*.35)} ${f(y+h-a)}, 0 ${f(y+h)} Z"/>`;}
  for(let g=0;g<Math.round(W*H/900);g++){const x=r()*W,y=r()*H,q=(.9+r()*1.7)*k;s+=`<ellipse class="nd-grano" cx="${f(x)}" cy="${f(y)}" rx="${f(q)}" ry="${f(q*.65)}"/>`;}
  s+=nd_piedra(W*.08,H*.82,9*k,5.6*k)+nd_piedra(W*.94,H*.2,7*k,4.4*k)+nd_mata(W*.84,H*.95,.8*k,r);
  // Primero bordes y anillo, luego los huecos: los túneles entran sin pared.
  s+=`<path class="nd-t-borde" d="${t1}" style="stroke-width:${f(tn[0])}"/><path class="nd-t-borde" d="${t2}" style="stroke-width:${f(tn[0])}"/>`;
  s+=`<ellipse class="nd-c-anillo" cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx+an)}" ry="${f(ry+an)}"/>`;
  s+=`<path class="nd-t-hueco" d="${t1}" style="stroke-width:${f(tn[1])}"/><path class="nd-t-hueco" d="${t2}" style="stroke-width:${f(tn[1])}"/>`;
  s+=`<ellipse class="nd-c-hueco" cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}"/><ellipse class="nd-c-suelo" cx="${f(cx)}" cy="${f(cy+ry*.5)}" rx="${f(rx*.82)}" ry="${f(ry*.42)}"/>`;
  // La pila en pirámide, con las semillas mezcladas como fueron cayendo.
  const srx=Math.min(8.6*k,rx*.075+2),sry=srx*.64,SW=srx*2+1.4,SH=sry*1.68;
  let base=1;while(base*(base+1)/2<n)base++;
  const floor=cy+ry*.6,ox=d.s.actual?rx*.1:-rx*.2,cols=d.tareas.map(t=>SM_L[t.l][1]);
  for(let a=cols.length-1;a>0;a--){const b=Math.floor(r()*(a+1));[cols[a],cols[b]]=[cols[b],cols[a]];}
  let q=0,cima=floor;
  for(let row=0;q<n;row++){const cnt=Math.min(base-row,n-q),y=floor-row*SH,x0=cx+ox-(cnt-1)*SW/2;cima=y;
    for(let j=0;j<cnt;j++,q++){const x=x0+j*SW+(r()-.5)*1.2,a=((r()-.5)*14).toFixed(0);
      s+=`<g class="nd-semilla" transform="translate(${f(x)} ${f(y)}) rotate(${a})"><ellipse rx="${f(srx)}" ry="${f(sry)}" style="fill:${cols[q]}"/><ellipse class="nd-brillo" cx="${f(-srx*.3)}" cy="${f(-sry*.38)}" rx="${f(srx*.36)}" ry="${f(sry*.28)}"/></g>`;}}
  if(d.mejor){const mx=cx+ox,my=cima-sry-1,b=16*k;
    s+=`<path class="nd-mastil" d="M${f(mx)} ${f(my)} V ${f(my-b)}"/><path class="nd-bandera" d="M${f(mx+1)} ${f(my-b)} q ${f(b*.35)} ${f(b*.08)} ${f(b*.62)} ${f(b*.2)} q ${f(-b*.27)} ${f(b*.12)} ${f(-b*.62)} ${f(b*.2)} Z"/>`;}
  // La semana en curso lleva su brote, como en el hormiguero; la hormiga, al lado de la pila.
  const hw=38*k;
  if(d.s.actual)s+=nd_planta(cx+rx*.62,floor+sry,.95*k)+hormiga({x:f(cx-rx*.66-hw*.3),y:f(floor+sry-hw*.86),w:f(hw)});
  else s+=hormiga({x:f(cx+ox+(base-1)*SW/2+srx+2*k),y:f(floor+sry-hw*.86),w:f(hw)});
  return s+'</g></svg>';
}

/* ═══ 26-nov: la maqueta se navega con clics ═══
   La barra de abajo (Hoy, Inbox, Buscar o Notas y el avatar), ☰, las filas
   (abren su detalle, sobre la pantalla de la que vienes), Volver y Cerrar,
   las listas, los resultados de la búsqueda y las cámaras de Actividad. Una
   pila en sessionStorage recuerda de dónde vienes, para que Volver y Cerrar
   te devuelvan allí. Abrir una #pantalla directamente (como hacen las
   capturas) la enseña siempre igual, sin pila. */
const MQ={pila:'maqueta-pila',nav:'maqueta-nav',det:'maqueta-detalle',desde:'maqueta-desde',lista:'maqueta-lista',dia:'maqueta-dia'};
const ss={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(k);}catch(e){}}};
// Al llegar navegando, Hoy no repite la demo de la hormiga llevándose una tarea.
const NAVEGADO=!!ss.get(MQ.nav);ss.del(MQ.nav);
const BASE_ESTADO={'hoy-congelado':'hoy','detalle-abajo':'detalle','ajustes-abajo':'ajustes','inbox-calendario':'inbox-listas'};
const aqui=()=>BASE_ESTADO[estado]||estado;
function pila(){try{return JSON.parse(ss.get(MQ.pila)||'[]');}catch(e){return [];}}
function irA(h){ss.set(MQ.nav,'1');if(h===estado){location.reload();return;}location.hash=h;}
function ir(h){const p=pila();p.push(aqui());ss.set(MQ.pila,JSON.stringify(p.slice(-20)));irA(h);}
function irRaiz(h){ss.set(MQ.pila,'[]');irA(h);}
function volver(def){const p=pila(),h=p.pop()||def;ss.set(MQ.pila,JSON.stringify(p));irA(h);}

function infoDeFila(f){
  const t=(f.querySelector('.texto,.ag-tit')||f).textContent.trim();
  const li=f.querySelector('.lista');
  let lc=(li&&li.style.color)||f.style.getPropertyValue('--c').trim();
  if(!lc){const p=f.closest('section')&&f.closest('section').querySelector('.sec-punto');if(p&&!p.classList.contains('sin'))lc=p.style.background;}
  if(!lc&&aqui()==='lista')lc=listaActual().c;
  let fecha=((f.querySelector('.pastilla-n,.pastilla')||{}).textContent||'').trim();
  const hora=(((f.querySelector('.ag-meta')||{}).textContent||'').match(/\d{1,2}:\d{2}/)||[])[0];
  if(!fecha&&hora)fecha='Hoy · '+hora;
  if(!fecha&&f.closest('#filas-hoy'))fecha='Hoy';
  const rep=[...f.querySelectorAll('.meta > span,.ag-meta')].find(s=>s.innerHTML.includes(ICOS.repeat.slice(0,30)));
  return {t,lc,ln:COL_LISTA[lc]||'',f:fecha,venc:!!(f.closest('.sec--venc')||f.querySelector('.pastilla:not(.pastilla-n)')),imp:!!f.querySelector('.bandera'),

function abrirDetalle(info){ss.set(MQ.det,JSON.stringify(info));ss.set(MQ.desde,aqui());ir('detalle');}
function volverDetalle(){const d=ss.get(MQ.desde);ss.del(MQ.desde);ss.del(MQ.det);volver(d||'inbox-listas');}
const DET_DEF={t:'Preparar la presentación del jueves',lc:'var(--l-trabajo)',ln:'Trabajo',f:'Hoy · 10:00',imp:1};
function detDatos(){

function listaActual(){const n=ss.get(MQ.lista)||'Trabajo',c=CHIPS_L.find(x=>x[0]===n)||CHIPS_L[0];return {n:c[0],c:c[1],d:c[2],t:c[3]};}

/* ── Inbox: calendario desplegable ──
   Plegado es una tira con la semana; «Noviembre ⌄» lo despliega al mes
   entero. Los puntos son las tareas con fecha (rojo: vencidas) y tocar un
   día deja en la lista solo las de ese día. */
const IC_TOP=332,IC_EXTRA=190;
function icDia(k){k=String(k);return k[0]==='o'?[+k.slice(1),'oct']:k[0]==='d'?[+k.slice(1),'dic']:[+k,'nov'];}
function icNombre(k){
  const [d,m]=icDia(k),w=m==='nov'?(d+5)%7:m==='dic'?d%7:(d+2)%7;
  const pre={20:'Hoy, ',21:'Mañana, ',19:'Ayer, '}[m==='nov'?d:0]||'';
  const tx=pre+SM_DN[w].toLowerCase()+' '+d+(m==='nov'?'':' de '+(m==='oct'?'octubre':'diciembre'));
  return tx[0].toUpperCase()+tx.slice(1);
}
function calInbox(){
  // Noviembre de 2026 empieza en domingo: con semanas de lunes, 6 filas (26 oct – 6 dic).
  const porDia={};
  INB.forEach(g=>g.tareas.forEach(t=>{if(t.d==null)return;(porDia[t.d]=porDia[t.d]||[]).push(t.venc?'var(--venc)':g.sin?'var(--t3)':g.c);}));
  const celda=(k,num,cls)=>`<button class="ic-d ${cls}" data-d="${k}" aria-label="${icNombre(k)}"><b>${num}</b><span class="pt">${(porDia[k]||[]).slice(0,4).map(x=>`<i style="background:${x}"></i>`).join('')}</span></button>`;
  let c='';
  for(let d=26;d<=31;d++)c+=celda('o'+d,d,'fuera');
  for(let d=1;d<=30;d++)c+=celda(d,d,d<20?'pasado':d===20?'hoy':'');
  for(let d=1;d<=6;d++)c+=celda('d'+d,d,'fuera');
  return `<div class="ic" id="ic" style="--fila:3" data-sel=""><div class="ic-dias">${SM_LETRA.map(x=>`<span>${x}</span>`).join('')}</div><div class="ic-ventana"><div class="ic-rej">${c}</div></div></div>`;
}
function icAbrir(abrir){
  const ic=document.getElementById('ic');if(!ic)return;
  ic.classList.toggle('abierto',abrir);document.querySelector('.ic-btn').setAttribute('aria-expanded',abrir);
  ic.closest('header').nextElementSibling.style.top=(IC_TOP+(abrir?IC_EXTRA:0))+'px';
}
function icElegir(k){
  const ic=document.getElementById('ic');if(!ic)return;
  const sel=ic.dataset.sel===String(k)?'':String(k);ic.dataset.sel=sel;
  const celdas=[...ic.querySelectorAll('.ic-d')];
  celdas.forEach(x=>x.classList.toggle('sel',x.dataset.d===sel));
  // Plegado, la tira enseña la semana del día elegido.
  ic.style.setProperty('--fila',sel?Math.floor(celdas.findIndex(x=>x.dataset.d===sel)/7):3);
  const hoja=ic.closest('header').nextElementSibling;let n=0;
  hoja.querySelectorAll('.inb-fila').forEach(f=>{const ok=!sel||f.dataset.d===sel;f.classList.toggle('ic-oculta',!ok);if(ok&&sel)n++;});
  hoja.querySelectorAll('section').forEach(s=>s.classList.toggle('ic-oculta',!!sel&&!s.querySelector('.inb-fila:not(.ic-oculta)')));
  const fb=hoja.querySelector('.ic-filtro');fb.hidden=!sel;hoja.querySelector('.ic-vacio').hidden=!sel||n>0;
  if(sel)fb.querySelector('.ic-f-tx').innerHTML=`<b>${icNombre(sel)}</b> · ${n?n+(n>1?' tareas':' tarea'):'nada con fecha'}`;
}

/* ── Ajustes: la vista previa usa la senda nueva ──
   El acento tiñe el tramo recorrido y la bandera; tocarla completa una. */
function ajPrevia(){
  const h=document.querySelector('.aj-pg');if(!h)return;
  const nueva=()=>{const pg=pgNuevo(h,{tareas:[{l:'t',ok:1},{l:'p',ok:1},{l:'c',ok:1},{l:'r'},{l:'v'}],movil:true});h.querySelector('svg').setAttribute('viewBox','0 22 360 104');return pg;};
  let pg=nueva();h.addEventListener('click',()=>{if(pg.tareas.every(t=>t.ok)){pg=nueva();return;}pg.completar();});
}

/* ── Clics ── */
// Enlaces: Volver y Cerrar devuelven a donde estabas; el resto navega sin demo.
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  const h=a.getAttribute('href').slice(1);
  if(a.matches('.det-btns a')){e.preventDefault();volverDetalle();return;}
  if(a.matches('.aj-cab a,.bs-cancelar,.nt-cab a.m-herr,.mes-cab a.m-herr,.mn .cerrar')){e.preventDefault();volver(h);return;}
  ss.set(MQ.nav,'1');
},true);
document.addEventListener('click',e=>{
  if(e.target.closest('.det-fondo'))return;
  if(e.target.closest('.det-velo')){volverDetalle();return;}
  // Barra de abajo
  const nb=e.target.closest('.m-nav button');
  if(nb){if(nb.querySelector('.m-av')){ir('ajustes');return;}
    const h={Hoy:'hoy',Inbox:'inbox-listas',Buscar:'buscar',Notas:'notas'}[nb.textContent.trim()];
    if(h&&h!==aqui())h==='buscar'?ir(h):irRaiz(h);return;}
  // Panel de listas (☰)
  const ma=e.target.closest('.mn a:not(.cerrar)');
  if(ma){const tx=ma.textContent.trim();
    if(tx.startsWith('Todas'))irRaiz('inbox-listas');
    else if(tx.startsWith('Actividad'))irRaiz('actividad');
    else{const n=Object.values(COL_LISTA).find(x=>tx.startsWith(x));if(n){ss.set(MQ.lista,n);irRaiz('lista');}}
    return;}
  // Chips de listas (Inbox y vista de lista)
  const ch=e.target.closest('.lch-fila .lch,.ls-otras .lch');
  if(ch&&!e.target.closest('.det-fondo')){const tx=ch.textContent.trim();
    if(tx.startsWith('Todas')){if(aqui()!=='inbox-listas')irRaiz('inbox-listas');return;}
    const n=Object.values(COL_LISTA).find(x=>tx.startsWith(x));if(n){ss.set(MQ.lista,n);aqui()==='lista'?irA('lista'):ir('lista');}return;}
  // Calendario del Inbox
  if(e.target.closest('.ic-btn')){icAbrir(!document.getElementById('ic').classList.contains('abierto'));return;}
  const icd=e.target.closest('.ic-d');if(icd){icElegir(icd.dataset.d);return;}
  if(e.target.closest('.ic-quitar')){icElegir(document.getElementById('ic').dataset.sel);return;}
  // Filas de tareas → su detalle
  if(!e.target.closest('.check,.check-wrap,.ag-check,.accion')){
    const f=e.target.closest('.fila:not(.hab),.ag-b.ag-tarea');
    if(f&&!(typeof ocupado!=='undefined'&&ocupado)){abrirDetalle(infoDeFila(f));return;}
  }
  // Búsqueda
  const r=e.target.closest('.bs-res');
  if(r){let c=r.previousElementSibling;while(c&&!c.classList.contains('sec-cab'))c=c.previousElementSibling;
    const tipo=c?c.querySelector('.sec-tit').textContent:'';
    if(tipo==='Notas'){ir('nota');return;}
    if(tipo==='Tareas'){const p=r.querySelector('small').textContent.split('·').map(x=>x.trim()),lc=r.querySelector('small i').style.background;
      abrirDetalle({t:r.querySelector('b').textContent.trim(),lc,ln:COL_LISTA[lc]||'',f:p[1]==='Hoy'&&/\d:\d/.test(p[2]||'')?'Hoy · '+p[2]:(p[1]==='sin fecha'?'':p[1]||''),rep:(p.find(x=>/\d+ mes/.test(x))||'').replace(/^\D+/,'')});}
    return;}
  if(e.target.closest('.bs-recientes span')){irA('buscar');return;}
  const bf=e.target.closest('.bs-filtro');if(bf){bf.parentElement.querySelectorAll('.bs-filtro').forEach(x=>x.classList.toggle('on',x===bf));return;}
  // Actividad: volver, y cada cámara abre su semana
  if(e.target.closest('.e-actividad .m-fila1 > .m-herr:first-child button')){volver('hoy');return;}
  const cam=e.target.closest('svg.nido .camara');
  if(cam){ir('semana-'+[...document.querySelectorAll('svg.nido .camara')].indexOf(cam));return;}
  if(e.target.closest('.sm-volver')){volver('actividad');return;}
  const si=e.target.closest('.sm-ir');if(si){if(!si.disabled)irA('semana-'+si.dataset.i);return;}
  const col=e.target.closest('.sm-col');if(col){semIrADia(col);return;}
  // Pestañas que solo cambian de vista (Semanas/Meses/Año, Pendientes/Hechas…)
  const pe=e.target.closest('button.m-pest');if(pe){pe.parentElement.querySelectorAll('.m-pest').forEach(x=>x.classList.toggle('on',x===pe));return;}
  // La fecha grande abre el mes; un día de la tira de Hoy, la Agenda de ese día
  if(e.target.closest('.m-cab .fecha')){ir('mes');return;}
  const sd=e.target.closest('.semana .sd');
  if(sd&&!document.body.classList.contains('e-agenda')){ss.set(MQ.dia,[...sd.parentElement.children].indexOf(sd));ir('agenda');return;}
  // Avisos, deshacer y captura
  const nt=e.target.closest('.notif');
  if(nt){if(nt.textContent.includes(DET_DEF.t)){ss.set(MQ.det,JSON.stringify(DET_DEF));ss.set(MQ.desde,'hoy');ir('detalle');}else irRaiz('hoy');return;}
  if(e.target.closest('.deshacer')){irRaiz('hoy');return;}
  if(e.target.closest('.cr-guardar')){volver('hoy');return;}
});

function hbMes(){
  const L=['L','M','X','J','V','S','D'];let s=L.map(x=>`<span class="dl">${x}</span>`).join('');
  for(let i=0;i<6;i++)s+=`<span class="hb-d fut" style="visibility:hidden"></span>`;
  for(let d=1;d<=30;d++){const ok=HB.hechos.includes(d),fut=d>20,racha=ok&&d>=14;
    s+=`<span class="hb-d ${fut?'fut':ok?'ok':'no'}${racha?' racha':''}${d===20?' hoy':''}" title="${d} nov">${ok?hormiga()+'<i>'+d+'</i>':fut?d:'<b>'+d+'</b>'}</span>`;}
  return `<div class="hb-mes">${s}</div>`;
}
function hbAnio(){let s='',r=11;const R=()=>(r=(r*1664525+1013904223)>>>0)/4294967296;
  for(let w=0;w<26;w++)for(let d=0;d<7;d++){const p=R(),k=w>18?.85:w>9?.65:.45;s+=`<i class="${p<k?'ok':p<k+.08?'ok2':''}"></i>`;}
  return `<div class="hb-anio">${s}</div><div class="hb-ley">junio${'&nbsp;'.repeat(18)}…${'&nbsp;'.repeat(18)}noviembre<span style="margin-left:auto;display:flex;gap:6px;align-items:center"><i style="background:var(--punto);opacity:.45"></i>no<i style="background:var(--o500)"></i>sí</span></div>`;
}
function hbCuerpo(){

      <div class="hb-stat"><b>${HB.racha} ${hormiga()}</b><span>días seguidos</span></div>
      <div class="hb-stat"><b>${HB.mejor}</b><span>tu mejor racha</span></div>

    <div class="hb-frase">${hormiga()}<span>Siete hormigas en fila. <b>Si cumples 5 días más, igualas tu récord</b> (12, en septiembre).</span></div>
    <div class="sec-cab" style="margin-top:8px"><span class="sec-tit">Noviembre</span><span class="puntos"></span></div>
    ${hbMes()}
    <div class="sec-cab" style="margin-top:8px"><span class="sec-tit">Últimos 6 meses</span><span class="puntos"></span></div>
    ${hbAnio()}

      <div class="hb-fila">${ico('reloj',18)}<span>Hora</span><span>7:30 · en la Agenda</span></div>
      <div class="hb-fila">${ico('campana',18)}<span>Aviso</span><span>Si a las 21:00 no está hecho</span></div>
    </div>`;
}
