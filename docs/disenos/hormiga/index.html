<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnTrack · La hormiga (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#e7cf9b; --kraft-tinta:#5d4a26;
  --hoja:#fbf4df; --hoja-2:#eddfba; --card:#fffcf1;
  --t1:#2b2213; --t2:#6f5f3e; --t3:#94845f;
  --o300:#a5b17d; --o400:#8c986d; --o500:#6b734c; --o600:#5b6240; --o700:#4b5135; --o800:#3e432a;
  --venc:#8f5853; --venc-rgb:143,88,83;
  --borde:rgba(80,56,10,.17);
  --tierra:#e3c58f; --tierra-2:#d6b073; --tierra-borde:#b78c56; --hueco:#f8eed6; --tierra-osc:#5e4426;
  --l-trabajo:#c25e3a; --l-casa:#3d6e85; --l-personal:#56867c; --l-lect:#b58236; --l-viajes:#96323a;
  --hoja-rgb:251,244,223; --sombra-rgb:80,55,10; --check-borde:rgba(80,56,10,.42); --punto:rgba(111,95,62,.32); --punto-kraft:rgba(93,74,38,.28);
  --huella:color-mix(in srgb,var(--tinte) 60%,transparent); --lente:rgba(255,252,241,.6); --nav-bg:rgba(255,252,241,.95); --hab-bg:rgba(255,252,241,.65);
  --kbd-bg:rgba(243,232,201,.5); --kraft-hover:rgba(255,250,235,.35); --home:rgba(43,34,19,.85);
  --bandeja:#e3c58f; --bandeja-borde:#b78c56; --sobre-acento:#fbf4df; --c-sombra:#ead6ab; --estrato:#c99f62; --hueco-hover:#fffaf0; --mota:#b78c56; --suelo:#b78c56; --nervio:#a5b17d; --tallo:#5b6240;
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-sans:'Figtree',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-sans);color:var(--t1);background-color:var(--kraft);background-image:var(--tex-kraft);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ico{display:block;flex:none}

/* ── La hormiga (silueta del logo) ── */
.hormiga{display:block;fill:currentColor;color:var(--hor);overflow:visible}
.h-antenas{transform-box:fill-box;transform-origin:14% 100%;animation:antenas 2.8s ease-in-out infinite}
@keyframes antenas{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}55%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.anda .h-arriba{animation:bote .28s ease-in-out infinite alternate}
@keyframes bote{to{transform:translateY(-12px)}}
.anda .h-patas{transform-box:fill-box;transform-origin:50% 0;animation:pasos .28s ease-in-out infinite alternate}
@keyframes pasos{from{transform:skewX(-11deg)}to{transform:skewX(11deg)}}
.duerme .h-antenas{animation:antenas-duerme 4.5s ease-in-out infinite}
@keyframes antenas-duerme{0%,100%{transform:rotate(26deg)}50%{transform:rotate(31deg)}}
.duerme .h-arriba{animation:respira 4.5s ease-in-out infinite}
@keyframes respira{50%{transform:translateY(-6px)}}
.cava .h-arriba{transform-box:fill-box;transform-origin:30% 90%;animation:cavar .45s ease-in-out infinite alternate}
@keyframes cavar{to{transform:rotate(9deg)}}
.antena-rota{fill:none;stroke:currentColor;stroke-width:15;stroke-linecap:round}

/* ── App ── */
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;padding:14px 18px 16px 0;column-gap:8px}
.lateral{display:flex;flex-direction:column;padding:8px 12px 6px 18px;min-height:0;position:relative}
.marca{display:flex;align-items:center;gap:10px;padding:6px 6px 16px}
.marca-ico{width:34px;height:34px;border-radius:10px;background:var(--hoja);display:grid;place-items:center;box-shadow:0 1px 2px rgba(var(--sombra-rgb),.18),0 0 0 1px rgba(var(--sombra-rgb),.06)}
.marca-ico .hormiga{width:26px;height:26px}
.marca-nombre{font:700 22px/1 var(--f-disp);letter-spacing:-.025em}
.marca .plegar{margin-left:auto;color:var(--kraft-tinta);opacity:.75}
.buscar{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--kraft-tinta);font-size:15px;margin-bottom:4px}
.buscar kbd{margin-left:auto;font:500 11px var(--f-mono);padding:4px 9px;border:1px solid var(--punto-kraft);border-radius:999px}
.grupo{font:650 13.5px var(--f-disp);color:var(--kraft-tinta);opacity:.85;padding:16px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;font-size:15px;color:var(--t1)}
.nav a:hover{background:var(--kraft-hover)}
.nav a .ico{color:var(--kraft-tinta)}
.nav a .n{margin-left:auto;font-size:13px;color:var(--kraft-tinta);font-variant-numeric:tabular-nums}
.nav a.activa{background-color:var(--hoja);background-image:var(--tex-hoja);font-weight:650;color:var(--o800);margin-right:-36px;padding-right:46px;border-radius:13px 0 0 13px;box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16),0 8px 16px -10px rgba(var(--sombra-rgb),.4)}
.nav a.activa .ico{color:var(--o500)}
.nav a.activa .n{background:var(--o500);color:var(--sobre-acento);font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.listas a{font-size:14.5px}
.anillo{width:19px;height:19px;flex:none}
.perfil{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--o300);display:grid;place-items:center;color:var(--o800);font:700 15px var(--f-disp)}
.perfil b{display:block;font-size:14px;font-weight:600}
.perfil small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--kraft-tinta)}
.perfil small i{width:7px;height:7px;border-radius:50%;background:var(--l-personal)}

/* ── La hoja (con otra debajo, como un taco) ── */
.pila{position:relative;min-height:0;display:flex}
.pila::before{content:"";position:absolute;inset:10px -5px -7px 8px;border-radius:26px;background:var(--hoja-2);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16);transform:rotate(.5deg)}
.hoja{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border-radius:26px;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 0 0 1px rgba(var(--sombra-rgb),.07),0 2px 3px rgba(var(--sombra-rgb),.08),0 24px 50px -24px rgba(var(--sombra-rgb),.42);overflow:hidden}
.hoja::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(rgba(var(--hoja-rgb),0),rgba(var(--hoja-rgb),.97) 48%);pointer-events:none;z-index:4}
.e-actividad .hoja::after{display:none}

/* Cabecera */
.cabeza{display:grid;grid-template-columns:auto 1fr auto;align-items:end;column-gap:30px;padding:30px 26px 4px 52px}
.fecha{display:flex;align-items:flex-end;gap:16px}
.dia{font:700 92px/.78 var(--f-disp);font-variation-settings:"opsz" 96;letter-spacing:-.055em;color:var(--o800)}
.eyebrow{display:flex;align-items:center;gap:7px;font:650 14px var(--f-disp);color:var(--o500);margin-bottom:4px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dsem{font:650 31px/1 var(--f-disp);letter-spacing:-.025em}
.mes{font-size:14.5px;color:var(--t2);margin-top:6px}
.rastro{justify-self:end;width:min(480px,100%)}
.rastro-svg{display:block;width:100%;height:auto;overflow:visible}
.rastro-pie{font-size:14px;color:var(--t2);padding-left:4px;margin-top:-2px}
.rastro-pie b{color:var(--t1);font-weight:650}
.rastro-pie .venc{color:var(--venc);font-weight:600}
.herr{display:flex;gap:2px;align-self:start;color:var(--t2)}
.herr button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.herr button:hover{background:color-mix(in srgb,var(--tinte) 10%,transparent)}
.tr-fondo{fill:none;stroke:var(--punto);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:0 9}
.tr-hecho{fill:none;stroke:var(--o500);stroke-width:4.6;stroke-linecap:round;stroke-dasharray:0 9}
.suelo{fill:none;stroke:var(--suelo);stroke-width:2.4;stroke-linecap:round}
.monticulo{fill:var(--tierra-2)}
.entrada{fill:var(--tierra-osc)}
.hierba{fill:none;stroke:var(--o500);stroke-width:2;stroke-linecap:round}
.miga,.miga-llevada{fill:var(--o300)}
.miga{transition:opacity .5s}
.miga.oculta{opacity:0}
.e-fin #tr-hor .miga-llevada{display:none}

.pestanas{display:flex;align-items:center;gap:2px;padding:16px 30px 2px 44px}
.pestana{font-weight:500;font-size:14.5px;color:var(--t2);padding:8px 15px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.pestana:hover{color:var(--t1)}
.pestana.on{background:var(--o500);color:var(--sobre-acento);font-weight:600;box-shadow:0 3px 8px -3px rgba(62,67,42,.55)}

/* Lista */
.cuerpo{position:relative;flex:1;min-height:0;overflow:hidden;padding:2px 40px 0 40px}
.capa{position:absolute;inset:0;pointer-events:none;z-index:5}
.seccion{margin-top:8px}
.sec-cab{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 10px}
.sec-tit{font:650 17px var(--f-disp);letter-spacing:-.01em}
.sec-n{font-size:12.5px;font-weight:600;color:var(--t2);border:1px solid var(--borde);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.puntos{flex:1;height:6px;background:radial-gradient(circle,var(--punto) 1.25px,transparent 1.7px) 0 50%/9px 6px repeat-x}
.sec--venc .sec-tit{color:var(--venc)}
.sec--venc .sec-n{color:var(--venc);border-color:rgba(var(--venc-rgb),.3)}
.accion{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc)}
.accion--suave{border-color:var(--borde);background:transparent;color:var(--t2)}

.fila{position:relative;height:44px;border-radius:14px;overflow:hidden}
.fila:hover{background:color-mix(in srgb,var(--tinte) 7%,transparent)}
.fila-in{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;column-gap:8px;height:44px;padding:0 12px 0 10px}
.check-wrap{position:relative;width:23px;height:23px;display:grid;place-items:center}
.check{position:relative;width:23px;height:23px;border-radius:50%;border:1.8px solid var(--check-borde);display:grid;place-items:center}
.check:hover{border-color:var(--o500)}
.chk-bg{position:absolute;inset:-2px;border-radius:50%;background:var(--o500);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.check svg{position:relative;width:15px;height:15px;fill:none;stroke:var(--sobre-acento);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:21;stroke-dashoffset:21;transition:stroke-dashoffset .3s .12s ease-out}
.fila.hecha .chk-bg{transform:scale(1)}
.fila.hecha .check svg{stroke-dashoffset:0}
.fila.hecha .check{border-color:transparent}
.sub-anillo{position:absolute;left:50%;top:50%;width:37px;height:37px;margin:-18.5px 0 0 -18.5px;pointer-events:none}
.titulo{position:relative;justify-self:start;max-width:100%;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tachon{position:absolute;left:-3px;width:calc(100% + 6px);top:50%;height:10px;margin-top:-4px;overflow:visible;pointer-events:none;clip-path:inset(-4px 100% -4px -4px)}
.tachon path{fill:none;stroke:var(--t2);stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fila.hecha .tachon,.mt .tachon{clip-path:inset(-4px -4px -4px -4px)}
.fila.hecha .texto{color:var(--t3)}
.meta{display:flex;align-items:center;gap:16px;font-size:13.5px;color:var(--t2);white-space:nowrap}
.meta>span{display:inline-flex;align-items:center;gap:5px}
.bandera{color:var(--l-trabajo)}
.lista i{width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:2px}
.lista span{color:var(--t2)}
.pastilla{gap:6px!important;padding:4px 11px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc);font-weight:600;font-size:13px}
.fila.hecha .meta{opacity:.7}
.habito.hecha .texto{color:var(--t1)}
.racha{display:inline-flex;align-items:center;gap:1px;color:var(--o500)}
.r-hor{display:inline-block;width:22px;height:22px}
.r-hor:nth-child(even){transform:translateY(-2px)}
.r-hor .hormiga{width:100%;height:100%}
.r-hor .h-antenas{animation-delay:var(--d)}
.r-hor.nueva{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.faltan{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--punto);margin:0 6.5px}
.racha-n{margin-left:10px;font-size:13.5px;color:var(--t2);min-width:44px}

/* La hormiga que se lleva la tarea */
.hor-pos{position:absolute;left:0;top:0;width:38px;height:38px}
.hor-dir{width:100%;height:100%}
.hor-dir .hormiga{width:100%;height:100%}
.carga{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;background:var(--card);border:1px solid var(--borde);box-shadow:0 8px 16px -8px rgba(var(--sombra-rgb),.5),0 1px 2px rgba(var(--sombra-rgb),.12);font-size:13px;color:var(--t3);white-space:nowrap;max-width:210px}
.mini-check{width:17px;height:17px;border-radius:50%;background:var(--o500);display:grid;place-items:center;flex:none}
.mini-check svg{width:11px;height:11px;fill:none;stroke:var(--sobre-acento);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.carga .tx{overflow:hidden;text-overflow:ellipsis;text-decoration:line-through;text-decoration-color:var(--t2);text-decoration-thickness:1.5px}
.huellas{position:absolute;height:7px;background:radial-gradient(circle at 2px 1.6px,var(--huella) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x,radial-gradient(circle at 7.5px 5.2px,var(--huella) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x}

/* Captura */
.captura{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(600px,64%);height:54px;display:flex;align-items:center;gap:12px;padding:0 9px;border-radius:999px;background:var(--card);border:1px solid var(--borde);box-shadow:0 14px 30px -14px rgba(var(--sombra-rgb),.5),0 1px 2px rgba(var(--sombra-rgb),.1);z-index:6}
.cap-hor{position:absolute;left:58px;top:-28px;width:31px;height:31px}
.cap-hor .hormiga{width:100%;height:100%;filter:drop-shadow(0 0 1.5px var(--hoja)) drop-shadow(0 0 1.5px var(--hoja)) drop-shadow(0 0 1px var(--hoja))}
.cap-mas{width:36px;height:36px;border-radius:50%;background:var(--o500);color:var(--sobre-acento);display:grid;place-items:center;flex:none}
.cap-ph{color:var(--t2);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.captura kbd{white-space:nowrap;flex:none;margin-left:auto;font:500 11px var(--f-mono);color:var(--t2);padding:6px 11px;border:1px solid var(--borde);border-radius:999px;background:var(--kbd-bg)}
.e-actividad .captura{display:none}

/* Día terminado */
.vacio-hoy{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 6px}
.vacio-hoy>svg{width:400px;height:auto;display:block}
.vacio-hoy h2{font:700 34px/1.05 var(--f-disp);letter-spacing:-.03em;margin-top:2px}
.vacio-hoy p{color:var(--t2);font-size:16px;margin-top:8px}
.vacio-acc{display:flex;gap:10px;margin-top:18px}
.btn-oliva{display:inline-flex;align-items:center;gap:8px;background:var(--o500);color:var(--sobre-acento);font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 10px -4px rgba(62,67,42,.6)}
.btn-sec{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--borde);color:var(--t2);font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:999px}
.zzz{font:700 18px var(--f-disp);fill:var(--o500);animation:zzz 3.3s ease-in-out infinite;opacity:0}
.zzz:nth-of-type(2){animation-delay:1.1s}
.zzz:nth-of-type(3){animation-delay:2.2s}
@keyframes zzz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.9}100%{opacity:0;transform:translate(10px,-14px)}}
.hamaca{fill:var(--o400)}
.nervio{fill:none;stroke:var(--nervio);stroke-width:2;stroke-linecap:round}
.tallo{fill:none;stroke:var(--tallo);stroke-width:5;stroke-linecap:round}
.hojita{fill:var(--o500)}
.v-suelo{fill:none;stroke:var(--punto);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:0 9}

/* Actividad: el hormiguero */
.cabeza--act{grid-template-columns:1fr auto auto;padding-bottom:2px}
.act-tit{font:700 46px/1 var(--f-disp);letter-spacing:-.04em;color:var(--o800);margin-top:2px}
.act-stats{display:flex;gap:34px;margin-bottom:4px}
.act-stats div{display:flex;flex-direction:column}
.act-stats b{font:700 30px/1 var(--f-disp);letter-spacing:-.03em}
.act-stats span{font-size:13px;color:var(--t2);margin-top:5px}
.cuerpo--act{padding:6px 40px 0}
.nido{display:block;width:100%;height:auto}
.tierra{fill:var(--tierra)}
.estrato{fill:var(--estrato);opacity:.2}
.mota{fill:var(--mota)}
.guijarro{fill:var(--tierra-2);stroke:var(--tierra-borde);stroke-width:1.2}
.t-borde{fill:none;stroke:var(--tierra-borde);stroke-width:28;stroke-linecap:round}
.t-hueco{fill:none;stroke:var(--hueco);stroke-width:19;stroke-linecap:round}
.c-borde{fill:var(--tierra-borde)}
.c-borde-cav{fill:none;stroke:var(--tierra-borde);stroke-width:4;stroke-dasharray:5 7}
.c-sombra{fill:var(--c-sombra)}
.c-hueco{fill:var(--hueco);transition:fill .2s}
.camara{cursor:pointer}
.camara:hover .c-hueco{fill:var(--hueco-hover)}
.camara:hover .etq-1{fill:var(--o600)}
.etq-1{font:650 14.5px var(--f-disp);fill:var(--t1)}
.etq-2{font:500 12.5px var(--f-sans);fill:var(--t2)}
.cavando .etq-1{fill:var(--o600)}
.tierra-salta{fill:var(--mota);animation:salta 1s ease-out infinite}
@keyframes salta{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.leyenda{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;color:var(--t2);font-size:14px;margin-top:8px;padding-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip i{width:13px;height:6.5px;border-radius:4px}

/* Tablero de estados vacíos */
.tablero{height:100vh;overflow:auto;padding:36px 56px 40px}
.tablero h1{font:700 36px/1.05 var(--f-disp);letter-spacing:-.03em;display:flex;align-items:center;gap:14px}
.tablero h1 .hormiga{width:46px;height:46px}
.tablero .sub{color:var(--kraft-tinta);font-size:16px;margin:8px 0 24px;max-width:760px;line-height:1.45}
.rejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tarjeta{position:relative;background-color:var(--hoja);background-image:var(--tex-hoja);border-radius:22px;padding:18px 22px 22px;box-shadow:0 0 0 1px rgba(var(--sombra-rgb),.07),0 18px 36px -22px rgba(var(--sombra-rgb),.45)}
.etq{font:650 13px var(--f-disp);color:var(--t3)}
.ilus{display:block;width:100%;height:auto;margin:6px 0 8px}
.tarjeta h3{font:700 21px/1.1 var(--f-disp);letter-spacing:-.02em}
.tarjeta p{color:var(--t2);font-size:14.5px;line-height:1.45;margin-top:6px}
.momentos-tit{font:700 22px var(--f-disp);letter-spacing:-.02em;margin:28px 0 14px}
.rejilla-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}
.story{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mini-caja{position:relative;height:104px;border-radius:14px;background:color-mix(in srgb,var(--tinte) 7%,transparent);overflow:hidden}
.mini-fila{position:absolute;left:14px;right:10px;top:40px;display:flex;align-items:center;gap:9px;font-size:14px}
.mc{width:20px;height:20px;border-radius:50%;background:var(--o500);display:grid;place-items:center;flex:none}
.mc svg{width:13px;height:13px;fill:none;stroke:var(--sobre-acento);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.mt{position:relative;color:var(--t3);white-space:nowrap}
.mini-pie{font-size:13px;color:var(--t2);margin-top:7px}
.mini-pie b{color:var(--t1)}
.cargando{position:relative;height:104px;margin-top:10px;border-radius:14px;background:color-mix(in srgb,var(--tinte) 7%,transparent);overflow:hidden}
.carg-tx{position:absolute;left:16px;top:14px;font-size:14px;color:var(--t2)}
.carg-linea{position:absolute;left:0;right:0;bottom:22px;height:6px;background:radial-gradient(circle,var(--punto) 1.25px,transparent 1.7px) 0 50%/9px 6px repeat-x}
.carg-hor{position:absolute;left:0;bottom:22px;width:32px;height:32px;animation:cruza 5s linear infinite}
.carg-hor .hormiga{width:100%;height:100%}
@keyframes cruza{from{transform:translateX(-40px)}to{transform:translateX(330px)}}
.captura--mini{position:relative;left:auto;bottom:auto;transform:none;width:100%;margin-top:46px;z-index:auto}

/* ═══ Modo oscuro (tokens de :root en style.css) + toques de noche ═══ */
:root[data-theme="dark"]{
  --kraft:#211a15; --kraft-tinta:#c4ad86;
  --hoja:#352b23; --hoja-2:#2b231c; --card:#40342b; --hoja-rgb:53,43,35;
  --t1:#e6d1aa; --t2:#cdb690; --t3:#a08d6c;
  --o300:#c9d59b; --o400:#6f7a48; --o500:#a4b272; --o600:#b4c182; --o700:#c4d195; --o800:#d6e0ad;
  --venc:#d8a99b; --venc-rgb:196,122,106;
  --borde:rgba(255,226,190,.16); --borde-s:rgba(255,226,190,.08);
  --tierra:#2a2119; --tierra-2:#5a4634; --tierra-borde:#1c1611; --hueco:#54412f; --tierra-osc:#f2c46d;
  --l-trabajo:#e08a66; --l-casa:#7fb0c7; --l-personal:#7fc0b2; --l-lect:#d9a85e; --l-viajes:#d27d84;
  --sombra-rgb:0,0,0; --check-borde:rgba(255,226,190,.42); --punto:rgba(255,226,190,.24); --punto-kraft:rgba(255,226,190,.22);
  --huella:color-mix(in srgb,var(--tinte-osc) 60%,transparent); --lente:rgba(255,238,214,.08); --nav-bg:rgba(64,52,43,.96); --hab-bg:rgba(255,238,214,.04);
  --kbd-bg:rgba(255,238,214,.05); --kraft-hover:rgba(255,238,214,.06); --home:rgba(230,209,170,.8);
  --bandeja:#5a4634; --bandeja-borde:#7a6148; --sobre-acento:#211a15; --c-sombra:#3f3226; --estrato:#1c1611; --hueco-hover:#7a6148; --mota:#4f3f30; --suelo:#6b5640; --nervio:#8c9a65; --tallo:#7d8a55;
}
[data-theme="dark"] .avatar,[data-theme="dark"] .m-av{background:#576038;color:#e6d1aa}
[data-theme="dark"] .hoja{box-shadow:0 0 0 1px rgba(255,226,190,.07),0 2px 3px rgba(0,0,0,.25),0 24px 50px -24px rgba(0,0,0,.7)}
[data-theme="dark"] .m-hoja{box-shadow:0 -1px 0 rgba(255,226,190,.08),0 -12px 30px -18px rgba(0,0,0,.7)}
[data-theme="dark"] .entrada{filter:drop-shadow(0 0 5px rgba(242,196,109,.85))}
[data-theme="dark"] .c-hueco{fill:url(#brillo-camara)}
[data-theme="dark"] .camara:hover .c-hueco{fill:var(--hueco-hover)}
[data-theme="dark"] .zzz{fill:#f1e2b8}
.estrella{display:none;fill:#f3e6bf}
[data-theme="dark"] .estrella{display:inline;animation:titila 2.6s ease-in-out infinite alternate}
@keyframes titila{from{opacity:.2}to{opacity:.9}}
.noche{display:none}
[data-theme="dark"] .noche{display:inline}
.luna{fill:#f1e2b8;opacity:.92}
.luciernaga{fill:#f5d77a;filter:drop-shadow(0 0 4px #f5d77a);animation:luci 3.6s ease-in-out infinite alternate}
@keyframes luci{0%{opacity:.15;transform:translate(0,0)}100%{opacity:1;transform:translate(7px,-9px)}}

/* ═══ Añadido el 24-nov-2026: Agenda, Notas, Inbox con listas y detalle (PC) ═══ */
:root{--cal-google:#3d6e85;--cal-icloud:#b58236;--cinta:rgba(165,177,125,.55);--cinta-raya:rgba(255,252,241,.4)}
:root[data-theme="dark"]{--cal-google:#7fb0c7;--cal-icloud:#d9a85e;--cinta:color-mix(in srgb,var(--tinte-osc) 30%,transparent);--cinta-raya:rgba(255,238,214,.07)}
.cabeza--pag{grid-template-columns:1fr auto auto;padding-bottom:2px}
.pag-sub{font-size:14.5px;color:var(--t2);margin-top:8px}
.pag-sub .venc{color:var(--venc);font-weight:600}
.buscador{display:flex;align-items:center;gap:9px;width:300px;height:42px;padding:0 14px;border-radius:999px;background:var(--hab-bg);border:1px solid var(--borde-s);color:var(--t3);font-size:14.5px;align-self:end;margin-bottom:4px}
.buscador kbd{margin-left:auto;font:500 11px var(--f-mono);padding:3px 8px;border:1px solid var(--borde);border-radius:999px}
.pest-sep{width:1px;height:22px;background:var(--borde);margin:0 10px}
.pestana .n{font-size:12px;font-weight:700;opacity:.8}
.pest-dcha{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--t2);font-weight:600;font-size:14px}
.pest-dcha button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.pest-dcha button:hover{background:color-mix(in srgb,var(--tinte) 10%,transparent)}
.pest-dcha .boton-hoy{display:inline-flex;align-items:center;gap:6px;width:auto;height:30px;padding:0 12px;border:1px solid var(--borde);border-radius:999px;font-size:13px}
.pest-dcha .orden{display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:13.5px}

/* Agenda (PC): el día a la izquierda, lo que no tiene hora a la derecha */
.ag-pc{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:28px;padding-top:12px}
.ag{position:relative}
.ag-h{position:absolute;left:0;right:0;height:0}
.ag-h b{position:absolute;left:0;width:46px;top:-8px;text-align:right;font:600 12px var(--f-sans);color:var(--t3);font-variant-numeric:tabular-nums}
.ag-h::after{content:"";position:absolute;left:58px;right:0;top:-3px;height:6px;background:radial-gradient(circle,var(--punto) 1.1px,transparent 1.6px) 0 50%/9px 6px repeat-x}
.ag-b{position:absolute;display:flex;gap:9px;padding:8px 12px 0 14px;border-radius:13px;overflow:hidden}
.ag-b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ag-tarea{background:var(--card);border:1px solid var(--borde);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.08),0 6px 12px -10px rgba(var(--sombra-rgb),.35)}
.ag-ev{background:color-mix(in srgb,var(--c) 14%,var(--hoja));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.ag-ev .ag-tit{color:color-mix(in srgb,var(--c) 55%,var(--t1))}
.ag-tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.ag-tit{font-size:15px;font-weight:600;line-height:1.25;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag-meta .lista{display:inline-flex;align-items:center;gap:4px}
.ag-check{flex:none;width:19px;height:19px;margin-top:1px;border-radius:50%;border:1.6px solid var(--check-borde);display:grid;place-items:center;cursor:pointer}
.ag-check svg{width:11px;height:11px;fill:none;stroke:var(--sobre-acento);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ag-b.hecha .ag-check{background:var(--o500);border-color:transparent}
.ag-b.hecha .ag-check svg{opacity:1}
.ag-b.hecha .ag-tit{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2)}
.ag-b.corto{align-items:center;padding-top:0}
.ag-b.corto .ag-tx{flex-direction:row;align-items:baseline;gap:10px}
.ag-hab{border-radius:999px;background:color-mix(in srgb,var(--tinte) 13%,transparent);border:1px solid color-mix(in srgb,var(--tinte) 24%,transparent);padding:0 12px 0 8px}
.ag-hab::before{display:none}
.ag-hab .r-hor{width:18px;height:18px;flex:none}
.ag-ahora{position:absolute;left:54px;right:0;height:2px;margin-top:-1px;border-radius:2px;background:var(--o500);z-index:3}
.ag-ahora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--o500);box-shadow:0 0 0 3px var(--hoja)}
.ag-ahora-t{position:absolute;left:0;width:46px;margin-top:-8px;text-align:right;font:700 12px var(--f-sans);color:var(--o600);z-index:3;font-variant-numeric:tabular-nums}
.ag-lado{display:flex;flex-direction:column;gap:14px}
.lado-card{border-radius:18px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:13px 14px 14px}
.lado-card h4{display:flex;align-items:center;gap:8px;font:650 15.5px var(--f-disp);letter-spacing:-.01em}
.lado-card h4 .sec-n{font-family:var(--f-sans)}
.lado-card.venc h4{color:var(--venc)}
.sh-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--card);border:1px dashed var(--check-borde);font-size:14px;margin-top:8px;cursor:grab}
.sh-item .asa{color:var(--t3);font-size:13px;letter-spacing:-2px}
.sh-item i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.sh-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-item small{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--t3);font-size:12px}
.lado-pista{font-size:12.5px;color:var(--t3);margin-top:10px;line-height:1.4}
.semana-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.semana-mini div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:11px;font-size:11px;color:var(--t3);cursor:pointer}
.semana-mini b{font:650 15px var(--f-disp);color:var(--t1)}
.semana-mini .hoy{background:var(--card);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.12);color:var(--o600)}
.semana-mini .hoy b{color:var(--o700)}
.semana-mini i{display:flex;gap:2px;height:4px}
.semana-mini i::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--o500)}

/* Notas (PC): cuatro columnas */
.nota-nueva{display:flex;align-items:center;gap:10px;height:50px;max-width:620px;padding:0 16px;border-radius:16px;background:var(--card);border:1px dashed var(--check-borde);color:var(--t3);font-size:15px;margin:10px 0 2px 6px}
.nota-nueva .ico{color:var(--o500)}
.nota-nueva span:last-child{margin-left:auto;display:flex;gap:12px;color:var(--t3)}
.notas4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;padding:4px 6px 8px}
.app.con-detalle .notas4{grid-template-columns:repeat(3,1fr)}
.notas4>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.nota{position:relative;padding:15px 16px 13px;border-radius:18px;background:var(--card);border:1px solid var(--borde-s);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.07),0 10px 18px -14px rgba(var(--sombra-rgb),.4)}
.nota.fijada{margin-top:10px}
.nota h3{font:650 16.5px/1.22 var(--f-disp);letter-spacing:-.01em;color:var(--t1)}
.nota p{font-size:14px;line-height:1.45;color:var(--t2);margin-top:6px}
.nota-pie{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px;font-size:12.5px;color:var(--t3)}
.nota-pie .lista{display:inline-flex;align-items:center;gap:4px}
.cinta{position:absolute;left:50%;top:-10px;width:64px;height:18px;margin-left:-32px;transform:rotate(-4deg);border-radius:2px;background:repeating-linear-gradient(90deg,var(--cinta) 0 6px,var(--cinta-raya) 6px 8px)}
.nota-lista{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:7px}
.nota-lista li{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.3;color:var(--t1);cursor:pointer}
.nl-c{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.6px solid var(--check-borde);display:grid;place-items:center}
.nl-c svg{width:10px;height:10px;fill:none;stroke:var(--sobre-acento);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.nota-lista li.ok .nl-c,.det-subs li.ok .nl-c{background:var(--o500);border-color:transparent}
.nota-lista li.ok .nl-c svg,.det-subs li.ok .nl-c svg{opacity:1}
.st{position:relative}
.nota-lista li.ok .st,.det-subs li.ok .st{color:var(--t3)}
.nota-lista li.ok .tachon,.det-subs li.ok .tachon{clip-path:inset(-4px -4px -4px -4px)}
.nota-acc{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-weight:600;font-size:13px;color:var(--o600);padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--tinte) 12%,transparent)}
.e-notas .captura{display:none}

/* Inbox (PC) */
.sec-punto{width:9px;height:9px;border-radius:50%;flex:none;margin-right:-2px}
.sec-punto.sin{background:none;box-shadow:inset 0 0 0 1.7px var(--t3)}
.pastilla-n{padding:4px 11px;border-radius:999px;border:1px solid var(--borde);color:var(--t2);font-weight:600;font-size:13px}
.pastilla-n.hoy{border-color:color-mix(in srgb,var(--tinte) 32%,transparent);background:color-mix(in srgb,var(--tinte) 9%,transparent);color:var(--o600)}
.inb-fila{cursor:pointer}
.fila.elegida{background:color-mix(in srgb,var(--o500) 10%,transparent);box-shadow:inset 3px 0 0 var(--o500)}

/* Detalle (PC): tercera columna, una hoja aparte */
.app.con-detalle{grid-template-columns:250px minmax(0,1fr) 430px}
.app.con-detalle .captura{width:min(520px,70%)}
.det-panel{position:relative;z-index:2;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 22px 0;border-radius:26px;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 0 0 1px rgba(var(--sombra-rgb),.07),0 24px 50px -24px rgba(var(--sombra-rgb),.42)}
[data-theme="dark"] .det-panel{box-shadow:0 0 0 1px rgba(255,226,190,.07),0 24px 50px -24px rgba(0,0,0,.7)}
.det-cab{display:flex;align-items:center;justify-content:space-between;height:52px}
.det-ruta{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--t3)}
.det-lista{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 11px;border-radius:999px;border:1px solid var(--borde);font-weight:600;font-size:13.5px;color:var(--t1)}
.det-lista i{width:8px;height:8px;border-radius:50%}
.det-lista .ico{color:var(--t3)}
.det-btns{display:flex;gap:6px}
.det-btns>*{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:var(--hab-bg);border:1px solid var(--borde-s)}
.det-tit{display:flex;align-items:flex-start;gap:12px;padding:10px 2px 4px}
.det-tit .check-wrap{margin-top:4px;flex:none}
.det-tit h2{font:650 25px/1.15 var(--f-disp);letter-spacing:-.025em;color:var(--t1)}
.det-tit.hecha h2{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2);text-decoration-thickness:2px}
.det-sec{margin-top:10px}
.det-sec .sec-cab{padding-left:2px;height:36px}
.det-sec .sec-tit{font-size:14.5px;color:var(--t2)}
.det-chips{display:flex;gap:6px;padding:2px 0 10px}
.det-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--borde);background:var(--card);font-weight:600;font-size:13.5px;color:var(--t2);white-space:nowrap}
.det-chip.on{background:var(--o500);border-color:transparent;color:var(--sobre-acento)}
.det-filas{border-radius:18px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:0 12px}
.det-fila{display:flex;align-items:center;gap:12px;height:44px;font-size:15px;color:var(--t1)}
.det-fila+.det-fila{border-top:1.6px dotted var(--punto)}
.det-fila>span>.ico{color:var(--t2)}
.det-fila .bandera .ico{color:var(--l-trabajo)}
.det-valor{margin-left:auto;color:var(--t2);font-size:14px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.det-valor .ico{color:var(--t3)}
.det-sw{position:relative;width:40px;height:24px;border-radius:999px;background:var(--o500);margin-left:auto}
.det-sw::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sobre-acento);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.det-subs{list-style:none;padding:0 2px}
.det-subs li{display:flex;align-items:center;gap:11px;height:34px;font-size:15px;color:var(--t1);cursor:pointer}
.det-subs .nl-c{width:19px;height:19px;margin:0}
.det-subs .nl-c svg{width:11px;height:11px}
.det-subs li.anadir{color:var(--t3)}
.det-enlace{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--borde-s);font-size:14px;color:var(--t1);white-space:nowrap}
.det-enlace .ico{color:var(--t2)}
.det-enlace span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.det-enlace span em{font-style:normal;color:var(--t3)}
.det-enlace .ico:last-child{margin-left:auto;color:var(--t3)}
.det-nota{border-radius:16px;border:1px solid var(--borde-s);padding:8px 14px 12px;min-height:110px;font-size:14.5px;line-height:26px;color:var(--t1);background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 25px,var(--borde) 25px 26px);background-position:0 8px}
.det-acc{display:flex;gap:8px;margin:18px 0 26px}
.det-acc button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:7px;height:42px;border-radius:999px;border:1px solid var(--borde);font-weight:600;font-size:14px;color:var(--t2)}
.det-acc .det-borrar{border-color:rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc)}
.det-creada{font-size:12.5px;color:var(--t3);text-align:center;margin:-10px 0 22px}

/* ═══ Añadido el 25-nov-2026: búsqueda (Ctrl+K) y Ajustes (PC) ═══ */
.velo{position:fixed;inset:0;background:rgba(43,34,19,.36);z-index:20}
[data-theme="dark"] .velo{background:rgba(0,0,0,.55)}
.paleta{position:fixed;left:50%;top:90px;transform:translateX(-50%);width:640px;z-index:22;border-radius:22px;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 30px 70px -20px rgba(0,0,0,.5),0 0 0 1px rgba(var(--sombra-rgb),.08);overflow:hidden}
.pl-input{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;font-size:18px;color:var(--t1);border-bottom:1.6px dotted var(--punto)}
.pl-input .ico{color:var(--t2)}
.pl-input .cursor{display:inline-block;width:2px;height:22px;margin-left:-10px;background:var(--o500);animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.pl-input kbd{margin-left:auto;font:500 11px var(--f-mono);padding:4px 9px;border:1px solid var(--borde);border-radius:999px;color:var(--t3)}
.pl-filtros{display:flex;gap:6px;padding:12px 18px 4px}
.pl-filtro{height:30px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--t2);background:var(--hab-bg);border:1px solid var(--borde-s);display:inline-flex;align-items:center;gap:6px}
.pl-filtro.on{background:var(--o500);color:var(--sobre-acento);border-color:transparent}
.pl-filtro span{font-size:11.5px;opacity:.8}
.pl-cuerpo{padding:2px 10px 6px}
.pl-cuerpo .sec-cab{height:34px;padding-left:10px}
.pl-cuerpo .sec-tit{font-size:14px;color:var(--t2)}
.pl-res{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px;border-radius:12px;font-size:15px;color:var(--t1)}
.pl-res.sel{background:color-mix(in srgb,var(--o500) 12%,transparent)}
.pl-res mark{background:color-mix(in srgb,var(--o500) 24%,transparent);color:inherit;border-radius:3px}
.pl-res .circ{width:20px;height:20px;border-radius:50%;border:1.7px solid var(--check-borde);flex:none}
.pl-res .circ.ok{background:var(--o500);border-color:transparent}
.pl-res .caja{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--hab-bg);border:1px solid var(--borde-s);color:var(--t2);flex:none}
.pl-res .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-res .tx small{color:var(--t3);font-size:13px;margin-left:6px}
.pl-res .dcha{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2);white-space:nowrap}
.pl-res .dcha i{width:7px;height:7px;border-radius:50%}
.pl-res.hecha .tx{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2)}
.pl-res .enter{font:500 11px var(--f-mono);padding:2px 7px;border:1px solid var(--borde);border-radius:6px;color:var(--t3)}
.pl-pie{display:flex;gap:16px;align-items:center;padding:10px 20px;border-top:1.6px dotted var(--punto);font-size:12.5px;color:var(--t3)}
.pl-pie kbd{font:500 11px var(--f-mono);padding:2px 6px;border:1px solid var(--borde);border-radius:6px;margin-right:4px}
.pl-pie .hormiga{width:22px;height:22px;margin-left:auto}
/* Ajustes: ventana de dos columnas */
.aj{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:980px;height:700px;z-index:22;display:grid;grid-template-columns:230px 1fr;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.5),0 0 0 1px rgba(var(--sombra-rgb),.08)}
.aj-nav{background-color:var(--kraft);background-image:var(--tex-kraft);padding:22px 12px}
.aj-nav h2{font:700 24px var(--f-disp);letter-spacing:-.03em;padding:0 10px 14px}
.aj-nav a{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border-radius:12px;font-size:14.5px;color:var(--t1)}
.aj-nav a .ico{color:var(--kraft-tinta)}
.aj-nav a.on{background-color:var(--hoja);background-image:var(--tex-hoja);font-weight:650;color:var(--o800);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.16)}
.aj-nav a.on .ico{color:var(--o500)}
.aj-nav .ver{position:absolute;left:24px;bottom:20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--kraft-tinta)}
.aj-nav .ver .hormiga{width:22px;height:22px}
.aj-main{position:relative;background-color:var(--hoja);background-image:var(--tex-hoja);padding:24px 30px;overflow:hidden}
.aj-main h3{font:700 28px var(--f-disp);letter-spacing:-.03em}
.aj-main .cerrar{position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:var(--hab-bg);border:1px solid var(--borde-s)}
.aj-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin-top:14px}
.aj-blq .sec-cab{height:34px;padding-left:2px}
.aj-blq .sec-tit{font-size:14.5px;color:var(--t2)}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--hab-bg);border:1px solid var(--borde-s)}
.seg span{flex:1;text-align:center;height:34px;line-height:34px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--t2);cursor:pointer}
.seg span.on{background:var(--card);color:var(--t1);box-shadow:0 1px 2px rgba(var(--sombra-rgb),.18)}
.acentos{display:flex;justify-content:space-between;padding:12px 2px 2px}
.acento{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);cursor:pointer}
.acento i{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.acento i svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.acento.on i{box-shadow:0 0 0 2.5px var(--hoja),0 0 0 4.5px var(--c)}
.acento.on i svg{opacity:1}
.acento.on{color:var(--t1);font-weight:600}
.prev{border-radius:16px;background:var(--card);border:1px solid var(--borde-s);padding:12px 14px;--a:var(--o500)}
.prev .tr-f{fill:none;stroke:var(--punto);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 10}
.prev .tr-h{fill:none;stroke:var(--a);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 10}
.prev svg.rm{display:block;width:100%;height:auto}
.prev-fila{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14.5px}
.prev-fila .ck{width:20px;height:20px;border-radius:50%;background:var(--a);display:grid;place-items:center;flex:none}
.prev-fila .ck svg{width:12px;height:12px;fill:none;stroke:var(--sobre-acento);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.prev-fila .tx{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t2)}
.prev-fila .btn{margin-left:auto;height:30px;padding:0 12px;border-radius:999px;background:var(--a);color:var(--sobre-acento);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center}
.prev-nota{font-size:12.5px;color:var(--t3);margin-top:8px;line-height:1.4}
.aj-card{border-radius:16px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:2px 14px}
.aj-fila{display:flex;align-items:center;gap:12px;min-height:50px;font-size:14.5px;color:var(--t1)}
.aj-fila+.aj-fila{border-top:1.6px dotted var(--punto)}
.aj-fila small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.sw{flex:none;margin-left:auto;position:relative;width:40px;height:24px;border-radius:999px;background:var(--o500);cursor:pointer}
.sw::after{content:"";position:absolute;left:19px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sobre-acento);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw.off{background:var(--punto)}
.sw.off::after{left:3px;background:var(--card)}
.estilos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.estilo{position:relative;border-radius:16px;padding:8px 8px 10px;background:var(--card);border:1.5px solid var(--borde-s)}
.estilo.on{border-color:var(--o500);box-shadow:0 0 0 3px color-mix(in srgb,var(--o500) 18%,transparent)}
.estilo .mini{height:70px;border-radius:11px;overflow:hidden;display:flex;gap:4px;padding:6px}
.estilo b{display:block;font:650 14.5px var(--f-disp);margin-top:7px;padding-left:2px}
.estilo small{display:block;font-size:11.5px;color:var(--t3);padding-left:2px}
.estilo .pronto{position:absolute;right:8px;top:8px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#2a1d1a;color:#e9c46a}
.mini.tierra{background:#e7cf9b}.mini.tierra .l{width:22%;border-radius:6px;background:rgba(255,250,235,.35)}.mini.tierra .h{flex:1;border-radius:8px;background:#fbf4df;padding:7px}.mini.tierra .h i{display:block;height:5px;border-radius:3px;background:color-mix(in srgb,var(--tinte) 35%,transparent);margin-bottom:6px}
.mini.reli{background:radial-gradient(ellipse at 50% 0,#3b2a4f,#120d10 70%)}.mini.reli .l{width:22%;border-radius:12px 12px 4px 4px;background:linear-gradient(#2c2520,#1a1512)}.mini.reli .h{flex:1;border-radius:4px;border:1px solid #8a6a2c;padding:7px;background:#1c1614}.mini.reli .h i{display:block;height:5px;border-radius:2px;background:#c9a44c;opacity:.55;margin-bottom:6px}

/* ═══ Añadido el 25-nov-2026: tableta y ventanas medianas (≤ 1100 px) ═══
   La barra lateral pasa a raíl de iconos, el rastro baja a su propia fila,
   la agenda apila su columna lateral y el detalle flota encima. */
@media (max-width:1100px){
  .app{grid-template-columns:76px 1fr;padding-left:0}
  .lateral{padding:8px 8px 6px 12px;align-items:stretch}
  .marca{justify-content:center;padding:6px 0 14px}
  .marca-nombre,.marca .plegar{display:none}
  .buscar{justify-content:center;padding:10px 0}
  .buscar span,.buscar kbd{display:none}
  .grupo{font-size:0;padding:10px 0 4px;border-top:1.6px dotted var(--punto-kraft);margin:6px 8px 0}
  .nav a{justify-content:center;padding:10px 0;position:relative}
  .nav a span:not(.n){display:none}
  .nav a .n{position:absolute;right:2px;top:2px;font-size:10px}
  .nav a.activa{margin-right:-20px;padding-right:20px}
  .nav a.activa .n{min-width:18px;height:18px;font-size:10px;right:22px;top:0}
  .listas a .n{display:none}
  .perfil{justify-content:center;padding:10px 0}
  .perfil>div{display:none}
  .cabeza{grid-template-columns:auto 1fr;row-gap:10px;padding:26px 22px 4px 36px}
  .cabeza .herr{grid-column:2;grid-row:1;justify-self:end}
  .cabeza .rastro{grid-column:1/-1;justify-self:stretch;width:100%;max-width:560px}
  .dia{font-size:76px}
  .pestanas{padding-left:28px;padding-right:22px}
  .cuerpo{padding:2px 22px 0 24px}
  .captura{width:min(560px,84%)}
  .captura kbd{display:none}
  .ag-pc{grid-template-columns:1fr;gap:16px}
  .ag-lado{order:-1;flex-direction:row;gap:10px}
  .ag-lado .lado-card{flex:1;min-width:0}
  .ag-lado .lado-card:last-child,.lado-pista{display:none}
  .cabeza--pag{grid-template-columns:1fr auto}
  .cabeza--pag .buscador{display:none}
  .notas4{grid-template-columns:repeat(2,1fr)}
  .app.con-detalle{grid-template-columns:76px 1fr}
  .app.con-detalle .det-panel{position:fixed;right:14px;top:14px;bottom:16px;width:min(440px,62vw);z-index:12;box-shadow:-20px 0 50px -20px rgba(0,0,0,.45),0 0 0 1px rgba(var(--sombra-rgb),.07)}
  .app.con-detalle .pila::after{content:"";position:absolute;inset:0;border-radius:26px;background:rgba(43,34,19,.18);z-index:5}
  .aj{width:calc(100vw - 40px);height:calc(100vh - 60px)}
  .aj-grid{grid-template-columns:1fr}
  .aj-main{overflow-y:auto}
  .paleta{width:calc(100vw - 80px)}
}

/* ═══ 26-nov: hormiguero de Actividad renovado ═══ */
:root{--mont-1:#ecca8e;--mont-2:#d6ad6c;--mont-3:#b78a50;--ramita:#9b7a4a;--hueco-luz:#fffaf0;--raiz:#a88456;--tablilla:rgba(251,244,223,.88)}
:root[data-theme="dark"]{--mont-1:#7a624c;--mont-2:#5c4836;--mont-3:#433427;--ramita:#806650;--hueco-luz:#a07a4c;--raiz:#5e4a38;--tablilla:rgba(53,43,35,.88)}
.c-hueco{fill:url(#luz-camara)}
.semilla{stroke:rgba(0,0,0,.2);stroke-width:.8}
.raiz{fill:none;stroke:var(--raiz);stroke-width:1.7;stroke-linecap:round;opacity:.6}
.ramita{fill:none;stroke:var(--ramita);stroke-width:2.2;stroke-linecap:round}
.tablilla{fill:var(--tablilla);stroke:var(--tierra-borde);stroke-width:1}
.bandera-r path:first-child{stroke:var(--t2);stroke-width:2;stroke-linecap:round}
.bandera-r path:last-child{fill:var(--o500)}
.mejor .etq-2{fill:var(--o600);font-weight:650}

/* ═══ 26-nov: el progreso de Hoy como senda con paradas (ver progreso.html) ═══ */
:root{--senda:#efdfb5;--senda-borde:#e2cb93;--piedra:#d9c49a}
:root[data-theme="dark"]{--senda:#3f3328;--senda-borde:#4a3c2f;--piedra:#55463a}
.rastro .rastro-pie{display:none}
.cabeza .rastro{width:min(620px,100%);align-self:center}
.pg-movil .cont-n,.pg-movil .cont-t{display:none}
.pg-host svg.pg{display:block;width:100%;height:auto;overflow:visible}
.pg-host .senda-b{fill:none;stroke:var(--senda-borde);opacity:.75;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.pg-host .senda{fill:none;stroke:var(--senda);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.pg-host .pisada{fill:var(--punto);transition:fill .25s}
.pg-host .pisada.h{fill:var(--o500)}
.pg-host .piedra{fill:var(--piedra)}
.pg-host .mata{fill:none;stroke:var(--o400);stroke-width:1.8;stroke-linecap:round}
.pg-host .hojita{fill:var(--o400)}
.pg-host .sombra-p{fill:rgba(0,0,0,.13)}
.pg-host .parada{transition:fill .3s;transform-box:fill-box;transform-origin:center}
.pg-host .parada.pend{fill:var(--hoja);stroke:var(--punto);stroke-width:1.8;stroke-dasharray:2.4 2.2}
.pg-host .parada.venc{fill:rgba(var(--venc-rgb),.12);stroke:var(--venc);stroke-width:1.8;stroke-dasharray:none}
.pg-host .parada.ok{stroke:none}
.pg-host .parada.pop{animation:pgpop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pgpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.pg-host .cont-n{font:700 34px var(--f-disp);letter-spacing:-.04em;fill:var(--t1)}
.pg-host .cont-n tspan.de{fill:var(--t3);font-size:22px}
.pg-host .cont-t{font:500 12.5px var(--f-sans);fill:var(--t2)}
.pg-host .cont-t .v{fill:var(--venc);font-weight:650}
.pg-host .pg-bandera{opacity:0;transition:opacity .4s}
.pg-host .lleno .pg-bandera{opacity:1}
.pg-host .entrada{fill:var(--tierra-osc);transition:filter .4s}
.pg-host .lleno .entrada{filter:drop-shadow(0 0 5px rgba(242,196,109,.95))}
.pg-host .grano{fill:var(--c);stroke:rgba(0,0,0,.18);stroke-width:.8}
.pg-host .grano.nuevo{animation:pgcae .5s ease-out}
@keyframes pgcae{from{transform:translateY(-14px);opacity:0}}
.pg-host .mont-tex{pointer-events:none}
.pg-host .ramita{fill:none;stroke:var(--ramita);stroke-width:2;stroke-linecap:round}
.pg-host .mont-cuerpo{transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.pg-host .suelo{fill:none;stroke:var(--suelo);stroke-width:2.4;stroke-linecap:round}

/* ═══ 26-nov: historial de un hábito (#habito), y en PC #habitos, #lista y #mes ═══ */
.hb-cab{display:flex;align-items:center;gap:14px}
.hb-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--o500) 14%,transparent);color:var(--o600);flex:none}
.hb-tit{font:700 30px/1.05 var(--f-disp);letter-spacing:-.03em}
.hb-sub{font-size:13.5px;color:var(--t2);margin-top:4px}
.hb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hb-stat{border-radius:16px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:10px 12px}
.hb-stat b{display:flex;align-items:center;gap:5px;font:700 26px/1 var(--f-disp);letter-spacing:-.03em}
.hb-stat b .hormiga{width:20px;height:20px}
.hb-stat span{display:block;font-size:12px;color:var(--t2);margin-top:4px}
.hb-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.hb-mes .dl{text-align:center;font:600 11px var(--f-sans);color:var(--t3);padding-bottom:2px}
.hb-d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;position:relative;font:600 12px var(--f-sans);color:var(--t3)}
.hb-d.ok{background:color-mix(in srgb,var(--o500) 13%,transparent)}
.hb-d.ok .hormiga{width:62%;height:62%}
.hb-d.ok i{position:absolute;right:4px;top:2px;font-style:normal;font-size:9.5px;color:var(--o600)}
.hb-d.no::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--punto)}
.hb-d.no b{display:none}
.hb-d.fut{color:var(--t3);opacity:.5}
.hb-d.hoy{box-shadow:inset 0 0 0 2px var(--o500)}
.hb-d.racha{background:color-mix(in srgb,var(--o500) 22%,transparent)}
.hb-anio{display:grid;grid-auto-flow:column;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,auto);gap:3px;margin-top:8px}
.hb-anio i{width:100%;aspect-ratio:1;border-radius:3px;background:var(--punto);opacity:.45}
.hb-anio i.ok{background:var(--o500);opacity:1}
.hb-anio i.ok2{background:var(--o400);opacity:1}
.hb-ley{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);margin-top:6px}
.hb-ley i{width:10px;height:10px;border-radius:3px}
.hb-ajustes{border-radius:16px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:2px 14px;margin-top:6px}
.hb-fila{display:flex;align-items:center;gap:11px;min-height:46px;font-size:14.5px;color:var(--t1)}
.hb-fila+.hb-fila{border-top:1.6px dotted var(--punto)}
.hb-fila .ico{color:var(--t2)}
.hb-fila span:last-child{margin-left:auto;color:var(--t2);font-size:13.5px}
.hb-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border-radius:999px;background:var(--o500);color:var(--sobre-acento);font-weight:650;font-size:15.5px;box-shadow:0 6px 14px -6px rgba(62,67,42,.6);margin-top:14px}
.hb-btn.hecho{background:color-mix(in srgb,var(--o500) 16%,transparent);color:var(--o700);box-shadow:none}
.hb-btn .hormiga{width:22px;height:22px;color:currentColor}
.hb-frase{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--o500) 10%,transparent);font-size:13.5px;color:var(--t2);margin-top:12px}
.hb-frase .hormiga{width:26px;height:26px;flex:none}
.hb-frase b{color:var(--t1);font-weight:650}

/* PC */
.hbp{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:26px;padding-top:8px;overflow:hidden}
.hbp-lista{display:flex;flex-direction:column;gap:10px}
.hbp-card{border-radius:18px;background:var(--hab-bg);border:1px solid var(--borde-s);padding:12px 16px 10px;cursor:pointer}
.hbp-card.on{background:var(--card);box-shadow:0 0 0 2px color-mix(in srgb,var(--o500) 45%,transparent),0 10px 20px -14px rgba(var(--sombra-rgb),.4)}
.hbp-top{display:flex;align-items:center;gap:12px}
.hbp-top b{display:block;font-weight:600;font-size:16px}
.hbp-top small{font-size:13px;color:var(--t2)}
.hbp-n{margin-left:auto;font:700 24px var(--f-disp);color:var(--o600)}
.hbp-sem{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px}
.hbp-sem .hs{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--f-sans);color:var(--t3)}
.hbp-sem .hs i{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.hbp-sem .hs i .hormiga{width:22px;height:22px}
.hbp-sem .hs em{width:5px;height:5px;border-radius:50%;background:var(--punto)}
.hbp-sem .hs.hoy{color:var(--o600)}
.hbp-sem .hs.hoy i{box-shadow:inset 0 0 0 1.6px var(--o400)}
.hbp-nuevo{display:flex;align-items:center;gap:9px;height:46px;padding:0 16px;border-radius:16px;border:1.5px dashed var(--check-borde);color:var(--t3);font-size:14.5px}
.hbp-det{border-radius:22px;background:var(--card);border:1px solid var(--borde-s);padding:18px 20px;overflow:hidden;box-shadow:0 12px 26px -18px rgba(var(--sombra-rgb),.45)}
.hbp-det .hb-mes{gap:3px}

.sm-chip.venc{background:color-mix(in srgb,var(--venc) 13%,transparent);color:var(--venc)}
.sm-chip .ico{flex:none}
.sm-chip span{overflow:hidden;text-overflow:ellipsis}
.sm-habs{padding:4px 0 6px}
.sm-hab{display:flex;align-items:center;justify-content:center;gap:1px;height:22px}
.sm-hab .hormiga{width:17px;height:17px}
.sm-hab .hormiga.no{color:var(--punto);opacity:.9}
.sm-hab small{font-size:11px;color:var(--t3);margin-left:4px}
.sm-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding-bottom:96px;-webkit-mask:linear-gradient(#000 calc(100% - 30px),transparent)}
.sm-rej{position:relative;display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));column-gap:6px}
.sm-h{position:absolute;left:0;right:0;height:0;pointer-events:none}
.sm-h b{position:absolute;left:0;width:46px;top:-8px;text-align:right;font:600 12px var(--f-sans);color:var(--t3);font-variant-numeric:tabular-nums}
.sm-h::after{content:"";position:absolute;left:58px;right:0;top:-3px;height:6px;background:radial-gradient(circle,var(--punto) 1.1px,transparent 1.6px) 0 50%/9px 6px repeat-x}
.sm-col{position:relative;grid-row:1;border-radius:12px}
.sm-col.fin{background:color-mix(in srgb,var(--kraft) 22%,transparent)}
.sm-col.hoy{background:color-mix(in srgb,var(--tinte) 6%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tinte) 14%,transparent)}
.sm-col.pas .ag-b{opacity:.78}
.sm-b{padding:6px 8px 0 11px;gap:6px;border-radius:10px}
.sm-b .ag-tit{font-size:13px}
.sm-b .ag-meta{font-size:11.5px;gap:4px}
.sm-b .ag-check{width:16px;height:16px}
.sm-b .ag-check svg{width:9px;height:9px}
.sm-b.corto{padding-top:0}
.sm-b.corto .ag-meta{display:none}
.sm-b.venc::before{background:var(--venc)}
.sm-b.venc .ag-meta{color:var(--venc);font-weight:600}
.sm-ahora{position:absolute;left:-3px;right:-3px;height:2px;margin-top:-1px;border-radius:2px;background:var(--o500);z-index:3}
.sm-ahora::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--o500);box-shadow:0 0 0 3px var(--hoja)}
.sm-ahora-t{position:absolute;left:0;width:46px;margin-top:-8px;text-align:right;font:700 12px var(--f-sans);color:var(--o600);z-index:3;background:var(--hoja);font-variant-numeric:tabular-nums}
.sm-hueco{position:absolute;left:3px;right:3px;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--tinte) 45%,transparent);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:var(--o600);background:color-mix(in srgb,var(--tinte) 6%,transparent)}
@media (max-width:1100px){.sm-fila,.sm-rej{grid-template-columns:44px repeat(7,minmax(0,1fr));column-gap:4px}.sm-b .ag-meta{display:none}}
</style>

<div id="raiz"></div>
<script>

/* 26-nov: ?acento=… (claro, oscuro), como en la app */

const ACC_I=Math.max(0,['oliva','arcilla','terracota','miel','marea','vino'].indexOf(ACC));
if(OSC)document.documentElement.dataset.theme='dark';
/* ═══ Silueta del logo (src/img/logo-hormiga.svg), separada en piezas ═══ */
const P={
 ant1:'M4677 6971 c-226 -115 -446 -493 -447 -767 0 -71 16 -94 53 -77 18 8 31 35 56 111 18 55 53 137 79 183 62 111 203 254 321 324 100 59 124 87 124 146 0 85 -95 126 -186 80z',

 patas:'M3960 5022 c-83 -28 -216 -100 -301 -164 -176 -132 -319 -323 -461 -613 -140 -287 -150 -405 -34 -405 36 0 46 6 91 54 32 34 109 154 210 328 260 444 297 494 383 505 62 8 108 -19 157 -96 23 -36 90 -158 150 -271 199 -378 263 -478 333 -511 73 -36 141 -6 157 68 8 42 -21 161 -92 366 -107 314 -228 574 -305 663 -73 83 -180 112 -288 76z'
};
const T10='transform="translate(0,1024) scale(0.1,-0.1)"';
function hormiga(o={}){
  const {x,y,w,cls='',dobla=false}=o;
  const pos=w!=null?` x="${x}" y="${y}" width="${w}" height="${w}"`:'';
  return `<svg class="hormiga ${cls}"${pos} viewBox="200.4 293.4 378.8 378.8" overflow="visible" aria-hidden="true">`+
    `<g class="h-patas"><g ${T10}><path d="${P.patas}"/></g></g>`+
    `<g class="h-arriba">`+
      `<g class="h-antenas"><g ${T10}><path d="${P.ant1}"/>${dobla?'':`<path d="${P.ant2}"/>`}</g></g>`+
      (dobla?`<path class="antena-rota" d="M458 410 C 470 384, 484 366, 498 362 C 512 358, 520 372, 528 392"/>`:'')+
      `<g ${T10}><path d="${P.cabeza}"/><path d="${P.torax}"/><path d="${P.abdomen}"/></g>`+
    `</g></svg>`;
}

/* ═══ Utilidades ═══ */
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rng(20261120);
const ICOS={
 calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 sprout:'<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
 inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
 flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
 repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
 plus:'<path d="M5 12h14M12 5v14"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 chev:'<path d="m6 9 6 6 6-6"/>'
};
ICOS.moon='<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
const ico=(n,s=18)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICOS[n]}</svg>`;
const CHECK_D='M4.2 12.8c1.1.6 2.4 2 3.6 3.6.6.8 1.1 1.3 1.5 1.1.4-.2 1-1.2 1.8-2.6C13 11.2 16.2 6.9 20.6 4.4';
const CK=`<svg viewBox="0 0 24 24"><path d="${CHECK_D}"/></svg>`;
const j=()=>((R()-.5)*2.4).toFixed(2);
const tachonD=()=>`M1 ${5+ +j()} C 22 ${3.5+ +j()}, 42 ${6.5+ +j()}, 62 ${4.6+ +j()} S 90 ${5.8+ +j()}, 99 ${4.2+ +j()}`;
const tachon=()=>`<svg class="tachon" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="${tachonD()}" pathLength="100"/></svg>`;

const TX=document.documentElement.dataset.theme==='dark'?{m:'255,226,190',f1:'0,0,0',f2:'255,226,190'}:{m:'120,90,40',f1:'90,62,20',f2:'255,244,210'};
function texturas(){
  const tex=(w,h,seed,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,rng(seed),w,h);return `url(${c.toDataURL()})`;};
  const hoja=tex(260,260,7,(x,r,w,h)=>{
    for(let i=0;i<300;i++){x.fillStyle=`rgba(${TX.m},${(0.05+r()*0.11).toFixed(3)})`;x.beginPath();x.arc(r()*w,r()*h,0.4+r()*1.1,0,7);x.fill();}
    for(let i=0;i<46;i++){x.strokeStyle=`rgba(${TX.m},${(0.05+r()*0.07).toFixed(3)})`;x.lineWidth=0.7;const a=r()*w,b=r()*h,g=r()*6.28,l=3+r()*7;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(g)*l,b+Math.sin(g)*l);x.stroke();}
  });
  const kraft=tex(300,300,11,(x,r,w,h)=>{
    for(let i=0;i<1000;i++){x.strokeStyle=`rgba(${r()<.55?TX.f1:TX.f2},${(0.05+r()*0.1).toFixed(3)})`;x.lineWidth=0.5+r()*0.7;const a=r()*w,b=r()*h,g=r()*6.28,l=2+r()*10;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(g)*l,b+Math.sin(g)*l);x.stroke();}
    for(let i=0;i<320;i++){x.fillStyle=`rgba(${TX.f1},${(0.06+r()*0.12).toFixed(3)})`;x.beginPath();x.arc(r()*w,r()*h,0.3+r()*0.9,0,7);x.fill();}
  });
  document.documentElement.style.setProperty('--tex-hoja',hoja);
  document.documentElement.style.setProperty('--tex-kraft',kraft);
}

/* ═══ Datos ═══ */
const LISTAS={trabajo:['Trabajo','var(--l-trabajo)'],casa:['Casa','var(--l-casa)'],personal:['Personal','var(--l-personal)'],lect:['Lecturas','var(--l-lect)'],viajes:['Viajes','var(--l-viajes)']};
const VENC=[
  {t:'Renovar el seguro del coche',l:'casa',imp:1,f:'mié 12 nov'},
  {t:'Responder a la gestoría',l:'trabajo',f:'Ayer'}
];
const HOY=[
  {t:'Preparar la presentación del jueves',l:'trabajo',imp:1,sub:[2,5]},
  {t:'Enviar la factura de noviembre',l:'trabajo',rep:'1 mes',id:'demo'},
  {t:'Revisar el presupuesto de diciembre',l:'casa',link:1},
  {t:'Planificar el viaje a Lisboa',l:'viajes'},
  {t:'Pasear a Tango',l:'personal',rep:'1d',hecha:1},
  {t:'Regar las plantas',l:'casa',rep:'3d',hecha:1}
];

const estado=(location.hash.slice(1)||'hoy');
addEventListener('hashchange',()=>location.reload());

/* ═══ Barra lateral ═══ */
function anillo(d,t,c){
  const N=12,k=Math.round(N*d/t);let s='<svg class="anillo" viewBox="0 0 20 20">';
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;s+=`<circle cx="${(10+7*Math.cos(a)).toFixed(2)}" cy="${(10+7*Math.sin(a)).toFixed(2)}" r="1.4" style="fill:${i<k?c:'var(--punto-kraft)'}"/>`;}
  return s+'</svg>';
}
function lateral(act){
  const fin=estado==='fin';
  const nav=[['hoy','calendar','Hoy',fin?null:E.pend,'#hoy'],['habitos','sprout','Hábitos',fin?null:1,'#habitos'],['inbox','inbox','Inbox',17,'#inbox-listas'],['notas','nota','Notas',9,'#notas'],['actividad','history','Actividad',null,'#actividad']];
  const ls=[['Trabajo','var(--l-trabajo)',3,8],['Casa','var(--l-casa)',2,6],['Personal','var(--l-personal)',4,5],['Lecturas','var(--l-lect)',1,4],['Viajes','var(--l-viajes)',0,3],['Salud','var(--o500)',5,7]];
  return `<div class="marca"><span class="marca-ico">${hormiga()}</span><span class="marca-nombre">AnTrack</span><button class="plegar">${ico('panel')}</button></div>
  <div class="buscar">${ico('search')}<span>Buscar</span><kbd>Ctrl + K</kbd></div>
  <div class="grupo">Vistas</div>
  <nav class="nav">${nav.map(([id,ic,tx,n,h])=>`<a href="${h}" class="${id===act?'activa':''}">${ico(ic)}<span>${tx}</span>${n!=null?`<span class="n" ${id==='hoy'?'id="n-nav"':''}>${n}</span>`:''}</a>`).join('')}</nav>
  <div class="grupo">Listas</div>
  <nav class="nav listas">${ls.map(([n,c,d,t])=>`<a href="${n==='Trabajo'?'#lista':'#hoy'}" class="${n==='Trabajo'&&act==='lista'?'activa':''}">${anillo(d,t,c)}<span>${n}</span><span class="n">${d}/${t}</span></a>`).join('')}</nav>
  <div class="perfil"><span class="avatar">A</span><div><b>Tu cuenta</b><small><i></i>Sincronizado</small></div></div>`;
}

/* ═══ Cabecera: el rastro ═══ */
const TRAIL='M10 64 C 70 30, 128 82, 196 58 S 318 26, 360 54 S 388 70, 398 68';
const ESTRELLAS=[[40,10,1.6],[118,4,1.2],[172,20,1],[250,6,1.8],[300,10,1.1],[352,4,1.4],[412,14,1.2],[470,26,1]].map(([x,y,r],i)=>`<circle class="estrella" cx="${x}" cy="${y}" r="${r}" style="animation-delay:${(i*.45).toFixed(2)}s"/>`).join('');
const MIGAS=[[416,66,-20],[446,68,-10],[426,71,15],[454,63,30],[436,73,0],[410,72,10],[460,71,-25],[431,63,20]];
function rastroSVG(){
  return `<svg class="rastro-svg" viewBox="0 0 480 96">
  <defs><mask id="m-hecho" maskUnits="userSpaceOnUse" x="-20" y="-20" width="520" height="140"><path id="tr-mask" d="${TRAIL}" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/></mask></defs>
  ${ESTRELLAS}<path d="${TRAIL}" class="tr-fondo"/>
  <path d="${TRAIL}" class="tr-hecho" mask="url(#m-hecho)"/>
  <path id="tr-guia" d="${TRAIL}" fill="none"/>
  <path class="suelo" d="M384 76 H 478"/>
  <path class="monticulo" d="M396 76 C 410 44, 452 42, 472 76 Z"/>
  <ellipse class="entrada" cx="434" cy="55" rx="7.5" ry="4.2"/>
  <path class="hierba" d="M387 76 l-3 -8 M387 76 l1 -11 M387 76 l5 -7 M476 76 l-4 -7 M476 76 l1 -10 M476 76 l5 -8"/>
  ${MIGAS.map(([x,y,a])=>`<ellipse class="miga oculta" cx="${x}" cy="${y}" rx="3.6" ry="2" transform="rotate(${a} ${x} ${y})"/>`).join('')}
  <g id="tr-hor">${hormiga({x:-20,y:-37,w:40})}<ellipse class="miga-llevada" cx="8" cy="-34" rx="5.4" ry="3" transform="rotate(-25 8 -34)"/></g>
  </svg>`;
}
let guia,mascara,horG,horSvg,pAct=0;
function ponerProgreso(p){
  const L=guia.getTotalLength();
  mascara.style.strokeDasharray=`${L} ${L}`;mascara.style.strokeDashoffset=L*(1-p);
  const a=guia.getPointAtLength(p*L),b=guia.getPointAtLength(Math.min(L,p*L+2)),c=guia.getPointAtLength(Math.max(0,p*L-2));
  const ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI;
  horG.setAttribute('transform',`translate(${a.x.toFixed(2)} ${a.y.toFixed(2)}) rotate(${ang.toFixed(1)})`);
  pAct=p;
}
function avanzar(p1){
  const p0=pAct,t0=performance.now(),D=1200;horSvg.classList.add('anda');
  (function paso(t){const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;ponerProgreso(p0+(p1-p0)*e);if(k<1)requestAnimationFrame(paso);else horSvg.classList.remove('anda');})(t0);
}
function migas(n){document.querySelectorAll('.rastro-svg .miga').forEach((m,i)=>m.classList.toggle('oculta',i>=n));}
function pie(){
  const pe=document.getElementById('pie');if(!pe)return;
  pe.innerHTML=E.done===E.total
    ?`<b>${E.done} de ${E.total}</b> · todo en el hormiguero`
    :`<b>${E.done} de ${E.total}</b> en el hormiguero${E.venc?` · <span class="venc">${E.venc} vencidas</span>`:''}`;
  const n=document.getElementById('n-nav');if(n)n.textContent=E.pend;
  const m=document.getElementById('mes');if(m)m.textContent=E.pend?`de noviembre · ${E.pend} sin hacer`:'de noviembre · nada pendiente';
}

/* ═══ Filas ═══ */
function anilloSub([d,t]){
  const N=10,k=Math.round(N*d/t);let s='<svg class="sub-anillo" viewBox="0 0 37 37">';
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;s+=`<circle cx="${(18.5+16*Math.cos(a)).toFixed(2)}" cy="${(18.5+16*Math.sin(a)).toFixed(2)}" r="1.5" style="fill:${i<k?'var(--o500)':'var(--punto)'}"/>`;}
  return s+'</svg>';
}
function fila(t){
  const [ln,lc]=LISTAS[t.l],m=[];
  if(t.imp)m.push(`<span class="bandera" title="Importante">${ico('flag',16)}</span>`);
  if(t.link)m.push(`<span>${ico('link',14)} 1</span>`);
  if(t.rep)m.push(`<span>${ico('repeat',15)} ${t.rep}</span>`);
  m.push(`<span class="lista" style="color:${lc}"><i></i><span>${ln}</span></span>`);
  if(t.f)m.push(`<span class="pastilla">${t.f} ${ico('arrow',13)}</span>`);
  return `<div class="fila${t.hecha?' hecha':''}"${t.id?` id="${t.id}"`:''}><div class="fila-in">
    <span class="check-wrap">${t.sub?anilloSub(t.sub):''}<button class="check" aria-label="Completar"><span class="chk-bg"></span>${CK.replace('<path','<path pathLength="21"')}</button></span>
    <span class="titulo"><span class="texto">${t.t}</span>${tachon()}</span>
    <span class="meta">${m.join('')}</span></div></div>`;
}
function hormigas(n,max=7){
  let s='';for(let i=0;i<n;i++)s+=`<span class="r-hor" style="--d:${(-R()*2.8).toFixed(2)}s">${hormiga()}</span>`;
  for(let i=n;i<max;i++)s+='<span class="faltan"></span>';
  return s;
}
function habito(h){
  return `<div class="fila habito${h.hecha?' hecha':''}" data-r="${h.r}"><div class="fila-in">
    <span class="check-wrap"><button class="check" aria-label="Cumplir"><span class="chk-bg"></span>${CK.replace('<path','<path pathLength="21"')}</button></span>
    <span class="titulo"><span class="texto">${h.t}</span></span>
    <span class="racha" title="Racha de ${h.r} días"><span class="racha-hor">${hormigas(h.r)}</span><span class="racha-n">${h.r} días</span></span></div></div>`;
}
function habitos(lista,hechos){

  const x0=tx.left-cb.left-29,y0=rowTop+(rowH-ch)/2;
  const cx=x=>x+W*0.62-cw/2,cyTop=antY+W*0.17-ch;
  const T=3200,anims=[];
  const A=(el,fr)=>{const a=el.animate(fr.map(([ms,p,e])=>({...p,offset:ms/T,easing:e||'ease'})),{duration:T,fill:'both'});anims.push(a);return a;};

  A(f.querySelector('.check svg'),[[0,{strokeDashoffset:21}],[180,{strokeDashoffset:21},'ease-out'],[480,{strokeDashoffset:0}],[T,{strokeDashoffset:0}]]);

  A(f.querySelector('.tachon'),[[0,{clipPath:'inset(-4px 100% -4px -4px)'}],[300,{clipPath:'inset(-4px 100% -4px -4px)'},'ease-in-out'],[780,{clipPath:'inset(-4px -4px -4px -4px)'}],[T,{clipPath:'inset(-4px -4px -4px -4px)'}]]);
  A(f.querySelector('.texto'),[[0,{color:C1}],[300,{color:C1}],[720,{color:C3}],[T,{color:C3}]]);
  A(f.querySelector('.fila-in'),[[0,{opacity:1}],[1500,{opacity:1}],[1650,{opacity:0}],[T,{opacity:0}]]);
  A(f,[[0,{height:rowH+'px'}],[2650,{height:rowH+'px'},'ease-in-out'],[3050,{height:'0px'}],[T,{height:'0px'}]]);
  A(pos,[[0,{transform:tr(xStart,antY)}],[700,{transform:tr(xStart,antY)},'cubic-bezier(.25,.6,.4,1)'],[1450,{transform:tr(xMeet,antY)}],[1950,{transform:tr(xMeet,antY)},salir],[T,{transform:tr(xEnd,antY)}]]);
  A(dir,[[0,{transform:'scaleX(-1)'}],[1780,{transform:'scaleX(-1)'}],[1900,{transform:'scaleX(1)'}],[T,{transform:'scaleX(1)'}]]);
  A(carga,[[0,{transform:tr(x0,y0),opacity:0}],[1480,{transform:tr(x0,y0),opacity:0},'linear'],[1500,{transform:tr(x0,y0),opacity:1},'cubic-bezier(.3,.7,.4,1)'],[1880,{transform:tr(cx(xMeet),cyTop,-5),opacity:1}],[1950,{transform:tr(cx(xMeet),cyTop,-5),opacity:1},salir],[T,{transform:tr(cx(xEnd),cyTop,-5),opacity:1}]]);

  });
}

  return s+'</g>';
}
function nido(){
  const o=ND,{W,H,G,X}=o,r=rng(42),f=v=>v.toFixed(1);
  const sx=muestreo(o.shaft);
  const sem=[{e:'16–22 nov',n:9,actual:1},{e:'9–15 nov',n:21},{e:'2–8 nov',n:15},{e:'26 oct – 1 nov',n:23},{e:'19–25 oct',n:9},{e:'12–18 oct',n:18},{e:'5–11 oct',n:12}];
  const cols=['var(--l-trabajo)','var(--l-casa)','var(--l-personal)','var(--l-lect)','var(--l-viajes)','var(--o500)'];
  const maxN=Math.max(...sem.filter(x=>!x.actual).map(x=>x.n));sem.forEach(x=>{if(!x.actual&&x.n===maxN)x.mejor=1;});
  const cams=sem.map((s,i)=>{const dir=i%2===0?1:-1,cy=o.ys[i],x0=sx(cy),[rx,ry]=o.radio(s.n),cx=Math.round(x0+dir*o.dist(s.n,r));
    return {...s,dir,cx,cy,rx,ry,tun:`M${f(x0)} ${cy-6} C ${f(x0+dir*o.tc)} ${cy-8}, ${f(cx-dir*(rx+o.tc))} ${cy+12}, ${f(cx-dir*rx*.75)} ${cy+2}`};});
  // Zonas ocupadas, para que matas y piedras de bajo tierra no asomen a medias.
  const libre=(x,y,m)=>Math.abs(x-sx(y))>o.tunel[0]+m&&cams.every(c=>Math.abs(x-c.cx)>c.rx+m+(o.etq==='lado'?(c.dir*(x-c.cx)>0?o.etqAncho:0):0)||Math.abs(y-c.cy)>c.ry+m+(o.etq==='arriba'?o.etqH+o.sep:0));
  let s=`<svg class="nido nd" viewBox="0 0 ${W} ${H}" data-w="${W}" data-pad="${o.pad}" style="--nd-f1:${o.f1};--nd-f2:${o.f2};--nd-rayo:${o.rayo}px" role="img" aria-label="Tu hormiguero: cada cámara es una semana">`;
  s+=`<defs><radialGradient id="nd-luz" cx="50%" cy="66%" r="66%"><stop offset="0" stop-color="#9c784b"/><stop offset="1" stop-color="#54412f"/></radialGradient><clipPath id="nd-ct"><rect x="0" y="${G}" width="${W}" height="${H-G}" rx="${o.marco}"/></clipPath></defs>`;
  // Cielo: nubes de día y estrellas de noche.
  o.nubes.forEach(([x,y,k])=>{s+=nd_nube(x,y,k);});
  for(let i=0;i<16;i++)s+=`<circle class="estrella" cx="${(r()*W).toFixed(0)}" cy="${(4+r()*(G*.6)).toFixed(0)}" r="${(o.estrella*(.7+r()*.8)).toFixed(1)}" style="animation-delay:${(i*.37).toFixed(2)}s"/>`;
  // Tierra: arena, vetas onduladas, granos, y piedras y matas enterradas.
  const T=H-G;
  s+=`<g clip-path="url(#nd-ct)"><rect class="nd-arena" x="0" y="${G}" width="${W}" height="${T}"/>`;
  for(let k=0;k<4;k++){const y=G+T*(.14+k*.23),a=T*.022+r()*T*.015,h=T*.07+r()*T*.035;
    s+=`<path class="nd-banda" d="M0 ${f(y)} C ${f(W*.19)} ${f(y-a)}, ${f(W*.37)} ${f(y+a)}, ${f(W*.56)} ${f(y)} S ${f(W*.83)} ${f(y-a)}, ${W} ${f(y+a*.5)} L${W} ${f(y+h)} C ${f(W*.81)} ${f(y+h-a)}, ${f(W*.65)} ${f(y+h+a)}, ${f(W*.46)} ${f(y+h)} S ${f(W*.15)} ${f(y+h-a)}, 0 ${f(y+h+a*.4)} Z"/>`;}
  for(let i=0;i<o.granos;i++){const x=r()*W,y=G+6+r()*(T-6),rx=(.9+r()*1.8)*o.k;s+=`<ellipse class="nd-grano" cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(rx*.65)}" transform="rotate(${(r()*60-30).toFixed(0)} ${f(x)} ${f(y)})"/>`;}
  for(let i=0,hechas=0;i<80&&hechas<o.bajo[0];i++){const x=12+r()*(W-24),y=G+24+r()*(T-40);if(!libre(x,y,14*o.k))continue;hechas++;const rx=(7+r()*6)*o.k;s+=nd_piedra(x,y,rx,rx*.62);}
  for(let i=0,hechas=0;i<120&&hechas<o.bajo[1];i++){const x=12+r()*(W-24),y=G+34+r()*(T-50);if(!libre(x,y,22*o.k))continue;hechas++;s+=nd_mata(x,y,(.7+r()*.4)*o.k,r);}
  // Túneles y cámaras: primero los bordes (y los anillos), luego el hueco,
  // para que cada túnel entre en su cámara sin pared por medio.
  s+=`<path class="nd-t-borde" d="${o.shaft}" style="stroke-width:${o.tunel[0]}"/>`;
  cams.forEach(c=>{s+=`<path class="nd-t-borde" d="${c.tun}" style="stroke-width:${o.tunel[0]}"/><ellipse class="nd-c-anillo" cx="${c.cx}" cy="${c.cy}" rx="${f(c.rx+o.anillo)}" ry="${f(c.ry+o.anillo)}"/>`;});
  s+=`<path class="nd-t-hueco" d="${o.shaft}" style="stroke-width:${o.tunel[1]}"/>`;
  cams.forEach(c=>{s+=`<path class="nd-t-hueco" d="${c.tun}" style="stroke-width:${o.tunel[1]}"/>`;});
  cams.forEach(c=>{s+=nd_camara(c,r,cols,o);});
  s+=enRuta(o.shaft,22,'-3s',false,o.hormiga);
  s+=enRuta(cams[2].tun,9,'-2s',cams[2].dir<0,o.hormiga*.9);
  s+='</g>';
  // Superficie: el borde del suelo, el montículo, piedras, plantas y matas.
  s+=`<path class="nd-borde-suelo" d="M0 ${G} H${W}"/>`;
  s+=nd_monticulo(X,G,o.mont[0],o.mont[1],r);
  o.piedras.forEach(([x,rx,ry])=>{s+=nd_piedra(x,G-ry*.55,rx,ry);});
  o.plantas.forEach(([x,k])=>{s+=nd_planta(x,G+1,k);});
  const ocup=[[X-o.mont[0]/2-8,X+o.mont[0]/2+8],...o.piedras.map(([x,rx])=>[x-rx-3,x+rx+3]),...o.plantas.map(([x,k])=>[x-10*k,x+10*k])];
  for(let i=0,hechas=0;i<200&&hechas<o.matas;i++){const x=8+r()*(W-16);if(ocup.some(([a,b])=>x>a&&x<b))continue;hechas++;ocup.push([x-6*o.k,x+6*o.k]);s+=nd_mata(x,G+1,(.85+r()*.6)*o.k,r);}
  // Una hormiga que llega a la puerta con su semilla.
  s+=enRuta(`M${f(W*.03)} ${G-1} C ${f(W*.15)} ${G-2}, ${f(W*.27)} ${G+1}, ${f(X-o.mont[0]*.12)} ${G-1}`,15,'-5s',false,o.hormiga,true,true);
  return s+'</svg>';
}
function nd_ajustarEtiquetas(){
  document.querySelectorAll('svg.nd').forEach(svg=>{
    const W=+svg.dataset.w,pad=+svg.dataset.pad;
    svg.querySelectorAll('.nd-etq').forEach(g=>{
      const tx=[...g.querySelectorAll('text')],rect=g.querySelector('rect');
      const w=Math.max(...tx.map(t=>t.getBBox().width))+pad*2,lado=+g.dataset.lado,ax=+g.dataset.ax;
      let x=lado>0?ax:lado<0?ax-w:ax-w/2;x=Math.max(4,Math.min(W-4-w,x));
      rect.setAttribute('x',x.toFixed(1));rect.setAttribute('width',w.toFixed(1));
      tx.forEach(t=>t.setAttribute('x',(x+w/2).toFixed(1)));
    });
  });
}

function filaInbox(t){
  const m=[];
  if(t.imp)m.push(`<span class="bandera">${ico('flag',16)}</span>`);
  if(t.sub)m.push(`<span>${t.sub[0]}/${t.sub[1]} subtareas</span>`);
  if(t.link)m.push(`<span>${ico('link',14)} 1</span>`);
  if(t.rep)m.push(`<span>${ico('repeat',15)} ${t.rep}</span>`);
  if(t.venc)m.push(`<span class="pastilla">${t.venc} ${ico('arrow',13)}</span>`);
  if(t.f)m.push(`<span class="pastilla-n${t.hoy?' hoy':''}">${t.f}</span>`);
  const sel=t.id==='elegida'&&estado==='detalle';
  return `<div class="fila inb-fila${sel?' elegida':''}"><div class="fila-in">
    <span class="check-wrap">${t.sub?anilloSub(t.sub):''}<button class="check" aria-label="Completar">${CKB}</button></span>
    <span class="titulo"><span class="texto">${t.t}</span>${tachon()}</span><span class="meta">${m.join('')}</span></div></div>`;
}

  const dia=e.target.closest('#sem-mini [data-n]');
  if(dia){const n=+dia.dataset.n,hoy=n===20,DN=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

/* ═══ 26-nov: la senda de progreso desemboca en la puerta del hormiguero ═══
   El mismo componente en index.html, movil.html y progreso.html. Antes el
   camino se quedaba a un lado del montículo y la puerta asomaba aparte;
   ahora el montículo cierra el camino: la senda pasa por delante y acaba en
   la puerta, de frente y en la base. Todo con el dibujo del hormiguero de
