  for(let row=0;q<n;row++){const cnt=Math.min(base-row,n-q),y=floor-row*SH,x0=cx+ox-(cnt-1)*SW/2;cima=y;
    for(let j=0;j<cnt;j++,q++){const x=x0+j*SW+(r()-.5)*1.2,a=((r()-.5)*14).toFixed(0);
      s+=`<g class="nd-semilla" transform="translate(${f(x)} ${f(y)}) rotate(${a})"><ellipse rx="${f(srx)}" ry="${f(sry)}" style="fill:${cols[q]}"/><ellipse class="nd-brillo" cx="${f(-srx*.3)}" cy="${f(-sry*.38)}" rx="${f(srx*.36)}" ry="${f(sry*.28)}"/></g>`;}}
  if(d.mejor){const mx=cx+ox,my=cima-sry-1,b=16*k;
    s+=`<path class="nd-mastil" d="M${f(mx)} ${f(my)} V ${f(my-b)}"/><path class="nd-bandera" d="M${f(mx+1)} ${f(my-b)} q ${f(b*.35)} ${f(b*.08)} ${f(b*.62)} ${f(b*.2)} q ${f(-b*.27)} ${f(b*.12)} ${f(-b*.62)} ${f(b*.2)} Z"/>`;}
  // La semana en curso lleva su brote, como en el hormiguero; la hormiga, al lado de la pila.
  const hw=38*k;
  if(d.s.actual)s+=nd_planta(cx+rx*.62,floor+sry,.95*k)+hormiga({x:f(cx-rx*.66-hw*.3),y:f(floor+sry-hw*.86),w:f(hw)});
  else s+=hormiga({x:f(cx+ox+(base-1)*SW/2+srx+2*k),y:f(floor+sry-hw*.86),w:f(hw)});
  return s+'</g></svg>';
}

  // dos a la vez: se montan una sobre otra (la segunda, desplazada), para que las dos se lean
  const horiz=cols===1?`left:2px;width:calc(100% - 4px)`:col===0?`left:2px;width:calc(70% - 4px)`:`left:32%;width:calc(68% - 2px);z-index:2;box-shadow:-3px 0 0 var(--hoja)`;
  const pos=`top:${top.toFixed(1)}px;height:${alto.toFixed(1)}px;${horiz}`;
  const corto=dur<0.8?' corto':'',hora=`${hm(it.a)}–${hm(it.b)}`;
  if(it.tipo==='ev'){const [cn,cc]=CALS[it.cal];return `<div class="ag-b ag-ev sm-b${corto}" style="${pos};--c:${cc}" title="${it.t} · ${hora} · ${cn}"><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${ico('calendar',11)} ${hora}</span></div></div>`;}
  const lc=LISTAS[it.l][1];
  return `<div class="ag-b ag-tarea sm-b${corto}${it.hecha?' hecha':''}${it.venc?' venc':''}" style="${pos};--c:${lc}" title="${it.t} · ${hora}"><span class="ag-check" role="button" aria-label="Completar">${CK}</span><div class="ag-tx"><span class="ag-tit">${it.t}</span><span class="ag-meta">${it.venc?'vencida · ':''}${hora}</span></div></div>`;
}
function semanaAgHTML(){
  const D=[['lun',16],['mar',17],['mié',18],['jue',19],['vie',20],['sáb',21],['dom',22]],HOY=4;
  const tareas=SEMANA_H.flat().filter(x=>x.tipo==='tarea'),hechas=tareas.filter(x=>x.hecha).length,evs=SEMANA_H.flat().filter(x=>x.tipo==='ev').length;
  const cab=D.map(([l,n],i)=>{const ts=SEMANA_H[i].filter(x=>x.tipo==='tarea');
    const sem=ts.map(x=>`<i class="${x.hecha?'':'f'}" style="--c:${LISTAS[x.l][1]}"></i>`).join('');
    return `<a class="sm-dia${i<HOY?' pas':''}${i===HOY?' hoy':''}" href="#agenda" title="Ver el ${l} ${n} por horas"><small>${l}</small><b>${n}</b><span class="sm-sem">${sem}</span></a>`;}).join('');
  const todo=SM_TODO.map(c=>`<div class="sm-c">${c.map(([k,t,x])=>k==='ev'?`<span class="sm-chip ev" style="--c:${CALS[x][1]}">${ico('calendar',11)}<span>${t}</span></span>`:k==='venc'?`<span class="sm-chip venc">${ico('flag',11)}<span>${t}</span></span>`:`<span class="sm-chip sh" style="--c:${LISTAS[x][1]}" title="Sin hora: arrástrala a un hueco"><i></i><span>${t}</span></span>`).join('')}</div>`).join('');
  const habs=SM_HAB.map(([h,t],i)=>`<div class="sm-hab">${i>HOY?'':Array.from({length:t},(_,k)=>k<h?hormiga():hormiga({cls:'no'})).join('')}${i===HOY?`<small>${h}/${t}</small>`:''}</div>`).join('');
  let rej=`<div class="sm-rej" style="height:${(SM_FIN-SM_INI)*SM_PX}px">`;
  for(let h=SM_INI+1;h<SM_FIN;h++)rej+=`<div class="sm-h" style="top:${(h-SM_INI)*SM_PX}px"><b>${h}:00</b></div>`;
  rej+='<div style="grid-column:1;grid-row:1"></div>';
  D.forEach((d,i)=>{rej+=`<div class="sm-col${i<HOY?' pas':''}${i===HOY?' hoy':''}${i>4?' fin':''}" style="grid-column:${i+2}">${SEMANA_H[i].map(smBloque).join('')}`;
    if(i===HOY){const y=((AG_AHORA-SM_INI)*SM_PX).toFixed(1);rej+=`<div class="sm-ahora" style="top:${y}px"></div>`;}
    if(i===5)rej+=`<div class="sm-hueco" style="top:${(17-SM_INI)*SM_PX+1}px;height:${SM_PX*1.5-3}px">${ico('plus',13)} Suelta aquí</div>`;
    rej+='</div>';});
  rej+=`<div class="sm-ahora-t" style="top:${((AG_AHORA-SM_INI)*SM_PX).toFixed(1)}px">${hm(AG_AHORA)}</div></div>`;
  return `<header class="cabeza cabeza--pag"><div><div class="eyebrow">Calendario · semana 47</div><h1 class="act-tit">16 – 22 <span style="color:var(--t3);font-weight:600">nov</span></h1><div class="pag-sub">${tareas.length} tareas con hora · ${hechas} hechas · <span class="venc">1 vencida</span> · ${evs} eventos</div></div><div></div>
    <div class="herr"><button class="tema-btn" aria-label="Cambiar tema">${ico(OSC?'moon':'sun')}</button><button>${ico('sliders')}</button></div></header>
  <nav class="pestanas"><a class="pestana" href="#hoy">${ico('list',16)} Lista</a><a class="pestana" href="#agenda">${ico('reloj',16)} Día</a><button class="pestana on">${ico('calendar',16)} Semana</button><a class="pestana" href="#mes">${ico('calendar',16)} Mes</a>
    <div class="pest-dcha"><button aria-label="Semana anterior">${ico('izquierda',18)}</button><span>16 – 22 nov</span><button aria-label="Semana siguiente">${ico('derecha',18)}</button><button class="boton-hoy">Hoy</button></div></nav>
  <div class="cuerpo"><div class="sm">
    <div class="sm-fila"><span></span>${cab}</div>
    <div class="sm-fila sm-todo"><span class="sm-et">Todo<br>el día</span>${todo}</div>
    <div class="sm-fila sm-habs"><span class="sm-et">Hábitos</span>${habs}</div>
    <div class="sm-scroll" id="sm-scroll">${rej}</div>
  </div></div>
  ${captura('¿Qué cargamos? Prueba «el sábado a las 17»')}`;
}
/* ═══ Arranque ═══ */
texturas();
const raiz=document.getElementById('raiz');
if(estado==='vacios'){renderVacios();}
else{
  const NUEVAS={agenda:agendaHTML,notas:notasHTML,'inbox-listas':inboxHTML,detalle:inboxHTML,habitos:habitosPC,lista:listaPC,mes:mesPC,nota:notasHTML,'agenda-semana':semanaAgHTML};
  const esSem=/^semana(-\d)?$/.test(estado);
  const act=estado==='actividad'||esSem?'actividad':(estado==='notas'||estado==='nota')?'notas':estado==='habitos'?'habitos':estado==='lista'?'lista':(estado==='inbox-listas'||estado==='detalle')?'inbox':'hoy';
  document.body.classList.add(estado==='fin'?'e-fin':esSem?'e-semana':act==='actividad'?'e-actividad':NUEVAS[estado]?'e-'+estado:'e-hoy');
  const contenido=NUEVAS[estado]?NUEVAS[estado]():esSem?semanaHTML():act==='actividad'?actividadHTML():hoyHTML(estado);
  raiz.innerHTML=`<div class="app${estado==='detalle'||estado==='nota'?' con-detalle':''}"><aside class="lateral">${lateral(act)}</aside><div class="pila"><main class="hoja">${contenido}</main></div>${estado==='detalle'?detallePanel():estado==='nota'?notaPanel():''}</div>`;
  if(estado==='agenda-semana'){const sc=document.getElementById('sm-scroll');sc.scrollTop=(8-SM_INI)*SM_PX-6;}
  if(estado==='buscar')raiz.insertAdjacentHTML('beforeend',paletaHTML());
  if(estado==='ajustes')raiz.insertAdjacentHTML('beforeend',ajustesHTML());
  if(estado==='agenda'){
    guia=document.getElementById('tr-guia');mascara=document.getElementById('tr-mask');horG=document.getElementById('tr-hor');horSvg=horG.querySelector('.hormiga');
    ponerProgreso(E.done/E.total);migas(E.done);pie();

  if(act==='hoy'&&!NUEVAS[estado]){
    guia=document.getElementById('tr-guia');mascara=document.getElementById('tr-mask');horG=document.getElementById('tr-hor');horSvg=horG.querySelector('.hormiga');
    if(estado==='fin'){E.done=8;E.total=8;E.venc=0;E.pend=0;}
    ponerProgreso(E.done/E.total);migas(E.done);pie();
    const demo=document.getElementById('demo');
    const listo=fn=>addEventListener('load',()=>document.fonts.ready.then(()=>setTimeout(fn,350)));
    if(estado==='hoy')listo(()=>setTimeout(()=>llevarse(demo),900));
    if(estado==='hoy-congelado')listo(()=>llevarse(demo,{congelar:2380}));
  }
}
