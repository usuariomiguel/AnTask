<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnTrack · La hormiga (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#e7cf9b; --kraft-tinta:#5d4a26;
  --hoja:#fbf4df; --hoja-2:#eddfba; --card:#fffcf1;
  --t1:#2b2213; --t2:#6f5f3e; --t3:#94845f;
  --o300:#a5b17d; --o400:#8c986d; --o500:#6b734c; --o600:#5b6240; --o700:#4b5135; --o800:#3e432a;
  --venc:#8f5853; --venc-rgb:143,88,83;
  --borde:rgba(80,56,10,.17);
  --tierra:#e3c58f; --tierra-2:#d6b073; --tierra-borde:#b78c56; --hueco:#f8eed6; --tierra-osc:#5e4426;
  --l-trabajo:#c25e3a; --l-casa:#3d6e85; --l-personal:#56867c; --l-lect:#b58236; --l-viajes:#96323a;
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-sans:'Figtree',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-sans);color:var(--t1);background-color:var(--kraft);background-image:var(--tex-kraft);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ico{display:block;flex:none}

/* ── La hormiga (silueta del logo) ── */
.hormiga{display:block;fill:currentColor;color:var(--o500);overflow:visible}
.h-antenas{transform-box:fill-box;transform-origin:14% 100%;animation:antenas 2.8s ease-in-out infinite}
@keyframes antenas{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}55%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.anda .h-arriba{animation:bote .28s ease-in-out infinite alternate}
@keyframes bote{to{transform:translateY(-12px)}}
.anda .h-patas{transform-box:fill-box;transform-origin:50% 0;animation:pasos .28s ease-in-out infinite alternate}
@keyframes pasos{from{transform:skewX(-11deg)}to{transform:skewX(11deg)}}
.duerme .h-antenas{animation:antenas-duerme 4.5s ease-in-out infinite}
@keyframes antenas-duerme{0%,100%{transform:rotate(26deg)}50%{transform:rotate(31deg)}}
.duerme .h-arriba{animation:respira 4.5s ease-in-out infinite}
@keyframes respira{50%{transform:translateY(-6px)}}
.cava .h-arriba{transform-box:fill-box;transform-origin:30% 90%;animation:cavar .45s ease-in-out infinite alternate}
@keyframes cavar{to{transform:rotate(9deg)}}
.antena-rota{fill:none;stroke:currentColor;stroke-width:15;stroke-linecap:round}

/* ── App ── */
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;padding:14px 18px 16px 0;column-gap:8px}
.lateral{display:flex;flex-direction:column;padding:8px 12px 6px 18px;min-height:0;position:relative}
.marca{display:flex;align-items:center;gap:10px;padding:6px 6px 16px}
.marca-ico{width:34px;height:34px;border-radius:10px;background:var(--hoja);display:grid;place-items:center;box-shadow:0 1px 2px rgba(80,55,10,.18),0 0 0 1px rgba(80,55,10,.06)}
.marca-ico .hormiga{width:26px;height:26px}
.marca-nombre{font:700 22px/1 var(--f-disp);letter-spacing:-.025em}
.marca .plegar{margin-left:auto;color:var(--kraft-tinta);opacity:.75}
.buscar{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--kraft-tinta);font-size:15px;margin-bottom:4px}
.buscar kbd{margin-left:auto;font:500 11px var(--f-mono);padding:4px 9px;border:1px solid rgba(93,74,38,.3);border-radius:999px}
.grupo{font:650 13.5px var(--f-disp);color:var(--kraft-tinta);opacity:.85;padding:16px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;font-size:15px;color:var(--t1)}
.nav a:hover{background:rgba(255,250,235,.35)}
.nav a .ico{color:var(--kraft-tinta)}
.nav a .n{margin-left:auto;font-size:13px;color:var(--kraft-tinta);font-variant-numeric:tabular-nums}
.nav a.activa{background-color:var(--hoja);background-image:var(--tex-hoja);font-weight:650;color:var(--o800);margin-right:-36px;padding-right:46px;border-radius:13px 0 0 13px;box-shadow:0 1px 2px rgba(80,55,10,.16),0 8px 16px -10px rgba(80,55,10,.4)}
.nav a.activa .ico{color:var(--o500)}
.nav a.activa .n{background:var(--o500);color:var(--hoja);font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.listas a{font-size:14.5px}
.anillo{width:19px;height:19px;flex:none}
.perfil{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--o300);display:grid;place-items:center;color:var(--o800);font:700 15px var(--f-disp)}
.perfil b{display:block;font-size:14px;font-weight:600}
.perfil small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--kraft-tinta)}
.perfil small i{width:7px;height:7px;border-radius:50%;background:var(--l-personal)}

/* ── La hoja (con otra debajo, como un taco) ── */
.pila{position:relative;min-height:0;display:flex}
.pila::before{content:"";position:absolute;inset:10px -5px -7px 8px;border-radius:26px;background:var(--hoja-2);box-shadow:0 1px 2px rgba(80,55,10,.16);transform:rotate(.5deg)}
.hoja{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border-radius:26px;background-color:var(--hoja);background-image:var(--tex-hoja);box-shadow:0 0 0 1px rgba(80,55,10,.07),0 2px 3px rgba(80,55,10,.08),0 24px 50px -24px rgba(80,55,10,.42);overflow:hidden}
.hoja::after{content:"";position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(rgba(251,244,223,0),rgba(251,244,223,.94) 62%);pointer-events:none;z-index:4}
.e-actividad .hoja::after{display:none}

/* Cabecera */
.cabeza{display:grid;grid-template-columns:auto 1fr auto;align-items:end;column-gap:30px;padding:30px 26px 4px 52px}
.fecha{display:flex;align-items:flex-end;gap:16px}
.dia{font:700 92px/.78 var(--f-disp);font-variation-settings:"opsz" 96;letter-spacing:-.055em;color:var(--o800)}
.eyebrow{display:flex;align-items:center;gap:7px;font:650 14px var(--f-disp);color:var(--o500);margin-bottom:4px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dsem{font:650 31px/1 var(--f-disp);letter-spacing:-.025em}
.mes{font-size:14.5px;color:var(--t2);margin-top:6px}
.rastro{justify-self:end;width:min(480px,100%)}
.rastro-svg{display:block;width:100%;height:auto;overflow:visible}
.rastro-pie{font-size:14px;color:var(--t2);padding-left:4px;margin-top:-2px}
.rastro-pie b{color:var(--t1);font-weight:650}
.rastro-pie .venc{color:var(--venc);font-weight:600}
.herr{display:flex;gap:2px;align-self:start;color:var(--t2)}
.herr button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.herr button:hover{background:rgba(107,115,76,.1)}
.tr-fondo{fill:none;stroke:rgba(111,95,62,.3);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:0 9}
.tr-hecho{fill:none;stroke:var(--o500);stroke-width:4.6;stroke-linecap:round;stroke-dasharray:0 9}
.suelo{fill:none;stroke:var(--tierra-borde);stroke-width:2.4;stroke-linecap:round}
.monticulo{fill:var(--tierra-2)}
.entrada{fill:var(--tierra-osc)}
.hierba{fill:none;stroke:var(--o500);stroke-width:2;stroke-linecap:round}
.miga,.miga-llevada{fill:var(--o300)}
.miga{transition:opacity .5s}
.miga.oculta{opacity:0}
.e-fin #tr-hor .miga-llevada{display:none}

.pestanas{display:flex;align-items:center;gap:2px;padding:16px 30px 2px 44px}
.pestana{font-weight:500;font-size:14.5px;color:var(--t2);padding:8px 15px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.pestana:hover{color:var(--t1)}
.pestana.on{background:var(--o500);color:var(--hoja);font-weight:600;box-shadow:0 3px 8px -3px rgba(62,67,42,.55)}

/* Lista */
.cuerpo{position:relative;flex:1;min-height:0;overflow:hidden;padding:2px 40px 0 40px}
.capa{position:absolute;inset:0;pointer-events:none;z-index:5}
.seccion{margin-top:8px}
.sec-cab{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 10px}
.sec-tit{font:650 17px var(--f-disp);letter-spacing:-.01em}
.sec-n{font-size:12.5px;font-weight:600;color:var(--t2);border:1px solid var(--borde);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.puntos{flex:1;height:6px;background:radial-gradient(circle,rgba(111,95,62,.34) 1.25px,transparent 1.7px) 0 50%/9px 6px repeat-x}
.sec--venc .sec-tit{color:var(--venc)}
.sec--venc .sec-n{color:var(--venc);border-color:rgba(var(--venc-rgb),.3)}
.accion{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc)}
.accion--suave{border-color:var(--borde);background:transparent;color:var(--t2)}

.fila{position:relative;height:44px;border-radius:14px;overflow:hidden}
.fila:hover{background:rgba(107,115,76,.07)}
.fila-in{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;column-gap:8px;height:44px;padding:0 12px 0 10px}
.check-wrap{position:relative;width:23px;height:23px;display:grid;place-items:center}
.check{position:relative;width:23px;height:23px;border-radius:50%;border:1.8px solid rgba(80,56,10,.42);display:grid;place-items:center}
.check:hover{border-color:var(--o500)}
.chk-bg{position:absolute;inset:-2px;border-radius:50%;background:var(--o500);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.check svg{position:relative;width:15px;height:15px;fill:none;stroke:var(--hoja);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:21;stroke-dashoffset:21;transition:stroke-dashoffset .3s .12s ease-out}
.fila.hecha .chk-bg{transform:scale(1)}
.fila.hecha .check svg{stroke-dashoffset:0}
.fila.hecha .check{border-color:transparent}
.sub-anillo{position:absolute;left:50%;top:50%;width:37px;height:37px;margin:-18.5px 0 0 -18.5px;pointer-events:none}
.titulo{position:relative;justify-self:start;max-width:100%;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tachon{position:absolute;left:-3px;width:calc(100% + 6px);top:50%;height:10px;margin-top:-4px;overflow:visible;pointer-events:none;clip-path:inset(-4px 100% -4px -4px)}
.tachon path{fill:none;stroke:var(--t2);stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fila.hecha .tachon,.mt .tachon{clip-path:inset(-4px -4px -4px -4px)}
.fila.hecha .texto{color:var(--t3)}
.meta{display:flex;align-items:center;gap:16px;font-size:13.5px;color:var(--t2);white-space:nowrap}
.meta>span{display:inline-flex;align-items:center;gap:5px}
.bandera{color:var(--l-trabajo)}
.lista i{width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:2px}
.lista span{color:var(--t2)}
.pastilla{gap:6px!important;padding:4px 11px;border-radius:999px;border:1px solid rgba(var(--venc-rgb),.32);background:rgba(var(--venc-rgb),.07);color:var(--venc);font-weight:600;font-size:13px}
.fila.hecha .meta{opacity:.7}
.habito.hecha .texto{color:var(--t1)}
.racha{display:inline-flex;align-items:center;gap:1px;color:var(--o500)}
.r-hor{display:inline-block;width:22px;height:22px}
.r-hor:nth-child(even){transform:translateY(-2px)}
.r-hor .hormiga{width:100%;height:100%}
.r-hor .h-antenas{animation-delay:var(--d)}
.r-hor.nueva{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.faltan{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(111,95,62,.25);margin:0 6.5px}
.racha-n{margin-left:10px;font-size:13.5px;color:var(--t2);min-width:44px}

/* La hormiga que se lleva la tarea */
.hor-pos{position:absolute;left:0;top:0;width:38px;height:38px}
.hor-dir{width:100%;height:100%}
.hor-dir .hormiga{width:100%;height:100%}
.carga{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;background:var(--card);border:1px solid var(--borde);box-shadow:0 8px 16px -8px rgba(80,55,10,.5),0 1px 2px rgba(80,55,10,.12);font-size:13px;color:var(--t3);white-space:nowrap;max-width:210px}
.mini-check{width:17px;height:17px;border-radius:50%;background:var(--o500);display:grid;place-items:center;flex:none}
.mini-check svg{width:11px;height:11px;fill:none;stroke:var(--hoja);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.carga .tx{overflow:hidden;text-overflow:ellipsis;text-decoration:line-through;text-decoration-color:rgba(111,95,62,.7);text-decoration-thickness:1.5px}
.huellas{position:absolute;height:7px;background:radial-gradient(circle at 2px 1.6px,rgba(107,115,76,.6) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x,radial-gradient(circle at 7.5px 5.2px,rgba(107,115,76,.6) 1.2px,transparent 1.7px) 0 0/11px 7px repeat-x}

/* Captura */
.captura{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(600px,64%);height:54px;display:flex;align-items:center;gap:12px;padding:0 9px;border-radius:999px;background:var(--card);border:1px solid var(--borde);box-shadow:0 14px 30px -14px rgba(80,55,10,.5),0 1px 2px rgba(80,55,10,.1);z-index:6}
.cap-hor{position:absolute;left:58px;top:-28px;width:31px;height:31px}
.cap-hor .hormiga{width:100%;height:100%}
.cap-mas{width:36px;height:36px;border-radius:50%;background:var(--o500);color:var(--hoja);display:grid;place-items:center;flex:none}
.cap-ph{color:var(--t2);font-size:15.5px}
.captura kbd{margin-left:auto;font:500 11px var(--f-mono);color:var(--t2);padding:6px 11px;border:1px solid var(--borde);border-radius:999px;background:rgba(243,232,201,.5)}
.e-actividad .captura{display:none}

/* Día terminado */
.vacio-hoy{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 6px}
.vacio-hoy>svg{width:400px;height:auto;display:block}
.vacio-hoy h2{font:700 34px/1.05 var(--f-disp);letter-spacing:-.03em;margin-top:2px}
.vacio-hoy p{color:var(--t2);font-size:16px;margin-top:8px}
.vacio-acc{display:flex;gap:10px;margin-top:18px}
.btn-oliva{display:inline-flex;align-items:center;gap:8px;background:var(--o500);color:var(--hoja);font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 10px -4px rgba(62,67,42,.6)}
.btn-sec{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--borde);color:var(--t2);font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:999px}
.zzz{font:700 18px var(--f-disp);fill:var(--o500);animation:zzz 3.3s ease-in-out infinite;opacity:0}
.zzz:nth-of-type(2){animation-delay:1.1s}
.zzz:nth-of-type(3){animation-delay:2.2s}
@keyframes zzz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.9}100%{opacity:0;transform:translate(10px,-14px)}}
.hamaca{fill:var(--o400)}
.nervio{fill:none;stroke:var(--o300);stroke-width:2;stroke-linecap:round}
.tallo{fill:none;stroke:var(--o600);stroke-width:5;stroke-linecap:round}
.hojita{fill:var(--o500)}
.v-suelo{fill:none;stroke:rgba(111,95,62,.35);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:0 9}

/* Actividad: el hormiguero */
.cabeza--act{grid-template-columns:1fr auto auto;padding-bottom:2px}
.act-tit{font:700 46px/1 var(--f-disp);letter-spacing:-.04em;color:var(--o800);margin-top:2px}
.act-stats{display:flex;gap:34px;margin-bottom:4px}
.act-stats div{display:flex;flex-direction:column}
.act-stats b{font:700 30px/1 var(--f-disp);letter-spacing:-.03em}
.act-stats span{font-size:13px;color:var(--t2);margin-top:5px}
.cuerpo--act{padding:6px 40px 0}
.nido{display:block;width:100%;height:auto}
.tierra{fill:var(--tierra)}
.estrato{fill:#c99f62;opacity:.2}
.mota{fill:var(--tierra-borde)}
.guijarro{fill:var(--tierra-2);stroke:var(--tierra-borde);stroke-width:1.2}
.t-borde{fill:none;stroke:var(--tierra-borde);stroke-width:28;stroke-linecap:round}
.t-hueco{fill:none;stroke:var(--hueco);stroke-width:19;stroke-linecap:round}
.c-borde{fill:var(--tierra-borde)}
.c-borde-cav{fill:none;stroke:var(--tierra-borde);stroke-width:4;stroke-dasharray:5 7}
.c-sombra{fill:#ead6ab}
.c-hueco{fill:var(--hueco);transition:fill .2s}
.camara{cursor:pointer}
.camara:hover .c-hueco{fill:#fffaf0}
.camara:hover .etq-1{fill:var(--o600)}
.etq-1{font:650 14.5px var(--f-disp);fill:var(--t1)}
.etq-2{font:500 12.5px var(--f-sans);fill:var(--t2)}
.cavando .etq-1{fill:var(--o600)}
.tierra-salta{fill:var(--tierra-borde);animation:salta 1s ease-out infinite}
@keyframes salta{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.leyenda{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;color:var(--t2);font-size:14px;margin-top:8px;padding-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip i{width:13px;height:6.5px;border-radius:4px}

/* Tablero de estados vacíos */
.tablero{height:100vh;overflow:auto;padding:36px 56px 40px}
.tablero h1{font:700 36px/1.05 var(--f-disp);letter-spacing:-.03em;display:flex;align-items:center;gap:14px}
.tablero h1 .hormiga{width:46px;height:46px}
.tablero .sub{color:var(--kraft-tinta);font-size:16px;margin:8px 0 24px;max-width:760px;line-height:1.45}
.rejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tarjeta{position:relative;background-color:var(--hoja);background-image:var(--tex-hoja);border-radius:22px;padding:18px 22px 22px;box-shadow:0 0 0 1px rgba(80,55,10,.07),0 18px 36px -22px rgba(80,55,10,.45)}
.etq{font:650 13px var(--f-disp);color:var(--t3)}
.ilus{display:block;width:100%;height:auto;margin:6px 0 8px}
.tarjeta h3{font:700 21px/1.1 var(--f-disp);letter-spacing:-.02em}
.tarjeta p{color:var(--t2);font-size:14.5px;line-height:1.45;margin-top:6px}
.momentos-tit{font:700 22px var(--f-disp);letter-spacing:-.02em;margin:28px 0 14px}
.rejilla-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}
.story{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mini-caja{position:relative;height:104px;border-radius:14px;background:rgba(107,115,76,.07);overflow:hidden}
.mini-fila{position:absolute;left:14px;right:10px;top:40px;display:flex;align-items:center;gap:9px;font-size:14px}
.mc{width:20px;height:20px;border-radius:50%;background:var(--o500);display:grid;place-items:center;flex:none}
.mc svg{width:13px;height:13px;fill:none;stroke:var(--hoja);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.mt{position:relative;color:var(--t3);white-space:nowrap}
.mini-pie{font-size:13px;color:var(--t2);margin-top:7px}
.mini-pie b{color:var(--t1)}
.cargando{position:relative;height:104px;margin-top:10px;border-radius:14px;background:rgba(107,115,76,.07);overflow:hidden}
.carg-tx{position:absolute;left:16px;top:14px;font-size:14px;color:var(--t2)}

/* ═══ Utilidades ═══ */
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rng(20261120);
const ICOS={

};
const ico=(n,s=18)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICOS[n]}</svg>`;

function texturas(){
  const tex=(w,h,seed,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,rng(seed),w,h);return `url(${c.toDataURL()})`;};
  const hoja=tex(260,260,7,(x,r,w,h)=>{
    for(let i=0;i<300;i++){x.fillStyle=`rgba(120,90,40,${(0.05+r()*0.11).toFixed(3)})`;x.beginPath();x.arc(r()*w,r()*h,0.4+r()*1.1,0,7);x.fill();}
    for(let i=0;i<46;i++){x.strokeStyle=`rgba(120,90,40,${(0.05+r()*0.07).toFixed(3)})`;x.lineWidth=0.7;const a=r()*w,b=r()*h,g=r()*6.28,l=3+r()*7;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(g)*l,b+Math.sin(g)*l);x.stroke();}
  });
  const kraft=tex(300,300,11,(x,r,w,h)=>{
    for(let i=0;i<1000;i++){x.strokeStyle=`rgba(${r()<.55?'90,62,20':'255,244,210'},${(0.05+r()*0.1).toFixed(3)})`;x.lineWidth=0.5+r()*0.7;const a=r()*w,b=r()*h,g=r()*6.28,l=2+r()*10;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(g)*l,b+Math.sin(g)*l);x.stroke();}

  });

function anillo(d,t,c){
  const N=12,k=Math.round(N*d/t);let s='<svg class="anillo" viewBox="0 0 20 20">';

  return s+'</svg>';
}
function lateral(act){
  const fin=estado==='fin';
  const nav=[['hoy','calendar','Hoy',fin?null:E.pend,'#hoy'],['habitos','sprout','Hábitos',fin?null:1,'#hoy'],['inbox','inbox','Inbox',12,'#vacios'],['actividad','history','Actividad',null,'#actividad']];

  <nav class="nav">${nav.map(([id,ic,tx,n,h])=>`<a href="${h}" class="${id===act?'activa':''}">${ico(ic)}<span>${tx}</span>${n!=null?`<span class="n" ${id==='hoy'?'id="n-nav"':''}>${n}</span>`:''}</a>`).join('')}</nav>
  <div class="grupo">Listas</div>
  <nav class="nav listas">${ls.map(([n,c,d,t])=>`<a href="#hoy">${anillo(d,t,c)}<span>${n}</span><span class="n">${d}/${t}</span></a>`).join('')}</nav>
  <div class="perfil"><span class="avatar">A</span><div><b>Tu cuenta</b><small><i></i>Sincronizado</small></div></div>`;
}

  </svg>`;
}
let guia,mascara,horG,horSvg,pAct=0;
function ponerProgreso(p){
  const L=guia.getTotalLength();
  mascara.style.strokeDasharray=`${L} ${L}`;mascara.style.strokeDashoffset=L*(1-p);
  const a=guia.getPointAtLength(p*L),b=guia.getPointAtLength(Math.min(L,p*L+2)),c=guia.getPointAtLength(Math.max(0,p*L-2));
  const ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI;
  horG.setAttribute('transform',`translate(${a.x.toFixed(2)} ${a.y.toFixed(2)}) rotate(${ang.toFixed(1)})`);
  pAct=p;
}
function avanzar(p1){
  const p0=pAct,t0=performance.now(),D=1200;horSvg.classList.add('anda');
  (function paso(t){const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;ponerProgreso(p0+(p1-p0)*e);if(k<1)requestAnimationFrame(paso);else horSvg.classList.remove('anda');})(t0);
}
function migas(n){document.querySelectorAll('.rastro-svg .miga').forEach((m,i)=>m.classList.toggle('oculta',i>=n));}
function pie(){
  document.getElementById('pie').innerHTML=E.done===E.total
    ?`<b>${E.done} de ${E.total}</b> · todo en el hormiguero`
    :`<b>${E.done} de ${E.total}</b> en el hormiguero${E.venc?` · <span class="venc">${E.venc} vencidas</span>`:''}`;
  const n=document.getElementById('n-nav');if(n)n.textContent=E.pend;
  const m=document.getElementById('mes');if(m)m.textContent=E.pend?`de noviembre · ${E.pend} sin hacer`:'de noviembre · nada pendiente';

/* ═══ Filas ═══ */
function anilloSub([d,t]){
  const N=10,k=Math.round(N*d/t);let s='<svg class="sub-anillo" viewBox="0 0 37 37">';
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;s+=`<circle cx="${(18.5+16*Math.cos(a)).toFixed(2)}" cy="${(18.5+16*Math.sin(a)).toFixed(2)}" r="1.5" style="fill:${i<k?'var(--o500)':'rgba(111,95,62,.28)'}"/>`;}
  return s+'</svg>';
}
function fila(t){
  const [ln,lc]=LISTAS[t.l],m=[];
  if(t.imp)m.push(`<span class="bandera" title="Importante">${ico('flag',16)}</span>`);
  if(t.link)m.push(`<span>${ico('link',14)} 1</span>`);
  if(t.rep)m.push(`<span>${ico('repeat',15)} ${t.rep}</span>`);
  m.push(`<span class="lista" style="color:${lc}"><i></i><span>${ln}</span></span>`);
  if(t.f)m.push(`<span class="pastilla">${t.f} ${ico('arrow',13)}</span>`);
  return `<div class="fila${t.hecha?' hecha':''}"${t.id?` id="${t.id}"`:''}><div class="fila-in">
    <span class="check-wrap">${t.sub?anilloSub(t.sub):''}<button class="check" aria-label="Completar"><span class="chk-bg"></span>${CK.replace('<path','<path pathLength="21"')}</button></span>

    <span class="meta">${m.join('')}</span></div></div>`;
}
function hormigas(n,max=7){
  let s='';for(let i=0;i<n;i++)s+=`<span class="r-hor" style="--d:${(-R()*2.8).toFixed(2)}s">${hormiga()}</span>`;
  for(let i=n;i<max;i++)s+='<span class="faltan"></span>';

}
function habito(h){

/* ═══ Completar: la hormiga se lleva la tarea ═══ */
let ocupado=false;
function llevarse(f,{congelar=null}={}){
  if(ocupado||!f)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){f.classList.add('hecha');return;}
  ocupado=true;
  const cuerpo=document.querySelector('.cuerpo'),capa=cuerpo.querySelector('.capa');
  const cb=cuerpo.getBoundingClientRect(),fr=f.getBoundingClientRect(),tx=f.querySelector('.texto').getBoundingClientRect();
  const W=46,rowTop=fr.top-cb.top,rowH=fr.height;
  const antY=rowTop+rowH-W*0.93,xStart=cb.width+20,xMeet=Math.min(tx.right-cb.left+34,cb.width-300),xEnd=cb.width+80;
  const pos=document.createElement('div');pos.className='hor-pos';
  pos.style.width=pos.style.height=W+'px';
  pos.innerHTML=`<div class="hor-dir">${hormiga({cls:'anda'})}</div>`;
  const dir=pos.firstElementChild;
  const carga=document.createElement('div');carga.className='carga';

  huellas.style.left=(xMeet+W*0.35)+'px';huellas.style.top=(rowTop+rowH-8)+'px';
  capa.append(huellas,pos,carga);
  const cw=carga.offsetWidth,ch=carga.offsetHeight;
  const x0=tx.left-cb.left-29,y0=rowTop+(rowH-ch)/2;
  const cx=x=>x+W*0.62-cw/2,cyTop=antY+W*0.17-ch;
  const T=3200,anims=[];
  const A=(el,fr)=>{const a=el.animate(fr.map(([ms,p,e])=>({...p,offset:ms/T,easing:e||'ease'})),{duration:T,fill:'both'});anims.push(a);return a;};
  const tr=(x,y,r=0)=>`translate(${x}px,${y}px) rotate(${r}deg)`;
  const salir='cubic-bezier(.45,0,.8,.7)';
  A(f.querySelector('.chk-bg'),[[0,{transform:'scale(0)'}],[60,{transform:'scale(0)'},'cubic-bezier(.3,1.6,.5,1)'],[320,{transform:'scale(1)'}],[T,{transform:'scale(1)'}]]);
  A(f.querySelector('.check svg'),[[0,{strokeDashoffset:21}],[180,{strokeDashoffset:21},'ease-out'],[480,{strokeDashoffset:0}],[T,{strokeDashoffset:0}]]);
  A(f.querySelector('.check'),[[0,{borderColor:'rgba(80,56,10,.42)'}],[200,{borderColor:'rgba(80,56,10,0)'}],[T,{borderColor:'rgba(80,56,10,0)'}]]);
  A(f.querySelector('.tachon'),[[0,{clipPath:'inset(-4px 100% -4px -4px)'}],[300,{clipPath:'inset(-4px 100% -4px -4px)'},'ease-in-out'],[780,{clipPath:'inset(-4px -4px -4px -4px)'}],[T,{clipPath:'inset(-4px -4px -4px -4px)'}]]);
  A(f.querySelector('.texto'),[[0,{color:'#2b2213'}],[300,{color:'#2b2213'}],[720,{color:'#94845f'}],[T,{color:'#94845f'}]]);
  A(f.querySelector('.fila-in'),[[0,{opacity:1}],[1500,{opacity:1}],[1650,{opacity:0}],[T,{opacity:0}]]);
  A(f,[[0,{height:rowH+'px'}],[2650,{height:rowH+'px'},'ease-in-out'],[3050,{height:'0px'}],[T,{height:'0px'}]]);
  A(pos,[[0,{transform:tr(xStart,antY)}],[700,{transform:tr(xStart,antY)},'cubic-bezier(.25,.6,.4,1)'],[1450,{transform:tr(xMeet,antY)}],[1950,{transform:tr(xMeet,antY)},salir],[T,{transform:tr(xEnd,antY)}]]);
  A(dir,[[0,{transform:'scaleX(-1)'}],[1780,{transform:'scaleX(-1)'}],[1900,{transform:'scaleX(1)'}],[T,{transform:'scaleX(1)'}]]);
  A(carga,[[0,{transform:tr(x0,y0),opacity:0}],[1480,{transform:tr(x0,y0),opacity:0},'linear'],[1500,{transform:tr(x0,y0),opacity:1},'cubic-bezier(.3,.7,.4,1)'],[1880,{transform:tr(cx(xMeet),cyTop,-5),opacity:1}],[1950,{transform:tr(cx(xMeet),cyTop,-5),opacity:1},salir],[T,{transform:tr(cx(xEnd),cyTop,-5),opacity:1}]]);
  A(huellas,[[0,{width:'0px'}],[1950,{width:'0px'},salir],[T,{width:(xEnd-xMeet)+'px'}]]);
  A(huellas,[[0,{opacity:1}],[2600,{opacity:1}],[2900,{opacity:0}],[T,{opacity:0}]]);
  if(congelar!=null){anims.forEach(a=>{a.pause();a.currentTime=congelar;});return;}
  Promise.all(anims.map(a=>a.finished)).then(()=>{
    f.classList.add('hecha');anims.forEach(a=>a.cancel());[pos,carga,huellas].forEach(n=>n.remove());
    const cont=f.parentElement,ref=[...cont.children].find(x=>x!==f&&x.classList.contains('hecha'));
    cont.insertBefore(f,ref||null);
    f.animate([{height:'0px',opacity:0},{height:rowH+'px',opacity:1}],{duration:420,easing:'ease-out'});
    E.done++;E.pend--;avanzar(E.done/E.total);setTimeout(()=>migas(E.done),1150);pie();ocupado=false;
  });
}

/* ═══ Actividad: tu hormiguero ═══ */
const SHAFT='M540 62 C 540 110, 518 150, 528 200 S 560 280, 542 340 S 516 440, 532 520 S 546 580, 540 640';
function muestreo(d){
  const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');
  s.style.cssText='position:absolute;width:0;height:0;visibility:hidden';p.setAttribute('d',d);s.appendChild(p);document.body.appendChild(s);
  const L=p.getTotalLength(),pts=[];for(let i=0;i<=240;i++){const q=p.getPointAtLength(L*i/240);pts.push([q.x,q.y]);}
  s.remove();
  return y=>{let b=pts[0];for(const q of pts)if(Math.abs(q[1]-y)<Math.abs(b[1]-y))b=q;return b[0];};
}
function enRuta(d,dur,begin,flip,w,miga=false,sup=false){
  const y=sup?-w*0.92:-w*0.55;
  return `<g><animateMotion dur="${dur}s" begin="${begin}" repeatCount="indefinite" rotate="auto" path="${d}"/><g transform="scale(1 ${flip?-1:1})">${hormiga({x:-w/2,y,w,cls:'anda'})}${miga?`<ellipse class="miga-llevada" cx="${(w*0.16).toFixed(1)}" cy="${(y+w*0.06).toFixed(1)}" rx="${(w*0.15).toFixed(1)}" ry="${(w*0.085).toFixed(1)}" transform="rotate(-25 ${(w*0.16).toFixed(1)} ${(y+w*0.06).toFixed(1)})"/>`:''}</g></g>`;
}
function camara(c,r,cols){
  let s=`<g class="camara${c.actual?' cavando':''}"><title>${c.e}: ${c.n} tareas hechas</title>`;
  if(c.actual)s+=`<ellipse class="c-borde-cav" cx="${c.cx}" cy="${c.cy}" rx="${c.rx+4}" ry="${c.ry+4}"/>`;
  s+=`<ellipse class="c-sombra" cx="${c.cx}" cy="${c.cy}" rx="${c.rx}" ry="${c.ry}"/><ellipse class="c-hueco" cx="${c.cx}" cy="${c.cy-3}" rx="${c.rx-3}" ry="${c.ry-4}"/>`;
  let n=c.n;
  for(let row=0;n>0&&row<12;row++){
    const y=c.cy+c.ry-9-row*7.4;if(y<c.cy-c.ry+10)break;
    const half=c.rx*Math.sqrt(Math.max(0,1-((y-c.cy)/c.ry)**2))-11;
    const lim=c.actual?c.cx+half*0.25:c.cx+half;
    for(let x=c.cx-half+(row%2?5:0);x<=lim&&n>0;x+=15.5+r()*2){
      const col=cols[Math.floor(r()*cols.length)],a=((r()-.5)*44).toFixed(0);
      s+=`<rect x="${(x-6.5).toFixed(1)}" y="${(y-3.2).toFixed(1)}" width="13" height="6.4" rx="3.2" style="fill:${col}" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;n--;
    }
  }
  if(c.actual){
    const ax=c.cx+c.rx*0.42,ay=c.cy+c.ry-34;
    s+=hormiga({x:ax-17,y:ay,w:34,cls:'cava'});
    for(let i=0;i<6;i++)s+=`<circle class="tierra-salta" cx="${(ax+16).toFixed(1)}" cy="${(ay+14).toFixed(1)}" r="${(1.6+r()*1.4).toFixed(1)}" style="--dx:${(8+r()*14).toFixed(0)}px;--dy:${(-6-r()*16).toFixed(0)}px;animation-delay:${(i*0.17).toFixed(2)}s"/>`;
  }
  const lx=c.cx+c.dir*(c.rx+22),an=c.dir>0?'start':'end';
  s+=`<text class="etq-1" x="${lx.toFixed(0)}" y="${c.cy-2}" text-anchor="${an}">${c.actual?'Esta semana':c.e}</text><text class="etq-2" x="${lx.toFixed(0)}" y="${c.cy+16}" text-anchor="${an}">${c.actual?c.n+' y contando':c.n+' tareas'}</text>`;
  return s+'</g>';
}
function nido(){
  const W=1080,H=600,G=92,r=rng(42),sx=muestreo(SHAFT);
  const sem=[{e:'16–22 nov',n:9,actual:1},{e:'9–15 nov',n:21},{e:'2–8 nov',n:15},{e:'26 oct – 1 nov',n:23},{e:'19–25 oct',n:9},{e:'12–18 oct',n:18},{e:'5–11 oct',n:12}];
  const ys=[164,230,296,362,428,494,556];
  const cols=['var(--l-trabajo)','var(--l-casa)','var(--l-personal)','var(--l-lect)','var(--l-viajes)','var(--o500)'];
  const cams=sem.map((s,i)=>{const dir=i%2===0?1:-1,cy=ys[i],x0=sx(cy),rx=46+s.n*2.3,ry=21+s.n*.8,cx=Math.round(x0+dir*(150+s.n*3+r()*30));
    return {...s,dir,cx,cy,rx,ry,tun:`M${x0.toFixed(1)} ${cy-6} C ${(x0+dir*60).toFixed(1)} ${cy-8}, ${(cx-dir*(rx+60)).toFixed(1)} ${cy+12}, ${(cx-dir*rx*0.75).toFixed(1)} ${cy+2}`};});
  let s=`<svg class="nido" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tu hormiguero: cada cámara es una semana">`;
  s+=`<defs><clipPath id="cl-t"><rect x="0" y="${G}" width="${W}" height="${H-G+40}" rx="18"/></clipPath></defs>`;
  s+=`<g clip-path="url(#cl-t)"><rect class="tierra" x="0" y="${G}" width="${W}" height="${H}"/>`;
  for(let k=0;k<4;k++){const y=G+70+k*128,a=10+r()*8,h=34+r()*20;
    s+=`<path class="estrato" d="M0 ${y} C 200 ${y-a}, 400 ${y+a}, 600 ${y} S 900 ${y-a}, 1080 ${y+a*.5} L1080 ${y+h} C 880 ${y+h-a}, 700 ${y+h+a}, 500 ${y+h} S 160 ${y+h-a}, 0 ${y+h+a*.4} Z"/>`;}
  for(let i=0;i<520;i++)s+=`<circle class="mota" cx="${(r()*W).toFixed(1)}" cy="${(G+4+r()*(H-G)).toFixed(1)}" r="${(0.6+r()*1.4).toFixed(2)}" opacity="${(0.25+r()*0.45).toFixed(2)}"/>`;
  for(let i=0;i<22;i++){const x=(r()*W).toFixed(0),y=(G+20+r()*(H-G-20)).toFixed(0);s+=`<ellipse class="guijarro" cx="${x}" cy="${y}" rx="${(4+r()*6).toFixed(1)}" ry="${(3+r()*3).toFixed(1)}" transform="rotate(${(r()*60-30).toFixed(0)} ${x} ${y})"/>`;}
  s+=`<path class="t-borde" d="${SHAFT}"/>`;
  cams.forEach(c=>{s+=`<path class="t-borde" d="${c.tun}"/>`;if(!c.actual)s+=`<ellipse class="c-borde" cx="${c.cx}" cy="${c.cy}" rx="${c.rx+5}" ry="${c.ry+5}"/>`;});
  s+=`<path class="t-hueco" d="${SHAFT}"/>`;
  cams.forEach(c=>{s+=`<path class="t-hueco" d="${c.tun}"/>`;});
  cams.forEach(c=>{s+=camara(c,r,cols);});
  s+=enRuta(SHAFT,22,'-3s',false,26);
  s+=enRuta(cams[2].tun,9,'-2s',cams[2].dir<0,24);
  s+=enRuta(cams[3].tun,11,'-6s',cams[3].dir<0,24);
  s+=enRuta(cams[5].tun,10,'-4s',cams[5].dir<0,24);
  s+=`</g>`;
  s+=`<path class="monticulo" d="M436 ${G+1} C 468 34, 612 34, 644 ${G+1} Z"/>`;
  for(let i=0;i<60;i++){const x=448+r()*184,top=G-56*Math.sin(Math.PI*(x-436)/208),y=top+4+r()*(G-top-4);s+=`<circle class="mota" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.6+r()*1.2).toFixed(2)}" opacity="${(0.3+r()*0.4).toFixed(2)}"/>`;}
  s+=`<ellipse class="entrada" cx="540" cy="58" rx="13" ry="6.5"/>`;
  s+=`<path class="suelo" d="M0 ${G} H${W}"/>`;
  for(let i=0;i<36;i++){const x=r()*W;if(x>420&&x<660)continue;s+=`<path class="hierba" d="M${x.toFixed(0)} ${G} l-4 -9 M${x.toFixed(0)} ${G} l0.5 -12 M${x.toFixed(0)} ${G} l5 -8"/>`;}
  s+=enRuta(`M30 ${G-1} C 180 ${G-2}, 330 ${G+1}, 446 ${G-3} C 476 72, 506 60, 530 58`,15,'-5s',false,24,true,true);
  s+=enRuta(`M1050 ${G-1} C 900 ${G+1}, 760 ${G-3}, 634 ${G-3} C 604 72, 574 60, 550 58`,18,'-9s',true,24,true,true);
  return s+'</svg>';
}
function actividadHTML(){
