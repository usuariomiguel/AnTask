<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Política de privacidad · AnTrack</title>
    <meta name="description" content="Qué datos trata AnTrack, dónde se guardan y cuáles son tus derechos." />
    <!-- Tema antes de pintar: el guardado en la app o, si no hay, el del
         sistema. Mismo criterio que el <head> de la app. -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("mis-tareas-theme");
          if (tema !== "light" && tema !== "dark") {
            tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = tema;
        } catch (e) { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'self'; form-action 'self';" />
    <meta name="theme-color" content="#f8e1aa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080605" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%/privacidad/" />

    <!-- Vista previa al compartir el enlace (Open Graph + X/Twitter). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnTrack" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Política de privacidad · AnTrack" />
    <meta property="og:description" content="Qué datos trata AnTrack, dónde se guardan y cuáles son tus derechos." />
    <meta property="og:url" content="%SITE_URL%/privacidad/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AnTrack: Haz hoy. Repite mañana." />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Qué datos trata AnTrack, dónde se guardan y cuáles son tus derechos." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <link rel="stylesheet" href="/src/css/landing.css" />
    <script type="module" src="/src/js/landing.js"></script>
  </head>

        <button type="button" class="tema-toggle" data-tema-toggle aria-label="Cambiar entre tema claro y oscuro" title="Cambiar entre tema claro y oscuro">
